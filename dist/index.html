function storageProbe() {
  const k = 'rozpocet:probe';
  try {
    const ls = storageRaw();
    if (!ls) { storageOk = false; storageReason = 'missing'; return { ok: false, reason: 'missing' }; }
    ls.setItem(k, '1');
    const back = ls.getItem(k);
    ls.removeItem(k);
    if (back !== '1') { storageOk = false; storageReason = 'readback'; return { ok: false, reason: 'readback' }; }
    storageOk = true; storageReason = 'ok';
    return { ok: true, reason: 'ok' };
  } catch (e) {
    storageOk = false;
    const n = (e && e.name) || '';
    storageReason = (n === 'SecurityError') ? 'blocked'
      : saveIsQuota(e) ? 'quota'
      : 'error';
    // Nikdy to nespolknout potichu — volající to musí umět ukázat.
    return { ok: false, reason: storageReason, error: String((e && e.message) || e) };
  }
}

function storageGet(key) {
  // Čte se VŽDYCKY, i když zkouška zápisu selhala. Plný telefon nebo
  // zamčené úložiště brání psaní, ne čtení — a kdyby se tu na disk nesáhlo,
  // appka by naběhla prázdná, zatímco její data by ležela pár bajtů vedle.
  const ls = storageRaw();
  if (ls) {
    try { const v = ls.getItem(key); if (v !== null && v !== undefined) return v; }
    catch (e) { /* níž z paměti */ }
  }
  const v = storageMem.get(key);
  return v === undefined ? null : v;
}

// Vyhazuje ven (hlavně QuotaExceededError). Volající se musí rozhodnout.
function storageSet(key, val) {
  const s = String(val);
  if (storageOk) {
    const ls = storageRaw();
    if (ls) { ls.setItem(key, s); storageMem.set(key, s); return true; }
  }
  storageMem.set(key, s);
  return true;
}

function storageRemove(key) {
  if (storageOk) {
    const ls = storageRaw();
    if (ls) { try { ls.removeItem(key); } catch (e) { /* nevadí */ } }
  }
  storageMem.delete(key);
}

function storageKeys(prefix) {
  const out = [], seen = new Set();
  if (storageOk) {
    const ls = storageRaw();
    if (ls) {
      try {
        for (let i = 0; i < ls.length; i++) {
          const k = ls.key(i);
          if (k && k.indexOf(prefix) === 0 && !seen.has(k)) { seen.add(k); out.push(k); }
        }
      } catch (e) { /* nevadí */ }
    }
  }
  storageMem.forEach(function (v, k) {
    if (k.indexOf(prefix) === 0 && !seen.has(k)) { seen.add(k); out.push(k); }
  });
  return out;
}

function storageStatus() {
  return { ok: storageOk, reason: storageReason, snapshots: storageKeys(SNAP_PREFIX).length,
           quarantined: storageKeys(QUAR_PREFIX).length, locked: loadBlocked };
}

/* ---------- migrace ----------
   Dopředu, čistě, jedna funkce na jeden krok verze. MIGRATIONS[1] je
   identita schválně: cesta se tím prochází od prvního dne, takže až
   přibude MIGRATIONS[2], není to poprvé, co se ten kód spustí. */

const MIGRATIONS = {
  1: function migrate_v1(doc) { return doc; }
};

// migrate(raw) -> { ok, doc, from, to, steps, reason }
// Dokument novější než SCHEMA se ODMÍTÁ a payload zůstane nedotčený.
function migrate(raw) {
  const base = { ok: false, doc: null, from: null, to: SCHEMA, steps: [], reason: '' };
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) { base.reason = 'shape'; return base; }
  // Dokument bez čísla verze bereme jako v1. Ručně upravená nebo hodně stará
  // záloha se tím dá načíst; kdyby v ní byla vadná čísla, chytí je validace
  // a řekne to nahlas — potichu se nic neopraví.
  let from = raw.schema;
  if (from === undefined || from === null) {
    if (raw.years && typeof raw.years === 'object') from = 1;
  }
  base.from = from;
  if (!Number.isInteger(from) || from < 1) { base.reason = 'schema'; return base; }
  if (from > SCHEMA) { base.reason = 'newer'; return base; }

  let doc = storageClone(raw);            // originál se nikdy nemění
  const steps = [];
  for (let v = from; v <= SCHEMA; v++) {
    const fn = MIGRATIONS[v];
    if (typeof fn !== 'function') { base.reason = 'nostep'; base.steps = steps; return base; }
    const next = fn(doc);
    if (!next || typeof next !== 'object') { base.reason = 'badstep'; base.steps = steps; return base; }
    doc = next;
    steps.push(v);
  }
  doc.schema = SCHEMA;
  storageNormalize(doc);
  return { ok: true, doc: doc, from: from, to: SCHEMA, steps: steps, reason: 'ok' };
}

/* Doplní CHYBĚJÍCÍ pole a srovná typy, které nesou riziko (bool, enum).
   Částek se nedotýká — poškozené číslo musí padnout na validaci, ne se
   potichu opravit. Musí být idempotentní, jinak migrate() není idempotentní. */
function storageNormalize(doc) {
  const THEMES = { auto: 1, light: 1, dark: 1 };
  const SCREENS = { month: 1, year: 1, journal: 1, savings: 1, more: 1 };
  const nowY = new Date().getFullYear();

  doc.app = 'rozpocet';
  if (!Number.isInteger(doc.rev) || doc.rev < 0) doc.rev = 0;
  if (typeof doc.deviceId !== 'string' || !doc.deviceId) doc.deviceId = uid('d_');
  if (!Number.isInteger(doc.activeYear)) doc.activeYear = nowY;
  doc.isDemo = doc.isDemo === true;
  if (doc.savedAt !== null && typeof doc.savedAt !== 'string') doc.savedAt = null;

  const s = (doc.settings && typeof doc.settings === 'object') ? doc.settings : {};
  doc.settings = s;
  if (!THEMES[s.theme]) s.theme = 'auto';
  if (!Number.isInteger(s.dueSoonDays)) s.dueSoonDays = 7;
  s.dueSoonDays = clamp(s.dueSoonDays, 0, 60);
  s.autofillOnPaid = s.autofillOnPaid !== false;
  if (typeof s.syncUrl !== 'string') s.syncUrl = '';
  if (typeof s.syncSecret !== 'string') s.syncSecret = '';
  if (typeof s.lastSyncAt !== 'string') s.lastSyncAt = null;
  if (typeof s.lastExportAt !== 'string') s.lastExportAt = null;
  if (typeof s.installNagDismissedAt !== 'string') s.installNagDismissedAt = null;

  const u = (doc.ui && typeof doc.ui === 'object') ? doc.ui : {};
  doc.ui = u;
  if (!SCREENS[u.screen]) u.screen = 'month';
  if (!Number.isInteger(u.month)) u.month = new Date().getMonth();
  u.month = clamp(u.month, 0, 11);
  if (typeof u.yearTab !== 'string') u.yearTab = 'summary';
  if (typeof u.journalFilter !== 'string') u.journalFilter = 'all';

  if (!doc.years || typeof doc.years !== 'object' || Array.isArray(doc.years)) doc.years = {};
  Object.keys(doc.years).forEach(function (yk) {
    const yr = doc.years[yk];
    if (!yr || typeof yr !== 'object' || Array.isArray(yr)) { delete doc.years[yk]; return; }
    if (!Number.isInteger(yr.year)) yr.year = parseInt(yk, 10) || nowY;
    if (!Array.isArray(yr.catalog)) yr.catalog = [];
    if (!Array.isArray(yr.tx)) yr.tx = [];
    if (!Array.isArray(yr.months)) yr.months = [];
    for (let m = 0; m < 12; m++) {
      const mo = yr.months[m];
      if (!mo || typeof mo !== 'object' || Array.isArray(mo)) yr.months[m] = { m: m, note: '', entries: [] };
      else {
        mo.m = m;
        if (typeof mo.note !== 'string') mo.note = '';
        if (!Array.isArray(mo.entries)) mo.entries = [];
      }
    }
    yr.months.length = 12;

    yr.catalog.forEach(function (c) {
      if (!c || typeof c !== 'object') return;
      if (typeof c.name !== 'string') c.name = '';
      if (typeof c.icon !== 'string') c.icon = '';
      if (!Number.isInteger(c.order)) c.order = 0;
      c.recurring = c.recurring !== false;
      c.archived = c.archived === true;
      if (c.dueDay === undefined) c.dueDay = null;
      if (c.goal === undefined) c.goal = null;
      if (typeof c.createdAt !== 'string') c.createdAt = storageStamp();
      if (typeof c.updatedAt !== 'string') c.updatedAt = c.createdAt;
    });
    yr.months.forEach(function (mo) {
      mo.entries.forEach(function (e) {
        if (!e || typeof e !== 'object') return;
        if (e.act === undefined) e.act = null;      // undefined by JSON.stringify zmizelo
        if (e.due === undefined) e.due = null;
        if (e.paidAt === undefined) e.paidAt = null;
        e.paid = e.paid === true;
        e.del = e.del === true;
        e.autoFilled = e.autoFilled === true;
        if (typeof e.updatedAt !== 'string') e.updatedAt = storageStamp();
      });
    });
    yr.tx.forEach(function (t) {
      if (!t || typeof t !== 'object') return;
      if (typeof t.note !== 'string') t.note = '';
      if (t.cat === undefined) t.cat = null;
      t.del = t.del === true;
      if (typeof t.updatedAt !== 'string') t.updatedAt = storageStamp();
    });
  });
  return doc;
}

/* ---------- validace ----------
   JSON.stringify({a:NaN}) tiše vyrobí {"a":null}. NaN se proto musí chytit
   při ZÁPISU, ne až při příštím načtení. Proto saveNow() validuje vždy. */
function validateDoc(doc) {
  const p = [];
  function bad(s) { if (p.length < 60) p.push(s); }
  function amount(v) { return Number.isSafeInteger(v); }
  function dayOk(v) { return v === null || (Number.isInteger(v) && v >= 1 && v <= 31); }

  if (!doc || typeof doc !== 'object' || Array.isArray(doc)) return ['kořen není objekt'];
  if (!Number.isInteger(doc.schema)) bad('schema není celé číslo');
  if (doc.app !== undefined && doc.app !== 'rozpocet') bad('app není "rozpocet"');
  if (doc.rev !== undefined && !Number.isInteger(doc.rev)) bad('rev není celé číslo');

  const ys = doc.years;
  if (!ys || typeof ys !== 'object' || Array.isArray(ys)) { bad('chybí mapa years'); return p; }

  Object.keys(ys).forEach(function (yk) {
    const yr = ys[yk], at = 'years.' + yk;
    if (!yr || typeof yr !== 'object' || Array.isArray(yr)) { bad(at + ': není objekt'); return; }
    if (!Array.isArray(yr.catalog)) { bad(at + '.catalog není pole'); return; }
    if (!Array.isArray(yr.months) || yr.months.length !== 12) { bad(at + '.months není 12 položek'); return; }
    if (!Array.isArray(yr.tx)) { bad(at + '.tx není pole'); return; }

    const catIds = new Set();
    yr.catalog.forEach(function (c, i) {
      const w = at + '.catalog[' + i + ']';
      if (!c || typeof c !== 'object') { bad(w + ': není objekt'); return; }
      if (typeof c.id !== 'string' || !c.id) bad(w + '.id chybí');
      else if (catIds.has(c.id)) bad(w + '.id je duplicitní: ' + c.id);
      else catIds.add(c.id);
      if (!SECTION_BY_KEY[c.sec]) bad(w + '.sec je neznámá: ' + String(c.sec));
      if (typeof c.name !== 'string') bad(w + '.name není text');
      if (!Number.isInteger(c.order)) bad(w + '.order není celé číslo');
      if (!dayOk(c.dueDay === undefined ? null : c.dueDay)) bad(w + '.dueDay je mimo 1..31');
      if (c.goal !== null && c.goal !== undefined) {
        if (typeof c.goal !== 'object') bad(w + '.goal není objekt');
        else {
          if (!amount(c.goal.target)) bad(w + '.goal.target nejsou celé haléře');
          if (!amount(c.goal.startBalance)) bad(w + '.goal.startBalance nejsou celé haléře');
          if (c.goal.targetDate !== null && c.goal.targetDate !== undefined
              && !parseYmd(c.goal.targetDate)) bad(w + '.goal.targetDate není datum');
        }
      }
    });

    const entryIds = new Set();
    yr.months.forEach(function (mo, m) {
      const wm = at + '.months[' + m + ']';
      if (!mo || typeof mo !== 'object') { bad(wm + ': není objekt'); return; }
      if (mo.m !== m) bad(wm + '.m neodpovídá indexu');
      if (!Array.isArray(mo.entries)) { bad(wm + '.entries není pole'); return; }
      // Dva živé řádky téže kategorie v jednom měsíci = násobené výdaje.
      // effActual dá součet z deníku KAŽDÉMU z nich, takže dvojitý řádek
      // ukáže dvojnásobek toho, co uživatelka utratila.
      const catSeen = new Set();
      mo.entries.forEach(function (e, i) {
        const w = wm + '.entries[' + i + ']';
        if (!e || typeof e !== 'object') { bad(w + ': není objekt'); return; }
        if (typeof e.id !== 'string' || !e.id) bad(w + '.id chybí');
        else if (entryIds.has(e.id)) bad(w + '.id je duplicitní: ' + e.id);
        else entryIds.add(e.id);
        if (typeof e.cat !== 'string' || !e.cat) bad(w + '.cat chybí');
        else if (!e.del) {
          if (catSeen.has(e.cat)) bad(w + ': kategorie ' + e.cat + ' má v tomhle měsíci dva řádky');
          else catSeen.add(e.cat);
        }
        if (e.plan !== null && e.plan !== undefined && !amount(e.plan)) bad(w + '.plan nejsou celé haléře: ' + String(e.plan));
        if (e.act !== null && e.act !== undefined && !amount(e.act)) bad(w + '.act nejsou celé haléře: ' + String(e.act));
        if (!dayOk(e.due === undefined ? null : e.due)) bad(w + '.due je mimo 1..31');
        if (e.paidAt !== null && e.paidAt !== undefined && !parseYmd(e.paidAt)) bad(w + '.paidAt není datum');
      });
    });

    const txIds = new Set();
    yr.tx.forEach(function (t, i) {
      const w = at + '.tx[' + i + ']';
      if (!t || typeof t !== 'object') { bad(w + ': není objekt'); return; }
      if (typeof t.id !== 'string' || !t.id) bad(w + '.id chybí');
      else if (txIds.has(t.id)) bad(w + '.id je duplicitní: ' + t.id);
      else txIds.add(t.id);
      if (!parseYmd(t.d)) bad(w + '.d není datum: ' + String(t.d));
      if (!Number.isInteger(t.m) || t.m < 0 || t.m > 11) bad(w + '.m je mimo 0..11');
      if (!amount(t.amt)) bad(w + '.amt nejsou celé haléře: ' + String(t.amt));
      if (t.cat !== null && t.cat !== undefined && typeof t.cat !== 'string') bad(w + '.cat není text');
    });
  });
  return p;
}

/* ---------- ukládání ---------- */

let saveLastGood = null;     // poslední JSON, o kterém víme, že byl v pořádku
let savePending = false;
let saveBackupAt = 0;
let saveStatus = { ok: true, reason: 'idle', at: null, problems: [] };

function saveIsQuota(e) {
  if (!e) return false;
  const n = e.name || '';
  return n === 'QuotaExceededError' || n === 'NS_ERROR_DOM_QUOTA_REACHED'
      || e.code === 22 || e.code === 1014;
}

const saveDebounced = debounce(function () { if (savePending) saveNow(); }, 400, 3000);

function scheduleSave() { savePending = true; saveDebounced(); }

// Synchronně, pro pagehide / beforeunload.
function flushSave() {
  // I když savePending zůstal viset po chybě, tohle je poslední pokus.
  if (savePending || !saveStatus.ok) return saveNow();
  return saveStatus;
}

// Selhání zápisu se musí dostat ven. Bez tohohle appka mlčky nic neukládá
// a v Nastavení pořád svítí, že ukládání funguje.
function saveReport() {
  if (!saveStatus.ok && typeof saveProblemNotify === 'function') {
    try { saveProblemNotify(saveStatus); } catch (e) {}
  }
  return saveStatus;
}

function saveNow() {
  // savePending se NESHAZUJE tady. Kdyby ano, po neúspěšném zápisu by
  // debounce ani flushSave() na pagehide už nic nezkusily — právě ve chvíli,
  // kdy je to poslední šance.
  if (!state || typeof state !== 'object') {
    saveStatus = { ok: false, reason: 'nostate', at: Date.now(), problems: [] };
    return saveReport();
  }
  // Po havarijním načtení se do hlavního klíče nesahá, dokud uživatelka nerozhodne.
  if (loadBlocked) {
    saveStatus = { ok: false, reason: 'locked', at: Date.now(), problems: [] };
    return saveReport();
  }
  // Vlastní kontrola si na chvíli sahá do stavu. Po tu dobu se na disk
  // nesmí sáhnout, jinak by tam zůstal její pískovištní rok.
  if (typeof saveSuspended !== 'undefined' && saveSuspended) {
    saveStatus = { ok: true, reason: 'pozastaveno', at: Date.now(), problems: [] };
    return saveStatus;
  }
  const problems = validateDoc(state);
  if (problems.length) {
    saveStatus = { ok: false, reason: 'invalid', at: Date.now(), problems: problems.slice(0, 10) };
    return saveReport();
  }
  state.savedAt = storageStamp();
  let json;
  try { json = JSON.stringify(state); }
  catch (e) { saveStatus = { ok: false, reason: 'stringify', at: Date.now(), problems: [] }; return saveReport(); }

  const prev = saveLastGood;
  let wrote = false, quota = false;
  try { storageSet(STORE_KEY, json); wrote = true; }
  catch (e) {
    if (saveIsQuota(e)) {
      quota = true;
      // Uvolnit se má nejdřív karanténa, snímky až v krajní nouzi — jsou
      // to jediné cesty zpátky. Dřív se z osmi nechaly dva.
      try { quarantinePrune(1); } catch (e2) {}
      try { storageSet(STORE_KEY, json); wrote = true; } catch (e3) { snapshotPrune(5); }
      try { storageSet(STORE_KEY, json); wrote = true; } catch (e2) { wrote = false; }
    }
  }
  if (!wrote) {
    // Data v paměti zůstávají netknutá a nic se nemaže.
    saveStatus = { ok: false, reason: quota ? 'quota' : 'write', at: Date.now(), problems: [] };
    return saveReport();
  }
  // Záloha nese PŘEDCHOZÍ dobrý stav, aby jeden špatný zápis nesebral oba.
  writeBackup(prev || json);
  saveLastGood = json;
  savePending = false;                 // teprve teď je opravdu uloženo
  saveStatus = { ok: true, reason: quota ? 'ok-po-uklidu' : 'ok', at: Date.now(), problems: [] };
  // Povedlo se — pruh o chybě musí zmizet, jinak by strašil i po nápravě.
  if (typeof saveRecovered === 'function') { try { saveRecovered(quota); } catch (e) {} }
  return saveStatus;
}

function writeBackup(json, force) {
  const payload = (typeof json === 'string' && json) ? json : saveLastGood;
  if (!payload) return { ok: false, reason: 'nodata' };
  const now = Date.now();
  if (!force && saveBackupAt && (now - saveBackupAt) < 60000) return { ok: true, reason: 'throttled' };
  try { storageSet(BACKUP_KEY, payload); saveBackupAt = now; return { ok: true, reason: 'ok' }; }
  catch (e) { return { ok: false, reason: saveIsQuota(e) ? 'quota' : 'write' }; }
}

/* ---------- karanténa ---------- */

function quarantineWrite(raw) {
  const key = QUAR_PREFIX + Date.now();
  try { storageSet(key, String(raw)); return key; }
  catch (e) {
    // Snímky jsou cesta zpátky, ubírá se z nich opatrně a až v nouzi.
    try {
      snapshotPrune(4);
      storageSet(key, String(raw));
      return key;
    } catch (e2) { return null; }
  }
}

// Ubere staré odložené kopie, nejnovější nechá být.
function quarantinePrune(keep) {
  const k = Number.isInteger(keep) && keep >= 0 ? keep : 1;
  const list = quarantineList();
  let removed = 0;
  for (let i = k; i < list.length; i++) { storageRemove(list[i].key); removed += 1; }
  return removed;
}

function quarantineList() {
  return storageKeys(QUAR_PREFIX).map(function (key) {
    const v = storageGet(key);
    const at = parseInt(key.slice(QUAR_PREFIX.length), 10);
    return { key: key, at: Number.isFinite(at) ? at : 0, size: v ? v.length : 0 };
  }).sort(function (a, b) { return b.at - a.at; });
}

/* ---------- snapshoty ---------- */

let snapshotSeq = 0;

function snapshotSave(reason, payload) {
  let doc = null;
  if (typeof payload === 'string') { try { doc = JSON.parse(payload); } catch (e) { doc = null; } }
  else if (payload && typeof payload === 'object') doc = payload;
  else doc = state;
  if (!doc || typeof doc !== 'object') return null;

  snapshotSeq += 1;
  const key = SNAP_PREFIX + Date.now() + '-' + snapshotSeq;
  let json;
  try {
    json = JSON.stringify({ at: Date.now(), reason: String(reason || ''), rev: doc.rev | 0,
                            schema: doc.schema, doc: doc });
  } catch (e) { return null; }
  try { storageSet(key, json); }
  catch (e) {
    // Došlo místo. Uvolní se poškozené odložené kopie, ne snímky — ty jsou
    // často jediná cesta zpátky. Teprve když to nestačí, ubere se i ze snímků.
    // Nejnovější odložená kopie zůstává vždycky — je to jediný zbytek
    // původních bajtů. Uvolňují se jen ty starší.
    try { quarantinePrune(1); } catch (e2) {}
    try { storageSet(key, json); }
    catch (e3) {
      snapshotPrune(3);
      try { storageSet(key, json); } catch (e4) { return null; }
    }
  }
  snapshotPrune(8);
  return key;
}

function snapshotList() {
  return storageKeys(SNAP_PREFIX).map(function (key) {
    const s = storageGet(key);
    let at = parseInt(key.slice(SNAP_PREFIX.length), 10);
    let reason = '', rev = 0, ok = false;
    if (s) {
      try {
        const r = JSON.parse(s);
        if (r && typeof r === 'object') {
          ok = !!(r.doc && typeof r.doc === 'object');
          if (Number.isFinite(r.at)) at = r.at;
          reason = typeof r.reason === 'string' ? r.reason : '';
          rev = r.rev | 0;
        }
      } catch (e) { /* poškozený snapshot se jen nepoužije */ }
    }
    // Pořadové číslo z klíče rozhoduje, když dva snímky padnou do stejné
    // milisekundy. Bez toho prořezávání zahodí ten nejnovější.
    const seq = parseInt((key.split('-')[1] || '0'), 10) || 0;
    return { key: key, at: Number.isFinite(at) ? at : 0, seq: seq, reason: reason, rev: rev,
             size: s ? s.length : 0, ok: ok };
  }).sort(function (a, b) { return (b.at - a.at) || (b.seq - a.seq); });   // nejnovější první
}

function snapshotRead(key) {
  const s = storageGet(key);
  if (!s) return null;
  try { const r = JSON.parse(s); return (r && r.doc && typeof r.doc === 'object') ? r.doc : null; }
  catch (e) { return null; }
}

function snapshotPrune(max) {
  const keep = Number.isInteger(max) && max >= 0 ? max : 8;
  const list = snapshotList();
  let removed = 0;
  for (let i = keep; i < list.length; i++) { storageRemove(list[i].key); removed += 1; }
  return removed;
}

// Obnova je sama vratná: nejdřív si odloží současný stav.
function snapshotRestore(key) {
  const doc = snapshotRead(key);
  if (!doc) return { ok: false, reason: 'missing' };
  snapshotSave('pred-obnovou');
  const mig = migrate(doc);
  if (!mig.ok) return { ok: false, reason: mig.reason };
  const problems = validateDoc(mig.doc);
  if (problems.length) return { ok: false, reason: 'invalid', problems: problems.slice(0, 10) };
  state = mig.doc;
  loadBlocked = false;
  saveLastGood = null;
  invalidateAll();
  saveNow();
  return { ok: true, reason: 'ok' };
}

/* ---------- načítání ---------- */

let loadBlocked = false;    // po havárii se do hlavního klíče nezapisuje
let loadReport = null;

function loadParseObj(obj) {
  const mig = migrate(obj);
  if (!mig.ok) return { ok: false, reason: mig.reason, from: mig.from };
  const problems = validateDoc(mig.doc);
  if (problems.length) return { ok: false, reason: 'invalid', problems: problems, from: mig.from };
  return { ok: true, reason: 'ok', doc: mig.doc, from: mig.from, steps: mig.steps };
}

function loadParse(str) {
  let obj;
  try { obj = JSON.parse(String(str)); }
  catch (e) { return { ok: false, reason: 'parse' }; }
  return loadParseObj(obj);
}

function loadUnblock(doSave) {
  loadBlocked = false;
  return doSave ? saveNow() : { ok: true, reason: 'unblocked' };
}

// loadState() -> report. Zároveň nastaví `state`.
// source: 'main' | 'new' | 'backup' | 'snapshot' | 'empty' | 'newer'
function loadState() {
  if (storageReason === 'unprobed') storageProbe();
  const rep = {
    ok: false, source: 'empty', reason: '', problems: [],
    quarantineKey: null, migratedFrom: null, locked: false,
    storage: { ok: storageOk, reason: storageReason }
  };

  const raw = storageGet(STORE_KEY);
  if (raw === null || raw === '') {
    state = emptyDoc();
    saveLastGood = null;
    rep.ok = true; rep.source = 'new'; rep.reason = 'prazdno';
    loadReport = rep;
    return rep;
  }

  let parsed = null, parseOk = true;
  try { parsed = JSON.parse(String(raw)); } catch (e) { parseOk = false; }

  // Snapshot PŘED první migrací — ještě než se čehokoliv dotkneme.
  // Snímek se dělá vždy, když se chystáme dokument změnit — tedy i u
  // souboru bez čísla verze, který se bere jako v1 a projde srovnáním polí.
  if (parseOk && parsed && typeof parsed === 'object'
      && (!Number.isInteger(parsed.schema) || parsed.schema < SCHEMA)) {
    snapshotSave('pred-migraci', raw);
  }

  const first = parseOk ? loadParseObj(parsed) : { ok: false, reason: 'parse' };

  if (first.ok) {
    state = first.doc;
    rep.ok = true; rep.source = 'main'; rep.reason = 'ok';
    rep.migratedFrom = first.from;
    if (first.from === SCHEMA) {
      saveLastGood = String(raw);
    } else {
      saveLastGood = null;
      scheduleSave();                 // zmigrovaný tvar je potřeba uložit
    }
    loadReport = rep;
    return rep;
  }

  // Novější dokument z jiného zařízení: neodmigrujeme ho dozadu a ani na něj nesáhneme.
  if (first.reason === 'newer') {
    // Dokument z novější verze je pořád platná data. Musí se odložit stranou
    // stejně jako poškozený, jinak ho import zálohy nebo vymazání přepíše
    // a všechno, co novější zařízení stihlo zapsat, je pryč.
    rep.quarantineKey = quarantineWrite(String(raw));
    state = emptyDoc();
    loadBlocked = true;
    rep.ok = false; rep.source = 'newer'; rep.reason = 'newer'; rep.locked = true;
    loadReport = rep;
    return rep;
  }

  // Cokoliv jiného je havárie: originál doslova do karantény, nikdy do koše.
  rep.reason = first.reason;
  rep.problems = (first.problems || []).slice(0, 10);
  rep.quarantineKey = quarantineWrite(String(raw));

  const b = storageGet(BACKUP_KEY);
  if (b) {
    const fromBackup = loadParse(b);
    if (fromBackup.ok) { state = fromBackup.doc; rep.ok = true; rep.source = 'backup'; }
  }
  if (!rep.ok) {
    const snaps = snapshotList();
    for (let i = 0; i < snaps.length; i++) {
      const doc = snapshotRead(snaps[i].key);
      if (!doc) continue;
      const fromSnap = loadParseObj(doc);
      if (fromSnap.ok) {
        state = fromSnap.doc; rep.ok = true; rep.source = 'snapshot';
        rep.snapshotKey = snaps[i].key;
        break;
      }
    }
  }
  if (!rep.ok) { state = emptyDoc(); rep.source = 'empty'; }

  // Zamykat ukládání má smysl JEN tehdy, když se poškozený originál
  // nepodařilo nikam odložit. Když je v karanténě, je z čeho vycházet a
  // appka musí dál normálně ukládat — jinak by uživatelka celé týdny psala
  // do prázdna a nikde by se to nedozvěděla.
  loadBlocked = !rep.quarantineKey;
  rep.locked = loadBlocked;
  loadReport = rep;
  return rep;
}

/* ======================= 33-model.js ======================= */
// 33-model.js — stav a mutace, žádné vykreslování, žádný DOM — vlastní: L2
// Každá změna jde přes bump(): orazítkuje záznam, zvedne state.rev a naplánuje uložení.
// Částky jsou vždy celé haléře a vždy KLADNÉ. Směr určuje SECTIONS[sec].dir.

let state = emptyDoc();

/* ---------- jádro ---------- */

function bump(rec) {
  if (rec && typeof rec === 'object') rec.updatedAt = storageStamp();
  state.rev = (state.rev | 0) + 1;
  scheduleSave();
  return rec;
}

/* ---------- vratné kroky ----------
   Zásobník žije jen v paměti (funkce se neserializují), proto visí na
   undoPush a ne na state — jinak by to bylo další jméno navíc. */
undoPush.stack = [];

function undoPush(label, undoFn) {
  if (typeof undoFn !== 'function') return null;
  const item = { label: String(label || ''), fn: undoFn, at: Date.now() };
  undoPush.stack.push(item);
  while (undoPush.stack.length > 20) undoPush.stack.shift();
  return item;
}

function undoLast() {
  const item = undoPush.stack.pop();
  if (!item) return { ok: false, reason: 'empty' };
  try { item.fn(); } catch (e) { return { ok: false, reason: 'error', label: item.label }; }
  return { ok: true, label: item.label };
}

/* ---------- čtení ----------
   getYear() rok v případě potřeby založí (líně, idempotentně, bez bumpu) —
   renderery se nesmí lámat na tom, že se uživatelka přepnula do roku,
   který ještě neexistuje. */

function getYear(y) {
  const key = String(Number.isInteger(y) ? y : state.activeYear);
  let yr = state.years[key];
  if (!yr) { yr = newYear(parseInt(key, 10)); state.years[key] = yr; }
  return yr;
}

function getMonthObj(m, y) {
  const yr = getYear(y);
  const i = clamp(Number.isInteger(m) ? m : state.ui.month, 0, 11);
  let mo = yr.months[i];
  if (!mo || typeof mo !== 'object') { mo = { m: i, note: '', entries: [] }; yr.months[i] = mo; }
  if (!Array.isArray(mo.entries)) mo.entries = [];
  mo.m = i;
  return mo;
}

function getCat(catId, y) {
  const list = getYear(y).catalog;
  for (let i = 0; i < list.length; i++) if (list[i].id === catId) return list[i];
  return null;
}

function getEntry(m, entryId, y) {
  const list = getMonthObj(m, y).entries;
  for (let i = 0; i < list.length; i++) if (list[i].id === entryId) return list[i];
  return null;
}

/* ---------- zakládání ----------
   IDEMPOTENTNÍ. Pětkrát zavolané ensureMonth() musí dát totéž co jednou —
   opakovaně se množící trvalka je jedna z nejhorších možných chyb. */

function ensureEntry(m, catId, y) {
  const mo = getMonthObj(m, y);
  for (let i = 0; i < mo.entries.length; i++) {
    // Smazaný záznam se VRACÍ tak, jak je: náhrobek brání tomu, aby
    // ensureMonth() vzkřísil položku, kterou uživatelka z měsíce vyhodila.
    if (mo.entries[i].cat === catId) return mo.entries[i];
  }
  const cat = getCat(catId, y);
  if (!cat) return null;
  const e = {
    // plan: null = nezadáno. Nula by na obrazovce tvrdila, že plán je
    // nula korun, což není totéž jako „ještě jsem nic neplánovala".
    id: uid('e_'), cat: catId, plan: null, act: null,
    paid: false, paidAt: null, due: null,
    autoFilled: false, del: false, updatedAt: storageStamp()
  };
  mo.entries.push(e);
  bump(e);
  return e;
}

function ensureMonth(y, m) {
  const yr = getYear(y);
  const mo = getMonthObj(m, y);
  for (let i = 0; i < yr.catalog.length; i++) {
    const c = yr.catalog[i];
    if (!c || c.archived || c.recurring === false) continue;
    ensureEntry(mo.m, c.id, y);
  }
  return mo;
}

/* ---------- katalog ----------
   Pořadí je na katalogu, tedy společné pro celý rok — všech dvanáct měsíců
   vypisuje řádky stejně. Krok 10, aby šlo mezi ně vsunout. */

function addCatalogItem(def, scope, y) {
  const d = def || {};
  const yr = getYear(y);
  const sec = SECTION_BY_KEY[d.sec] ? d.sec : 'daily';
  const meta = SECTION_BY_KEY[sec];
  let maxOrder = 0;
  for (let i = 0; i < yr.catalog.length; i++) {
    const c = yr.catalog[i];
    if (c.sec === sec && Number.isInteger(c.order) && c.order > maxOrder) maxOrder = c.order;
  }
  const stamp = storageStamp();
  const cat = {
    id: uid('c_'),
    sec: sec,
    name: String(d.name === undefined || d.name === null ? '' : d.name).trim(),
    icon: typeof d.icon === 'string' ? d.icon : '',
    order: maxOrder + 10,
    recurring: d.recurring !== false,
    dueDay: (meta.hasDue && Number.isInteger(d.dueDay) && d.dueDay >= 1 && d.dueDay <= 31) ? d.dueDay : null,
    goal: null,
    archived: false,
    createdAt: stamp,
    updatedAt: stamp
  };
  yr.catalog.push(cat);

  if (meta.hasGoal && d.goal) setGoal(cat.id, d.goal, y);

  // scope je jediné místo, kde se odpovídá na otázku "a co ostatní měsíce?"
  const base = Number.isInteger(d.month) ? clamp(d.month, 0, 11) : state.ui.month;
  const sc = (scope === 'this' || scope === 'rest' || scope === 'all') ? scope : 'all';
  const from = sc === 'all' ? 0 : base;
  const to = sc === 'this' ? base : 11;
  const plan = Number.isSafeInteger(d.plan) ? Math.abs(d.plan) : 0;
  for (let m = from; m <= to; m++) {
    const e = ensureEntry(m, cat.id, y);
    if (e && plan) { e.plan = plan; bump(e); }
  }
  bump(cat);
  undoPush('Přidání položky', function () { archiveCatalogItem(cat.id, y); });
  return cat;
}

function updateCatalogItem(catId, patch, y) {
  const cat = getCat(catId, y);
  if (!cat || !patch) return null;
  let changed = false;
  if (typeof patch.name === 'string' && patch.name.trim() !== cat.name) { cat.name = patch.name.trim(); changed = true; }
  if (typeof patch.icon === 'string' && patch.icon !== cat.icon) { cat.icon = patch.icon; changed = true; }
  if (patch.recurring !== undefined && (patch.recurring !== false) !== cat.recurring) {
    cat.recurring = patch.recurring !== false; changed = true;
  }
  if (patch.dueDay !== undefined) {
    const ok = SECTION_BY_KEY[cat.sec].hasDue;
    const v = (ok && Number.isInteger(patch.dueDay) && patch.dueDay >= 1 && patch.dueDay <= 31) ? patch.dueDay : null;
    if (v !== cat.dueDay) { cat.dueDay = v; changed = true; }
  }
  if (patch.archived !== undefined && (patch.archived === true) !== cat.archived) {
    cat.archived = patch.archived === true; changed = true;
  }
  if (patch.goal !== undefined) { setGoal(catId, patch.goal, y); }
  if (!changed) return cat;
  return bump(cat);
}

// Měkce. Transakce se NIKDY nemažou kaskádou — peníze zůstanou vidět
// v "nezařazených" (viz orphanTx), nezmizí.
function archiveCatalogItem(catId, y) {
  const cat = getCat(catId, y);
  if (!cat || cat.archived) return cat;
  cat.archived = true;
  bump(cat);
  undoPush('Smazání kategorie', function () {
    const c = getCat(catId, y);
    if (c) { c.archived = false; bump(c); }
  });
  return cat;
}

function reorderSection(sec, orderedIds, y) {
  const yr = getYear(y);
  const ids = Array.isArray(orderedIds) ? orderedIds : [];
  const inSec = yr.catalog.filter(function (c) { return c.sec === sec; });
  const seq = [];
  ids.forEach(function (id) {
    const c = inSec.find(function (x) { return x.id === id; });
    if (c && seq.indexOf(c) < 0) seq.push(c);
  });
  inSec.sort(function (a, b) { return (a.order | 0) - (b.order | 0); })
       .forEach(function (c) { if (seq.indexOf(c) < 0) seq.push(c); });
  let changed = 0;
  seq.forEach(function (c, i) {
    const o = (i + 1) * 10;
    if (c.order !== o) { c.order = o; bump(c); changed += 1; }
  });
  return changed;
}

function setGoal(catId, goal, y) {
  const cat = getCat(catId, y);
  if (!cat) return null;
  if (!SECTION_BY_KEY[cat.sec].hasGoal) return cat;
  if (goal === null || goal === undefined) {
    if (cat.goal === null) return cat;
    cat.goal = null;
    return bump(cat);
  }
  const target = Number.isSafeInteger(goal.target) ? Math.abs(goal.target) : 0;
  const startBalance = Number.isSafeInteger(goal.startBalance) ? Math.abs(goal.startBalance) : 0;
  const targetDate = (typeof goal.targetDate === 'string' && parseYmd(goal.targetDate)) ? goal.targetDate : null;
  const next = { target: target, startBalance: startBalance, targetDate: targetDate };
  if (cat.goal && deepEqual(cat.goal, next)) return cat;
  cat.goal = next;
  return bump(cat);
}

/* ---------- řádky měsíce ---------- */

function setPlanned(m, entryId, minor, y) {
  const e = getEntry(m, entryId, y);
  if (!e) return null;
  // Prázdné pole je "nezadáno", ne nula. Do součtů se stejně počítá jako
  // nula, ale na obrazovce je pomlčka místo sebevědomého 0 Kč.
  if (minor === null || minor === undefined) {
    if (e.plan === null) return e;
    e.plan = null;
    return bump(e);
  }
  const v = Number.isSafeInteger(minor) ? Math.abs(minor) : null;
  if (v === null) return null;               // NaN ani string se do dokumentu nedostane
  if (e.plan === v) return e;
  e.plan = v;
  return bump(e);
}

// null = "počítej z deníku". Číslo = ruční zápis, ten vyhrává.
// Sčítat se nesmí NIKDY: ruční 300 a deník 250 dá 250 nebo 300, ne 550.
function setActual(m, entryId, minor, y) {
  const e = getEntry(m, entryId, y);
  if (!e) return null;
  if (minor === null || minor === undefined) {
    if (e.act === null && e.autoFilled === false) return e;
    e.act = null; e.autoFilled = false;
    return bump(e);
  }
  if (!Number.isSafeInteger(minor)) return null;
  const v = Math.abs(minor);
  if (e.act === v && e.autoFilled === false) return e;
  e.act = v; e.autoFilled = false;
  return bump(e);
}

function clearActual(m, entryId, y) { return setActual(m, entryId, null, y); }

function togglePaid(m, entryId, want, y) {
  const e = getEntry(m, entryId, y);
  if (!e) return null;
  const to = (want === undefined || want === null) ? !e.paid : !!want;
  if (to === !!e.paid) return e;
  e.paid = to;
  if (to) {
    e.paidAt = todayISO();
    // Doplnit smí jen do prázdného pole a musí si to označit, jinak by po
    // odškrtnutí zůstalo strašidelné číslo, které nikdo nezadal.
    // A hlavně NESMÍ přepsat skutečnost dopočítanou z deníku: act === null
    // znamená "počítej z nákupů", takže když nějaké nákupy jsou, je to
    // reálná útrata a plán by ji přebil. Zaplaceno je stav platby, ne částka.
    let zDeniku = 0;
    try { zDeniku = (typeof txByCat === 'function') ? (txByCat(y || state.activeYear, m).get(e.cat) || 0) : 0; }
    catch (err) { zDeniku = 0; }
    if (state.settings.autofillOnPaid && e.act === null && zDeniku === 0
        && Number.isSafeInteger(e.plan) && e.plan > 0) {
      e.act = e.plan; e.autoFilled = true;
    }
  } else {
    e.paidAt = null;
    if (e.autoFilled) { e.act = null; e.autoFilled = false; }
  }
  return bump(e);
}

function setEntryDue(m, entryId, day, y) {
  const e = getEntry(m, entryId, y);
  if (!e) return null;
  const v = (day === null || day === undefined) ? null
          : (Number.isInteger(day) && day >= 1 && day <= 31 ? day : null);
  if (e.due === v) return e;
  e.due = v;
  return bump(e);
}

// Má ten řádek v daném měsíci co ztratit? Stejné pravidlo jako v
// 34-derived.js, jen bez závislosti na odvozené vrstvě.
function _mMaData(m, e, y) {
  if (Number.isSafeInteger(e.plan) && e.plan !== 0) return true;
  if (Number.isSafeInteger(e.act) && e.act !== 0) return true;
  if (e.paid) return true;
  const yr = getYear(y);
  for (let i = 0; i < yr.tx.length; i++) {
    const t = yr.tx[i];
    if (t && !t.del && t.m === m && t.cat === e.cat) return true;
  }
  return false;
}

// Měkce, nikdy splice. scope: 'this' | 'rest' | 'all'.
function removeEntry(m, entryId, scope, y) {
  const e0 = getEntry(m, entryId, y);
  if (!e0) return null;
  const catId = e0.cat;
  const cat = getCat(catId, y);
  const base = clamp(Number.isInteger(m) ? m : state.ui.month, 0, 11);
  const sc = (scope === 'rest' || scope === 'all') ? scope : 'this';
  const from = sc === 'all' ? 0 : base;
  const to = sc === 'this' ? base : 11;

  const hidden = [];      // existující řádky, které jen zmizely
  const created = [];     // náhrobky, aby ensureMonth() trvalku nevzkřísil
  for (let i = from; i <= to; i++) {
    const mo = getMonthObj(i, y);
    let e = null;
    for (let k = 0; k < mo.entries.length; k++) if (mo.entries[k].cat === catId) { e = mo.entries[k]; break; }
    if (!e) {
      if (i === base || !cat || cat.recurring === false) continue;
      e = ensureEntry(i, catId, y);
      if (!e) continue;
      created.push({ mo: mo, e: e });
    } else if (e.del) {
      continue;
    } else if (i !== base && _mMaData(i, e, y)) {
      // Měsíc, ve kterém už něco je, se NEPŘEPISUJE. „Smazat od teď dál"
      // nebo „v celém roce" znamená přestat to sledovat, ne přepsat leden,
      // který je hotová historie. Ten měsíc, který uživatelka smaže přímo,
      // se smaže vždycky — to je vědomé rozhodnutí a jde vzít zpět.
      continue;
    } else {
      hidden.push(e);
    }
    e.del = true;
    bump(e);
  }
  const archived = (sc === 'all' && cat && !cat.archived);
  if (archived) { cat.archived = true; bump(cat); }

  undoPush('Smazání položky', function () {
    hidden.forEach(function (e) { e.del = false; bump(e); });
    created.forEach(function (rec) {
      const i = rec.mo.entries.indexOf(rec.e);
      if (i >= 0) rec.mo.entries.splice(i, 1);   // ruší se jen to, co vzniklo teď
    });
    if (archived) { const c = getCat(catId, y); if (c) { c.archived = false; bump(c); } }
    bump(null);
  });
  return e0;
}

/* ---------- deník ----------
   addTx() do entry.act NIKDY nezapisuje. Řádek si skutečnost dopočítá sám
   přes effActual(), dokud má act === null. */

function addTx(def, y) {
  const d = def || {};
  const yr = getYear(y);
  const iso = (typeof d.d === 'string' && parseYmd(d.d)) ? d.d : todayISO();
  const p = parseYmd(iso);
  const m = Number.isInteger(d.m) ? clamp(d.m, 0, 11) : p.m;
  if (!Number.isSafeInteger(d.amt)) return null;
  const catId = (typeof d.cat === 'string' && d.cat) ? d.cat : null;
  const tx = {
    id: uid('t_'), d: iso, m: m, cat: catId,
    amt: Math.abs(d.amt),
    note: typeof d.note === 'string' ? d.note : '',
    del: false, updatedAt: storageStamp()
  };
  yr.tx.push(tx);
  // Aby peníze byly hned vidět i na měsíci, ne jen v deníku. Smazaný řádek
  // se ale nekřísí — uživatelka ho vyhodila schválně a peníze se ukážou
  // mezi nezařazenými.
  if (catId) {
    const cat = getCat(catId, y);
    if (cat && !cat.archived) ensureEntry(m, catId, y);
  }
  bump(tx);
  undoPush('Zápis do deníku', function () { removeTx(tx.id, y); });
  return tx;
}

function updateTx(txId, patch, y) {
  const yr = getYear(y);
  let tx = null;
  for (let i = 0; i < yr.tx.length; i++) if (yr.tx[i].id === txId) { tx = yr.tx[i]; break; }
  if (!tx || !patch) return null;
  let changed = false;

  if (typeof patch.d === 'string' && parseYmd(patch.d) && patch.d !== tx.d) {
    const old = parseYmd(tx.d);
    const followed = !!old && old.m === tx.m;   // měsíc dosud nebyl ručně přehozený
    tx.d = patch.d;
    if (patch.m === undefined && followed) tx.m = parseYmd(patch.d).m;
    changed = true;
  }
  if (Number.isInteger(patch.m)) {
    const v = clamp(patch.m, 0, 11);
    if (v !== tx.m) { tx.m = v; changed = true; }
  }
  if (patch.cat !== undefined) {
    const v = (typeof patch.cat === 'string' && patch.cat) ? patch.cat : null;
    if (v !== tx.cat) {
      tx.cat = v; changed = true;
      if (v) { const c = getCat(v, y); if (c && !c.archived) ensureEntry(tx.m, v, y); }
    }
  }
  if (patch.amt !== undefined) {
    if (!Number.isSafeInteger(patch.amt)) return null;
    const v = Math.abs(patch.amt);
    if (v !== tx.amt) { tx.amt = v; changed = true; }
  }
  if (typeof patch.note === 'string' && patch.note !== tx.note) { tx.note = patch.note; changed = true; }
  // Vrácení smazaného zápisu bez toho, aby se sahalo na zásobník undo.
  if (patch.del !== undefined && (patch.del === true) !== tx.del) {
    tx.del = patch.del === true;
    changed = true;
    if (!tx.del && tx.cat) {
      const c = getCat(tx.cat, y);
      if (c && !c.archived) ensureEntry(tx.m, tx.cat, y);
    }
  }
  if (!changed) return tx;
  return bump(tx);
}

function removeTx(txId, y) {
  const yr = getYear(y);
  let tx = null;
  for (let i = 0; i < yr.tx.length; i++) if (yr.tx[i].id === txId) { tx = yr.tx[i]; break; }
  if (!tx || tx.del) return tx;
  tx.del = true;                       // měkce, nikdy splice
  bump(tx);
  undoPush('Smazání zápisu', function () {
    const t = tx; if (t) { t.del = false; bump(t); }
  });
  return tx;
}

/* ---------- nastavení ---------- */

function setSetting(key, value) {
  const s = state.settings;
  if (!s || !Object.prototype.hasOwnProperty.call(s, key)) return null;
  let v = value;
  if (key === 'theme') { if (['auto', 'light', 'dark'].indexOf(v) < 0) return null; }
  else if (key === 'dueSoonDays') { if (!Number.isInteger(v)) return null; v = clamp(v, 0, 60); }
  else if (key === 'autofillOnPaid' || key === 'welcomeDone') { v = v === true; }
  else if (key === 'syncUrl' || key === 'syncSecret') { v = String(v === undefined || v === null ? '' : v); }
  else { if (v !== null && typeof v !== 'string') return null; }
  if (s[key] === v) return s;
  s[key] = v;
  bump(null);
  return s;
}

/* ======================= 34-derived.js ======================= */
// 34-derived.js — čistý výpočet, memoizace na state.rev — vlastní: L2
// Nic se tu nemění a nic se neukládá. Rok je vždycky součet měsíců.
// Memo tabulky visí na samotných funkcích, aby nepřibylo top-level jméno.

txByCat.memo = new Map();
computeMonth.memo = new Map();
computeYear.memo = new Map();
computeGoals.memo = new Map();
computeDue.memo = new Map();
orphanTx.memo = new Map();
dailySlices.memo = new Map();
savingsSlices.memo = new Map();

invalidateAll.all = [txByCat, computeMonth, computeYear, computeGoals,
                     computeDue, orphanTx, dailySlices, savingsSlices];

function invalidate(y, m) {
  if (y === undefined) return invalidateAll();
  // Klíč měsíčních memo je "rok:měsíc" BEZ koncové dvojtečky. S ní se
  // neshodovalo nic a funkce tiše nemazala vůbec nic.
  const needle = (m === undefined) ? String(y) + ':' : String(y) + ':' + String(m);
  const exact = String(y);           // computeYear a savingsSlices klíčují jen rokem
  invalidateAll.all.forEach(function (fn) {
    Array.from(fn.memo.keys()).forEach(function (k) {
      // U konkrétního měsíce se porovnává celý klíč, aby "2026:1"
      // neshodilo taky "2026:10", "2026:11" a "2026:12".
      const sedi = (m === undefined) ? (k.indexOf(needle) === 0) : (k === needle);
      if (sedi || k === exact) fn.memo.delete(k);
    });
  });
}

function invalidateAll() {
  invalidateAll.all.forEach(function (fn) { fn.memo.clear(); });
}

/* Memo drží { rev, val } pod klíčem bez rev, takže se sama přepisuje
   a neroste do nekonečna. */
function _dMemo(fn, key, make) {
  const hit = fn.memo.get(key);
  if (hit && hit.rev === state.rev) return hit.val;
  const val = make();
  fn.memo.set(key, { rev: state.rev, val: val });
  return val;
}

// Čtení bez zakládání — odvozený kód do state nesahá.
function _dYear(y) {
  const yr = state.years[String(Number.isInteger(y) ? y : state.activeYear)];
  return (yr && typeof yr === 'object') ? yr : null;
}
function _dCats(yr) {
  const map = new Map();
  if (yr) for (let i = 0; i < yr.catalog.length; i++) map.set(yr.catalog[i].id, yr.catalog[i]);
  return map;
}
function _dEntries(yr, m) {
  if (!yr) return [];
  const mo = yr.months[m];
  return (mo && Array.isArray(mo.entries)) ? mo.entries : [];
}

/* ---------- deník po kategoriích ---------- */

// Živý řádek = nesmazaný záznam, jehož kategorie existuje a není archivovaná.
// Má archivovaná kategorie v tomhle měsíci co ukazovat? Pokud ano, řádek
// zůstává — jinak by smazání kategorie dnes přepsalo i leden, který je
// hotová historie, a tištěný přehled by se rozešel se skutečností.
function _dHasData(yr, m, e) {
  if (Number.isSafeInteger(e.plan) && e.plan !== 0) return true;
  if (Number.isSafeInteger(e.act) && e.act !== 0) return true;
  if (e.paid) return true;
  for (let i = 0; i < yr.tx.length; i++) {
    const t = yr.tx[i];
    if (t && !t.del && t.m === m && t.cat === e.cat) return true;
  }
  return false;
}

function _dLive(yr, m) {
  const live = new Set();
  if (!yr) return live;
  const cats = _dCats(yr);
  _dEntries(yr, m).forEach(function (e) {
    if (!e || e.del) return;
    const c = cats.get(e.cat);
    if (!c) return;
    if (!c.archived || _dHasData(yr, m, e)) live.add(e.cat);
  });
  return live;
}

// Map<catId, součet haléřů> pro kategorie, které v tom měsíci mají živý řádek.
// Zbytek (smazaná kategorie, vyhozený řádek, zápis bez kategorie) patří do
// orphanTx — tyhle dvě množiny se nepřekrývají a dohromady dají všechno,
// takže "koše + osiřelé === všechny zápisy" platí i po sečtení celé mapy.
function txByCat(y, m) {
  return _dMemo(txByCat, y + ':' + m, function () {
    const map = new Map();
    const yr = _dYear(y);
    if (!yr) return map;
    const live = _dLive(yr, m);
    for (let i = 0; i < yr.tx.length; i++) {
      const t = yr.tx[i];
      if (!t || t.del || t.m !== m) continue;
      if (!Number.isSafeInteger(t.amt)) continue;
      if (!t.cat || !live.has(t.cat)) continue;
      map.set(t.cat, (map.get(t.cat) || 0) + t.amt);
    }
    return map;
  });
}

/* ---------- pravidlo přednosti ----------
   act === null  -> součet z deníku (chybí-li, nula)
   act === číslo -> ruční hodnota
   NIKDY se nesčítají. 300 ručně a 250 v deníku dá 250, nebo 300. Ne 550. */
function effActual(entry, txMap) {
  if (!entry) return 0;
  if (entry.act !== null && entry.act !== undefined) {
    return Number.isSafeInteger(entry.act) ? entry.act : 0;
  }
  if (!txMap) return 0;
  const v = txMap.get(entry.cat);
  return Number.isSafeInteger(v) ? v : 0;
}

/* ---------- nezařazené peníze ----------
   Zápisy, na které se v tom měsíci nedá napojit žádný živý řádek: kategorie
   byla smazaná, archivovaná, řádek vyhozený, nebo tam kategorie vůbec není.
   Bez tohohle kbelíku by peníze po smazání kategorie tiše zmizely. */
function orphanTx(y, m) {
  return _dMemo(orphanTx, y + ':' + m, function () {
    const yr = _dYear(y);
    if (!yr) return [];
    const live = _dLive(yr, m);
    const cats = _dCats(yr);
    const out = [];
    for (let i = 0; i < yr.tx.length; i++) {
      const t = yr.tx[i];
      if (!t || t.del || t.m !== m) continue;
      if (t.cat && live.has(t.cat)) continue;
      // Nezařazené se sčítají do VÝDAJŮ. Zápis u příjmové kategorie by se
      // tam dostal s obráceným znaménkem — 5 000 přijatých by ubralo 5 000.
      const c = t.cat ? cats.get(t.cat) : null;
      if (c && c.sec === 'income') continue;
      out.push(t);
    }
    return out;
  });
}

/* ---------- měsíc ---------- */

function computeMonth(y, m) {
  return _dMemo(computeMonth, y + ':' + m, function () {
    const yr = _dYear(y);
    const cats = _dCats(yr);
    const txMap = txByCat(y, m);

    const sections = {};
    for (let i = 0; i < SECTIONS.length; i++) {
      const s = SECTIONS[i];
      sections[s.key] = { key: s.key, dir: s.dir, plan: 0, act: 0, diff: 0,
                          count: 0, paidCount: 0, dueCount: 0, rows: [] };
    }

    _dEntries(yr, m).forEach(function (e) {
      if (!e || e.del) return;
      const cat = cats.get(e.cat);
      if (!cat) return;
      // Archivovaná kategorie zmizí jen z měsíců, kde po ní nic nezbylo.
      const archivovanaBezDat = cat.archived && !_dHasData(yr, m, e);
      if (archivovanaBezDat) return;
      const sec = sections[cat.sec];
      if (!sec) return;
      const plan = Number.isSafeInteger(e.plan) ? e.plan : 0;
      const act = effActual(e, txMap);
      const txSum = txMap.get(e.cat) || 0;
      const dueDay = (e.due !== null && e.due !== undefined) ? e.due : cat.dueDay;
      const due = (SECTION_BY_KEY[cat.sec].hasDue && Number.isInteger(dueDay))
        ? dueDateFor(y, m, dueDay) : null;
      sec.plan += plan;
      sec.act += act;
      sec.count += 1;
      if (e.paid) sec.paidCount += 1;
      if (due) sec.dueCount += 1;
      sec.rows.push({
        id: e.id, entry: e, cat: cat, order: cat.order | 0,
        plan: plan, act: act, txSum: txSum,
        diff: act - plan,
        archived: !!cat.archived,
        manual: e.act !== null && e.act !== undefined,
        autoFilled: e.autoFilled === true,
        paid: e.paid === true, paidAt: e.paidAt || null,
        dueDay: Number.isInteger(dueDay) ? dueDay : null, due: due
      });
    });

    SECTIONS.forEach(function (s) {
      const sec = sections[s.key];
      sec.diff = sec.act - sec.plan;
      sec.rows.sort(function (a, b) { return a.order - b.order || cmpCs(a.cat.name, b.cat.name); });
    });

    const income = sections.income.act;
    const plannedIncome = sections.income.plan;
    let outflow = 0, plannedOutflow = 0;
    SECTIONS.forEach(function (s) {
      if (s.key === 'income') return;
      outflow += sections[s.key].act;              // úspory se počítají jako odliv
      plannedOutflow += sections[s.key].plan;
    });

    const orph = orphanTx(y, m);
    let orphanTotal = 0;
    for (let i = 0; i < orph.length; i++) {
      // Stejná pojistka jako v txByCat: poškozená částka nesmí otrávit součet.
      if (Number.isSafeInteger(orph[i].amt)) orphanTotal += orph[i].amt;
    }

    // Nezařazené nákupy PATŘÍ do výdajů. Bez toho tři čísla na hlavní
    // obrazovce nesedí (příjmy − výdaje ≠ zůstatek) a po smazání kategorie
    // by zůstatek vyskočil nahoru o částku, kterou reálně utratila.
    // Přísná rovnost přes sekce zůstává dostupná jako outflowSections
    // a balanceSections.
    const outflowSections = outflow;
    const nezarazeno = orphanTotal;
    outflow += nezarazeno;

    // Nezařazené nákupy do zůstatku NEPATŘÍ: závazná rovnost zní
    //   příjmy − (fixed + daily + savings + debt + subs) === zůstatek
    // a ta musí sedět na haléř. Peníze se ale nesmí ztratit z očí, proto se
    // vydávají zvlášť v `orphans` (a v pesimistické variantě níž), aby je
    // obrazovka mohla nabídnout k zařazení.
    // Kolik dní ještě zbývá utrácet. Minulý měsíc nemá kolik, tam je to null.
    const t = parseYmd(todayISO());
    const cur = t ? t.y * 12 + t.m : y * 12 + m;
    const here = y * 12 + m;
    let daysLeft;
    if (here > cur) daysLeft = daysInMonth(y, m);
    else if (here < cur) daysLeft = 0;
    else daysLeft = daysInMonth(y, m) - t.day + 1;

    const balance = income - outflow;                 // to, co vidí uživatelka
    const balanceSections = income - outflowSections; // přísná rovnost přes sekce
    // Sekce visí i přímo na výsledku (md.fixed.act), vedle mapy md.sections.
    // Skalární součet příjmů je incomeTotal, protože md.income je sekce.
    const res = {
      y: y, m: m, rev: state.rev,
      sections: sections,
      incomeTotal: income,
      outflow: outflow,
      outflowSections: outflowSections,
      balance: balance,
      balanceSections: balanceSections,
      plannedIncome: plannedIncome,
      plannedOutflow: plannedOutflow,
      plannedBalance: plannedIncome - plannedOutflow,
      daysLeft: daysLeft,
      leftPerDay: daysLeft > 0 ? Math.trunc(balance / daysLeft) : null,
      orphans: { count: orph.length, total: nezarazeno, txTotal: orphanTotal, manualTotal: 0 },
      balanceWithOrphans: balance,
      note: (yr && yr.months[m] && typeof yr.months[m].note === 'string') ? yr.months[m].note : ''
    };
    SECTIONS.forEach(function (s) { res[s.key] = sections[s.key]; });
    return res;
  });
}

/* ---------- rok ----------
   Součet dvanácti měsíců, nikdy uložené číslo. */
function computeYear(y) {
  return _dMemo(computeYear, String(y), function () {
    const months = [];
    const totals = {
      sections: {}, income: 0, outflow: 0, balance: 0,
      plannedIncome: 0, plannedOutflow: 0, plannedBalance: 0,
      orphans: { count: 0, total: 0 }
    };
    SECTIONS.forEach(function (s) { totals.sections[s.key] = { key: s.key, plan: 0, act: 0, diff: 0 }; });

    for (let m = 0; m < 12; m++) {
      const mm = computeMonth(y, m);
      months.push(mm);
      SECTIONS.forEach(function (s) {
        totals.sections[s.key].plan += mm.sections[s.key].plan;
        totals.sections[s.key].act += mm.sections[s.key].act;
      });
      totals.income += mm.incomeTotal;
      totals.outflow += mm.outflow;
      totals.plannedIncome += mm.plannedIncome;
      totals.plannedOutflow += mm.plannedOutflow;
      totals.orphans.count += mm.orphans.count;
      totals.orphans.total += mm.orphans.total;
    }
    SECTIONS.forEach(function (s) {
      const t = totals.sections[s.key];
      t.diff = t.act - t.plan;
    });
    totals.balance = totals.income - totals.outflow;
    totals.balanceSections = totals.balance + totals.orphans.total;
    totals.plannedBalance = totals.plannedIncome - totals.plannedOutflow;
    const res = {
      year: y, months: months, totals: totals, sections: totals.sections,
      incomeTotal: totals.income, outflow: totals.outflow, balance: totals.balance,
      plannedIncome: totals.plannedIncome, plannedOutflow: totals.plannedOutflow,
      plannedBalance: totals.plannedBalance, orphans: totals.orphans
    };
    SECTIONS.forEach(function (s) { res[s.key] = totals.sections[s.key]; });
    return res;
  });
}

/* ---------- spořicí cíle ----------
   Naspořeno = startBalance + součet skutečností té kategorie za celý rok.
   0/0 je NaN a 500/0 je Infinity — obojí se musí vrátit jako null, aby to
   šlo vykreslit pomlčkou a ne jako číslo. */
function computeGoals(y) {
  return _dMemo(computeGoals, String(y), function () {
    const yr = _dYear(y);
    if (!yr) return [];
    const maps = [];
    for (let m = 0; m < 12; m++) maps.push(txByCat(y, m));

    const t = parseYmd(todayISO());
    const nowIdx = t ? t.y * 12 + t.m : y * 12;
    const elapsed = clamp((nowIdx - (y * 12)) + 1, 0, 12);   // kolik měsíců roku už proběhlo

    const out = [];
    yr.catalog.forEach(function (cat) {
      if (cat.sec !== 'savings' || cat.archived) return;
      let contributed = 0;
      for (let m = 0; m < 12; m++) {
        const mo = yr.months[m];
        if (!mo) continue;
        for (let i = 0; i < mo.entries.length; i++) {
          const e = mo.entries[i];
          if (!e || e.del || e.cat !== cat.id) continue;
          contributed += effActual(e, maps[m]);
        }
      }
      const goal = cat.goal || null;
      const target = goal && Number.isSafeInteger(goal.target) ? goal.target : 0;
      const startBalance = goal && Number.isSafeInteger(goal.startBalance) ? goal.startBalance : 0;
      const targetDate = goal ? (goal.targetDate || null) : null;
      const saved = startBalance + contributed;
      const ratio = target > 0 ? saved / target : null;      // ne NaN, ne Infinity
      const left = target > 0 ? Math.max(0, target - saved) : null;

      const perMonth = elapsed > 0 ? Math.trunc(contributed / elapsed) : null;
      let monthsToTarget = null, needPerMonth = null, late = false;
      if (targetDate) {
        const td = parseYmd(targetDate);
        if (td) {
          monthsToTarget = (td.y * 12 + td.m) - nowIdx;
          if (monthsToTarget <= 0) { late = left !== null && left > 0; monthsToTarget = 0; needPerMonth = null; }
          else needPerMonth = left === null ? null : Math.ceil(left / monthsToTarget);
        }
      }
      let etaMonths = null;
      if (left !== null && left > 0 && perMonth !== null && perMonth > 0) etaMonths = Math.ceil(left / perMonth);
      else if (left === 0) etaMonths = 0;
      let etaISO = null;
      if (etaMonths !== null && t) {
        const p = addMonths(t.y, t.m, etaMonths);
        etaISO = dueDateFor(p.y, p.m, daysInMonth(p.y, p.m));
      }

      out.push({
        id: cat.id, cat: cat, name: cat.name, icon: cat.icon,
        target: target, startBalance: startBalance, targetDate: targetDate,
        contributed: contributed, saved: saved,
        ratio: ratio, left: left, done: target > 0 && saved >= target,
        perMonth: perMonth, monthsToTarget: monthsToTarget,
        needPerMonth: needPerMonth, late: late,
        etaMonths: etaMonths, etaISO: etaISO
      });
    });
    out.sort(function (a, b) { return (a.cat.order | 0) - (b.cat.order | 0) || cmpCs(a.name, b.name); });
    return out;
  });
}

/* ---------- splatnosti ----------
   Splatnost 31. v únoru je 28. (nebo 29.), nikdy 3. března — to řeší
   dueDateFor(). Rozdíl dnů přes daysBetween(), kvůli letnímu času. */
function computeDue(y, m, daysAhead) {
  const ahead = Number.isInteger(daysAhead) ? daysAhead
    : (Number.isInteger(state.settings.dueSoonDays) ? state.settings.dueSoonDays : 7);
  return _dMemo(computeDue, y + ':' + m + ':' + ahead, function () {
    const res = { overdue: [], soon: [], later: [], paid: [], count: 0, total: 0, daysAhead: ahead };
    const mm = computeMonth(y, m);
    const today = todayISO();
    SECTIONS.forEach(function (s) {
      if (!s.hasDue) return;
      mm.sections[s.key].rows.forEach(function (r) {
        if (!r.due) return;
        const days = daysBetween(today, r.due);
        const item = {
          id: r.id, entry: r.entry, cat: r.cat, sec: s.key,
          due: r.due, dueDay: r.dueDay, days: days,
          plan: r.plan, act: r.act, paid: r.paid, m: m
        };
        if (r.paid) { res.paid.push(item); return; }
        if (days !== null && days < 0) res.overdue.push(item);
        else if (days !== null && days <= ahead) res.soon.push(item);
        else res.later.push(item);
      });
    });
    const bySoonest = function (a, b) { return a.due < b.due ? -1 : (a.due > b.due ? 1 : 0); };
    res.overdue.sort(bySoonest); res.soon.sort(bySoonest);
    res.later.sort(bySoonest); res.paid.sort(bySoonest);
    res.count = res.overdue.length + res.soon.length;
    res.total = sumMinor(res.overdue.map(function (i) { return i.plan; })
      .concat(res.soon.map(function (i) { return i.plan; })));
    return res;
  });
}

/* ---------- výseče ----------
   Nejvýš 11 dílků a zbytek do "Ostatní", nulové pryč. */
function _dSlices(items) {
  const list = items.filter(function (s) { return s.value > 0; })
                    .sort(function (a, b) { return b.value - a.value; });
  let out = list;
  if (list.length > 12) {
    const head = list.slice(0, 11);
    let rest = 0;
    for (let i = 11; i < list.length; i++) rest += list[i].value;
    head.push({ id: '_rest', label: 'Ostatní', icon: '', value: rest, ratio: 0 });
    out = head;
  }
  const total = sumMinor(out.map(function (s) { return s.value; }));
  out.forEach(function (s) { s.ratio = total > 0 ? s.value / total : 0; });
  return out;
}

function dailySlices(y, m) {
  return _dMemo(dailySlices, y + ':' + m, function () {
    const mm = computeMonth(y, m);
    return _dSlices(mm.sections.daily.rows.map(function (r) {
      return { id: r.cat.id, label: r.cat.name, icon: r.cat.icon, value: r.act, ratio: 0 };
    }));
  });
}

function savingsSlices(y) {
  return _dMemo(savingsSlices, String(y), function () {
    return _dSlices(computeGoals(y).map(function (g) {
      return { id: g.id, label: g.name, icon: g.icon, value: g.contributed, ratio: 0 };
    }));
  });
}

/* ======================= 40-charts.js ======================= */
// 40-charts.js — ruční inline SVG grafy, bez jakékoliv knihovny — vlastní: L3
// Pravidla: žádná barva natvrdo (jen var(--…) nebo currentColor), žádné innerHTML,
// každý text přes textContent, každý graf se dá volat opakovaně.

/* ==================== matematika ==================== */
// Zaokrouhlení na 1e-6. Bez něj z cos(-π/2) vyleze 6.1e-17 a v atributu
// pak straší "50.000000000000004". Zároveň nikdy nevrací -0.
function chartNum(v) {
  if (!Number.isFinite(v)) return 0;
  const r = Math.round(v * 1e6) / 1e6;
  return r === 0 ? 0 : r;
}

// Text z uživatelských dat: nikdy undefined/null v popisku.
function chartText(v) { return v === null || v === undefined ? '' : String(v); }

// Nula stupňů je na dvanáctce, roste po směru hodinových ručiček.
function polar(cx, cy, r, deg) {
  const a = (deg - 90) * Math.PI / 180;
  return { x: chartNum(cx + r * Math.cos(a)), y: chartNum(cy + r * Math.sin(a)) };
}

// Samotný oblouk (bez středu). Výseč = arcPath(...) + " L cx cy Z".
function arcPath(cx, cy, r, a0, a1) {
  const p0 = polar(cx, cy, r, a0), p1 = polar(cx, cy, r, a1);
  const sweep = a1 - a0;
  const large = Math.abs(sweep) > 180 ? 1 : 0;   // delší půlka kruhu
  const dir = sweep < 0 ? 0 : 1;                 // 1 = po směru ručiček
  return 'M' + p0.x + ' ' + p0.y + ' A' + chartNum(r) + ' ' + chartNum(r) +
         ' 0 ' + large + ' ' + dir + ' ' + p1.x + ' ' + p1.y;
}

// stroke-dasharray pro prstenec, když prohlížeč neumí pathLength.
// donutDash(0, r) musí vrátit "0 obvod", nikdy NaN.
function donutDash(ratio, r) {
  const rad = Number.isFinite(r) && r > 0 ? r : 0;
  const c = 2 * Math.PI * rad;
  const rr = Number.isFinite(ratio) ? clamp(ratio, 0, 1) : 0;
  const f = function (v) { return v.toFixed(4).replace(/\.?0+$/, ''); };  // "0.0000" -> "0"
  return f(rr * c) + ' ' + f(c);
}

// Horní hranice osy. Nikdy nevrací 0 — nulová osa by dál dělila nulou.
function niceScale(max) {
  if (!Number.isFinite(max) || max <= 0) return [0, 100];
  let pow = Math.pow(10, Math.floor(Math.log10(max)));
  let f = max / pow;
  if (f >= 10) { f /= 10; pow *= 10; }   // pojistka proti driftu log10
  if (f < 1) { f *= 10; pow /= 10; }
  const LADDER = [1, 1.2, 1.4, 1.6, 1.8, 2, 2.5, 3, 4, 5, 6, 8, 10];
  let nice = 10;
  for (let i = 0; i < LADDER.length; i++) {
    if (f <= LADDER[i] + 1e-9) { nice = LADDER[i]; break; }
  }
  const t = nice * pow;
  return [0, t >= 1e6 ? Math.round(t) : Math.round(t * 1e6) / 1e6];
}

// 0/0 je NaN, x/0 je Infinity — obojí by prosáklo až do šířky pruhu.
function progressPct(saved, target) {
  const t = Number.isFinite(target) ? target : 0;
  const s = Number.isFinite(saved) ? saved : 0;
  if (!(t > 0)) return { ratio: 0, label: '—' };
  const raw = s / t;
  if (!Number.isFinite(raw)) return { ratio: 0, label: '—' };
  // Popisek smí přelézt 100 % (750 z 500 = "150 %"), poměr pruhu ne.
  return { ratio: clamp(raw, 0, 1), label: Math.round(Math.max(raw, 0) * 100) + NBSP + '%' };
}

// Barva kategorie podle pořadí. Vrací odkaz na token, ne hodnotu.
function hueFor(i) {
  const n = Number.isFinite(i) ? Math.floor(i) : 0;
  return 'var(--cat-' + ((((n % 12) + 12) % 12) + 1) + ')';
}

/* ==================== společná kostra ==================== */
let chartSeq = 0;
function chartUid(p) { chartSeq += 1; return 'ch-' + p + '-' + chartSeq; }

const chartHasPathLength = (typeof SVGGeometryElement !== 'undefined' &&
  'pathLength' in SVGGeometryElement.prototype);

function chartReduced() {
  return typeof matchMedia === 'function' && !!matchMedia('(prefers-reduced-motion: reduce)').matches;
}

// role="img" + <title> (musí být první dítě) a <desc>, obojí v aria-labelledby.
function chartSvgRoot(w, h, title, desc, cls) {
  const tid = chartUid('t'), did = chartUid('d');
  const svg = svgEl('svg', {
    viewBox: '0 0 ' + chartNum(w) + ' ' + chartNum(h), role: 'img',
    preserveAspectRatio: 'xMidYMid meet',   // nikdy "none" — deformoval by text i kruhy
    'aria-labelledby': tid + ' ' + did, class: 'chart-svg' + (cls ? ' ' + cls : ''),
    style: 'width:100%;height:auto;display:block;font-variant-numeric:tabular-nums'
  });
  svg.appendChild(svgEl('title', { id: tid }, title || ''));
  svg.appendChild(svgEl('desc', { id: did }, desc || ''));
  return svg;
}

// Skrytá tabulka se stejnými čísly — odečítátko dostane data, ne obrázek.
function chartTable(caption, cols, rows) {
  // Tabulka se BALÍ do skrytého bloku. Samotná <table> se totiž chová jako
  // tabulka i se width:1px — roste podle obsahu a stránka pak přetéká do
  // stran. Blok kolem ní je oříznutelný, tabulka uvnitř zůstane tabulkou.
  const wrap = el('div', { class: 'sr-only chart-data-wrap' });
  const t = el('table', { class: 'chart-data' }), thead = el('thead'), head = el('tr');
  t.appendChild(el('caption', null, caption));
  cols.forEach(function (c) { head.appendChild(el('th', { scope: 'col' }, c)); });
  thead.appendChild(head); t.appendChild(thead);
  const tb = el('tbody');
  rows.forEach(function (r) {
    const tr = el('tr');
    r.forEach(function (cell, i) { tr.appendChild(i === 0 ? el('th', { scope: 'row' }, cell) : el('td', null, cell)); });
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  wrap.appendChild(t);
  return wrap;
}

// viewBox se přepočítává ze skutečné šířky hostitele — jinak by se s obrázkem
// škáloval i text a na iPadu by byl dvakrát větší než ve zbytku appky.
function chartMount(host, build) {
  const st = host.__chart || (host.__chart = {});
  st.build = build;
  st.w = -1;   // vynutí překreslení i při stejné šířce
  st.run = function () {
    const w = Math.round(host.clientWidth || 0) || 320;
    if (w === st.w) return;
    st.w = w;
    host.replaceChildren.apply(host, st.build(w) || []);
  };
  if (!st.bound) {
    st.bound = true;
    const tick = function () { if (host.__chart && host.__chart.run) host.__chart.run(); };
    // Překreslení se odloží o jeden snímek. Kdyby běželo přímo v callbacku,
    // prohlížeč hlásí "ResizeObserver loop completed with undelivered
    // notifications" — pozorovatel by měnil rozvržení, které právě měří.
    let roPending = 0;
    const tickDeferred = function () {
      if (roPending) return;
      roPending = (typeof requestAnimationFrame === 'function')
        ? requestAnimationFrame(function () { roPending = 0; tick(); })
        : setTimeout(function () { roPending = 0; tick(); }, 0);
    };
    if (typeof ResizeObserver === 'function') { st.ro = new ResizeObserver(tickDeferred); st.ro.observe(host); }
    else if (typeof addEventListener === 'function') { addEventListener('resize', tick, { passive: true }); }
  }
  st.run();
}

// Popisek hodnoty: dovnitř pruhu, když je dost široký, jinak vedle něj.
// Obrácený inkoust jen na plném pruhu. Světlý plánový pruh je jen odstín
// podkladu — bílý text by na něm byl nečitelný ve světlém i tmavém režimu.
function chartValueLabel(barW, yTop, barH, txt, fs, solid) {
  const inside = barW > 64;
  return svgEl('text', {
    x: chartNum(inside ? barW - 6 : barW + 6),
    y: chartNum(yTop + barH / 2 + fs * 0.35),   // ruční baseline: iOS Safari
    'text-anchor': inside ? 'end' : 'start',    // si s dominant-baseline nerozumí
    'font-size': fs,
    fill: (inside && solid) ? 'var(--chart-ink-inv, currentColor)' : 'var(--chart-ink, currentColor)',
    'fill-opacity': inside ? 1 : 0.7
  }, txt);
}

/* ==================== vodorovné pruhy ==================== */
// Vodorovně schválně: české názvy kategorií jsou dlouhé a otočené popisky
// vypadají amatérsky. Název stojí nad dvojicí pruhů, takže má celou šířku.
function chartBars(host, items, opts) {
  if (!host) return;
  const o = opts || {};
  const data = (Array.isArray(items) ? items : []).map(function (it) {
    return { name: chartText(it && it.name), plan: num(it && it.plan), act: num(it && it.act) };
  });
  chartMount(host, function (W) {
    if (!data.length) return [];
    const padR = 8, padB = 18, nameH = 17, barH = 11, gapIn = 3, gapBand = 13;
    const bandH = nameH + barH + gapIn + barH + gapBand;
    const plotW = Math.max(48, W - padR);
    const H = data.length * bandH + padB, baseY = H - padB;
    let peak = 0;
    data.forEach(function (d) { peak = Math.max(peak, d.plan, d.act); });
    const top = niceScale(peak)[1];
    const svg = chartSvgRoot(W, H, o.title || 'Plán a skutečnost',
      o.desc || 'Vodorovné pruhy: u každé položky světlý plán a plný sloupec skutečnosti.');
    const grid = svgEl('g', { 'aria-hidden': 'true' });
    for (let i = 0; i <= 4; i++) {
      const x = chartNum(plotW * i / 4);
      grid.appendChild(svgEl('line', { x1: x, y1: 0, x2: x, y2: baseY, stroke: 'var(--grid, currentColor)',
        'stroke-opacity': i === 0 ? 1 : 0.35, 'stroke-width': 1,
        'shape-rendering': 'crispEdges', 'vector-effect': 'non-scaling-stroke' }));
      if (i % 2 === 0) grid.appendChild(svgEl('text', { x: x, y: H - 5, 'font-size': 10,
        fill: 'var(--chart-ink, currentColor)', 'fill-opacity': 0.6,
        'text-anchor': i === 0 ? 'start' : (i === 4 ? 'end' : 'middle') }, formatCzk(top * i / 4)));
    }
    svg.appendChild(grid);
    const plot = svgEl('g', { 'aria-hidden': 'true' });
    data.forEach(function (d, i) {
      const y0 = i * bandH;
      plot.appendChild(svgEl('text', { x: 0, y: y0 + 12, 'font-size': 12, fill: 'var(--chart-ink, currentColor)' }, d.name));
      const wPlan = chartNum(clamp(d.plan / top, 0, 1) * plotW);
      const wAct = chartNum(clamp(d.act / top, 0, 1) * plotW);
      const yPlan = y0 + nameH, yAct = yPlan + barH + gapIn;
      plot.appendChild(svgEl('rect', { x: 0, y: yPlan, width: wPlan, height: barH, rx: 3,
        fill: 'var(--bar-plan, currentColor)' }));
      plot.appendChild(svgEl('rect', { x: 0, y: yAct, width: wAct, height: barH, rx: 3,
        fill: d.act > d.plan ? 'var(--bar-over, currentColor)' : 'var(--bar-act, currentColor)' }));
      plot.appendChild(chartValueLabel(wPlan, yPlan, barH, formatCzk(d.plan), 10, false));
      plot.appendChild(chartValueLabel(wAct, yAct, barH, formatCzk(d.act), 10, true));
    });
    svg.appendChild(plot);

    return [svg, chartTable(o.title || 'Plán a skutečnost',
      ['Položka', TXT.colPlan, TXT.colActual, TXT.diff],
      data.map(function (d) {
        return [d.name, formatCzk(d.plan), formatCzk(d.act), formatSigned(d.act - d.plan)];
      }))];
  });
}

/* ==================== koláč ==================== */

// Úhly výsečí. Nulové a záporné díly se přeskakují (ne kreslí prázdné),
// poslední díl se dorovná přesně na 360°, ať součet nedrhne na zaokrouhlení.
function chartPieAngles(slices) {
  const src = (Array.isArray(slices) ? slices : []).map(function (s, i) {
    return { i: i, name: chartText(s && s.name), value: num(s && s.value), color: (s && s.color) || hueFor(i) };
  }).filter(function (s) { return s.value > 0; });
  let total = 0;
  src.forEach(function (s) { total += s.value; });
  let a = 0;
  return src.map(function (s, k) {
    const ratio = pct(s.value, total) || 0;
    const a0 = a;
    const a1 = (k === src.length - 1) ? 360 : chartNum(a0 + ratio * 360);
    a = a1;
    return { i: s.i, name: s.name, value: s.value, color: s.color, ratio: ratio, a0: a0, a1: a1 };
  });
}

function chartPie(host, slices, opts) {
  if (!host) return;
  const o = opts || {};
  const arcs = chartPieAngles(slices);
  chartMount(host, function (W) {
    if (!arcs.length) return [];
    const size = Math.min(W, num(o.size) || 220) || 220;
    const cx = W / 2, cy = size / 2, r = size / 2 - 4;
    const svg = chartSvgRoot(W, size, o.title || 'Rozdělení výdajů',
      o.desc || 'Koláčový graf; přesná čísla jsou v legendě a v tabulce pod grafem.');
    const g = svgEl('g', { 'aria-hidden': 'true' });
    arcs.forEach(function (s) {
      // Jediný stoprocentní díl má stejný začátek i konec oblouku a path by
      // nenakreslil vůbec nic — proto v tom případě obyčejná kružnice.
      g.appendChild(s.ratio >= 0.9999
        ? svgEl('circle', { cx: chartNum(cx), cy: chartNum(cy), r: chartNum(r), fill: s.color })
        : svgEl('path', { d: arcPath(cx, cy, r, s.a0, s.a1) + ' L' + chartNum(cx) + ' ' + chartNum(cy) + ' Z',
            fill: s.color }));
    });
    // Uvnitř popisujeme jen díly od zhruba 8 % výš, jinak se text nevejde.
    arcs.forEach(function (s) {
      if (s.ratio < 0.08) return;
      const p = polar(cx, cy, r * 0.62, (s.a0 + s.a1) / 2);
      g.appendChild(svgEl('text', { x: p.x, y: chartNum(p.y + 4), 'text-anchor': 'middle',
        'font-size': 11, fill: 'var(--chart-ink-inv, currentColor)' }, Math.round(s.ratio * 100) + NBSP + '%'));
    });
    svg.appendChild(g);
    if (o.legend) renderLegend(o.legend, slices);
    return [svg, chartTable(o.title || 'Rozdělení výdajů', ['Kategorie', 'Částka', 'Podíl'],
      arcs.map(function (s) { return [s.name, formatCzk(s.value), Math.round(s.ratio * 100) + NBSP + '%']; }))];
  });
}

// Legenda ve dvou sloupcích: barevný čtvereček + název + částka.
function renderLegend(host, slices) {
  if (!host) return;
  const list = el('ul', { class: 'chart-legend-list' });
  (Array.isArray(slices) ? slices : []).forEach(function (s, i) {
    const v = num(s && s.value);
    if (!(v > 0)) return;
    const li = el('li', { class: 'chart-legend-item' });
    const sw = el('span', { class: 'chart-swatch', 'aria-hidden': 'true' });
    sw.style.background = (s && s.color) || hueFor(i);
    li.appendChild(sw);
    li.appendChild(el('span', { class: 'chart-legend-name' }, chartText(s && s.name)));
    li.appendChild(el('span', { class: 'chart-legend-val' }, formatCzk(v)));
    list.appendChild(li);
  });
  host.replaceChildren(list);
}

/* ==================== prstenec ==================== */
function chartDonut(host, cfg) {
  if (!host) return;
  const c = cfg || {};
  const value = num(c.value), max = num(c.max);
  const p = progressPct(value, max);
  chartMount(host, function (W) {
    const size = Math.min(W, num(c.size) || 168) || 168;
    const sw = Math.max(8, Math.round(size * 0.11)), r = (size - sw) / 2 - 1;
    const svg = chartSvgRoot(size, size, c.title || 'Postup', c.desc ||
      (formatCzk(value) + ' z ' + formatCzk(max)));
    // Otáčíme celé <svg>, ne kružnici. Kdyby se točila kružnice, text ve
    // středu by se točil s ní; takhle je střed obyčejné HTML nad obrázkem.
    svg.setAttribute('style', 'width:100%;height:auto;display:block;max-width:' + size +
      'px;margin:0 auto;transform:rotate(-90deg)');
    const g = svgEl('g', { 'aria-hidden': 'true' });
    g.appendChild(svgEl('circle', { cx: chartNum(size / 2), cy: chartNum(size / 2), r: chartNum(r),
      fill: 'none', stroke: 'var(--track, currentColor)', 'stroke-opacity': 0.35, 'stroke-width': sw }));
    const arc = svgEl('circle', { cx: chartNum(size / 2), cy: chartNum(size / 2), r: chartNum(r),
      fill: 'none', 'stroke-width': sw, 'stroke-linecap': 'round',
      stroke: (max > 0 && value > max) ? 'var(--bar-over, currentColor)' : 'var(--bar-act, currentColor)' });
    // pathLength="100" udělá z dasharray rovnou procenta — obvod se nepočítá.
    const on = chartNum(p.ratio * 100);
    const full = chartHasPathLength ? on + ' ' + chartNum(100 - on) : donutDash(p.ratio, r);
    if (chartHasPathLength) arc.setAttribute('pathLength', '100');
    arc.setAttribute('stroke-dasharray', full);
    if (!chartReduced() && p.ratio > 0 && typeof requestAnimationFrame === 'function') {
      arc.setAttribute('stroke-dasharray', chartHasPathLength ? '0 100' : donutDash(0, r));
      arc.style.transition = 'stroke-dasharray .45s ease-out';
      requestAnimationFrame(function () { arc.setAttribute('stroke-dasharray', full); });
    }
    g.appendChild(arc);
    svg.appendChild(g);
    const wrap = el('div', { class: 'chart-donut', style: 'position:relative' });
    const mid = el('div', { class: 'chart-donut-center',
      style: 'position:absolute;inset:0;display:flex;flex-direction:column;' +
             'align-items:center;justify-content:center;text-align:center;pointer-events:none' });
    const big = el('strong', { class: 'chart-donut-value' });
    setText(big, c.centerText !== null && c.centerText !== undefined ? c.centerText : p.label);
    mid.appendChild(big);
    if (c.centerSub) { const sub = el('span', { class: 'chart-donut-sub' }); setText(sub, c.centerSub); mid.appendChild(sub); }
    wrap.appendChild(svg); wrap.appendChild(mid);
    return [wrap, chartTable(c.title || 'Postup', ['Ukazatel', 'Hodnota'],
      [['Naspořeno', formatCzk(value)], ['Cíl', formatCzk(max)], ['Hotovo', p.label]])];
  });
}

/* ==================== dvanáct měsíčních sloupků ==================== */
function chartYearColumns(host, series, opts) {
  if (!host) return;
  const o = opts || {};
  const mini = !!o.mini, vals = [];
  for (let i = 0; i < 12; i++) {
    const s = Array.isArray(series) ? series[i] : null;
    vals.push(num(s && typeof s === 'object' ? s.v : s));
  }
  chartMount(host, function (W) {
    const padB = mini ? 2 : 14, H = (mini ? 32 : 92) + padB, baseY = H - padB;
    // niceScale nikdy nevrátí nulu, takže rok bez jediné částky vykreslí
    // rovné dno a dvanáct nulových sloupků — ne dělení nulou.
    const top = niceScale(Math.max.apply(null, vals))[1];
    const cw = W / 12, bw = Math.max(3, cw - (mini ? 2 : 5));
    const svg = chartSvgRoot(W, H, o.title || 'Přehled roku',
      o.desc || 'Dvanáct sloupků, jeden za každý měsíc.');
    const g = svgEl('g', { 'aria-hidden': 'true' });
    g.appendChild(svgEl('line', { x1: 0, y1: baseY, x2: chartNum(W), y2: baseY,
      stroke: 'var(--grid, currentColor)', 'stroke-width': 1,
      'shape-rendering': 'crispEdges', 'vector-effect': 'non-scaling-stroke' }));
    vals.forEach(function (v, m) {
      const h = chartNum(clamp(v / top, 0, 1) * (baseY - 2));
      g.appendChild(svgEl('rect', { x: chartNum(m * cw + (cw - bw) / 2), y: chartNum(baseY - h),
        width: chartNum(bw), height: h, rx: 2,
        fill: m === o.active ? 'var(--bar-act, currentColor)' : 'var(--bar-plan, currentColor)' }));
      if (!mini) g.appendChild(svgEl('text', { x: chartNum(m * cw + cw / 2), y: H - 3,
        'text-anchor': 'middle', 'font-size': 9, fill: 'var(--chart-ink, currentColor)',
        'fill-opacity': 0.65 }, monthShortCs(m)));
    });
    svg.appendChild(g);
    return [svg, chartTable(o.title || 'Přehled roku', ['Měsíc', 'Částka'],
      vals.map(function (v, m) { return [monthShortCs(m), formatCzk(v)]; }))];
  });
}

/* ==================== útlý pruh cíle ==================== */
function chartGoalBar(host, saved, target) {
  if (!host) return;
  const p = progressPct(saved, target);
  chartMount(host, function (W) {
    const H = 10, rx = 5, w = Math.max(1, W);
    const svg = chartSvgRoot(w, H, 'Postup spoření',
      formatCzk(num(saved)) + ' z ' + formatCzk(num(target)) + ', hotovo ' + p.label);
    const g = svgEl('g', { 'aria-hidden': 'true' });
    g.appendChild(svgEl('rect', { x: 0, y: 0, width: chartNum(w), height: H, rx: rx,
      fill: 'var(--track, currentColor)', 'fill-opacity': 0.35 }));
    const fill = chartNum(p.ratio * w);
    if (fill > 0) g.appendChild(svgEl('rect', { x: 0, y: 0, width: fill, height: H, rx: rx,
      fill: 'var(--bar-act, currentColor)' }));
    svg.appendChild(g);
    return [svg, chartTable('Postup spoření', ['Ukazatel', 'Hodnota'],
