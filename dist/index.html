// 55-sync.js — volitelná synchronizace přes Google Apps Script — vlastní: L12
//
// VYPNUTO, DOKUD NENÍ VYPLNĚNÁ ADRESA I HESLO. Když syncOn() vrátí false,
// tenhle soubor neudělá ani jeden fetch, nezaloží časovač ani posluchače.
// Je to jediné místo v celé aplikaci, kde se sahá na síť (železné pravidlo 7).
//
// Přenos je daný serverem (sync/PROTOKOL.md):
//   POST, jediná hlavička Content-Type: text/plain;charset=utf-8. Žádná vlastní
//   hlavička — jinak prohlížeč pošle preflight OPTIONS a Apps Script na něj
//   neumí odpovědět. Heslo cestuje jen v těle, nikdy v hlavičce ani v adrese.
//   cache:'no-store' je povinný: Safari umí u cachovaného přesměrování mezi
//   originy zahodit CORS hlavičky a /exec vždy přesměrovává na
//   script.googleusercontent.com, proto redirect:'follow'.
//   Server odpovídá VŽDY HTTP 200 a chyby píše do těla jako {ok:false, code},
//   protože ContentService neumí nastavit stavový kód. Na response.status se
//   tedy nikdy nevětví; větví se na ok a code. Co není JSON, je Googlí HTML
//   stránka (přihlášení nebo chyba nasazení) — a to je vlastní druh chyby.
//
// Nová jména na nejvyšší úrovni jsou zakázaná (src/_CONTRACT.md), stav i
// pomocníci proto visí na vlastních funkcích — stejně jako undoPush.stack.

/* ---------- zapnuto? ---------- */

// Jediná brána. Volá ji každý vstupní bod dřív, než se cokoliv stane.
function syncOn() {
  const s = state && state.settings;
  if (!s) return false;
  const url = typeof s.syncUrl === 'string' ? s.syncUrl.trim() : '';
  const secret = typeof s.syncSecret === 'string' ? s.syncSecret.trim() : '';
  if (!url || !secret) return false;         // prázdné nastavení = nulová síť
  return /^https:\/\/\S+$/i.test(url);
}

// Stav klienta. Serverová revize je něco jiného než doc.rev, drží se zvlášť.
syncOn.st = {
  baseRev: null,   // serverová revize, ze které lokální dokument vychází; null = neznámá
  base: null,      // poslední společná verze dokumentu (jen v paměti, na jednu relaci)
  status: 'idle',  // idle | busy | ok | err
  note: '',        // hotová česká věta poslední chyby
  busy: false,
  again: false,    // přišel požadavek, když se právě synchronizovalo
  timer: 0,        // debounce automatického odeslání
  pending: null,   // stažený dokument čekající, až uživatelka dopíše
  pushedRev: -1,   // doc.rev, který už na serveru je — proti prázdným odesláním
  armed: false,    // posluchače na automatické odesílání jsou navázané
};

// Automatika se navazuje AŽ po prvním úspěšném spojení. Dokud je synchronizace
// vypnutá, nemá aplikace kvůli ní ani jeden posluchač ani časovač.
syncOn.arm = function () {
  const S = syncOn.st;
  if (S.armed || !syncOn()) return;
  const app = qs('#app');
  if (!app) return;
  S.armed = true;
  // focusout = hotová úprava částky, change = přepínač nebo výběr.
  app.addEventListener('focusout', function () { syncPush(false); });
  app.addEventListener('change', function () { syncPush(false); });
};

/* ---------- přenos ---------- */

syncOn.io = {
  // Jediné místo v celé aplikaci, kde se sahá na síť.
  // payload === null je zdvořilostní GET: server ho zvládne bez hesla, takže
  // se adresa dá ověřit i prostým vložením do prohlížeče.
  async send(url, payload, ms) {
    const ctl = new AbortController();
    const t = setTimeout(function () { ctl.abort(); }, ms || 20000);
    const opts = {
      method: payload ? 'POST' : 'GET',
      redirect: 'follow',       // /exec vždy přesměrovává na googleusercontent
      cache: 'no-store',        // jinak Safari u cachovaného přesměrování ztratí CORS
      credentials: 'omit',
      signal: ctl.signal,
    };
    if (payload) {
      // Jediná hlavička. Cokoliv navíc si vyžádá preflight OPTIONS a na ten
      // Apps Script neumí odpovědět. Heslo je uvnitř těla, ne v hlavičce.
      opts.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
      opts.body = JSON.stringify(payload);
    }
    try {
      const res = await fetch(url, opts);
      const text = await res.text();
      clearTimeout(t);
      return syncOn.io.parse(text);
    } catch (e) {
      clearTimeout(t);
      return syncOn.io.fail(e, ctl.signal.aborted);
    }
  },

  get(url, ms) { return syncOn.io.send(url, null, ms); },
  post(url, payload, ms) { return syncOn.io.send(url, payload, ms); },

  // Odpověď se posuzuje podle těla, nikdy podle stavového kódu.
  parse(text) {
    const s = String(text === null || text === undefined ? '' : text).trim();
    if (!s) return { ok: false, code: 'empty', note: 'Server neposlal žádnou odpověď. Nasaď skript znovu jako novou verzi.' };
    if (s.charAt(0) !== '{' && s.charAt(0) !== '[') return { ok: false, code: 'html', note: syncOn.io.HTML_NOTE };
    let data = null;
    try { data = JSON.parse(s); } catch (e) { return { ok: false, code: 'html', note: syncOn.io.HTML_NOTE }; }
    if (!data || typeof data !== 'object' || Array.isArray(data)) {
      return { ok: false, code: 'html', note: syncOn.io.HTML_NOTE };
    }
    if (data.ok === true) return { ok: true, code: 'ok', data: data };
    const code = typeof data.code === 'number' ? data.code : String(data.code || 'error');
    return { ok: false, code: code, note: syncOn.io.czech(code), data: data };
  },

  HTML_NOTE: 'Adresa vrátila webovou stránku Googlu, ne data. V Apps Scriptu nasaď skript jako webovou aplikaci se spouštěním „Já“ a přístupem „Kdokoli“ a použij adresu končící /exec.',

  czech(code) {
    if (code === 400) return 'Server požadavku nerozuměl. Nahraj do Apps Scriptu aktuální verzi skriptu.';
    if (code === 401) return 'Chyba: špatné heslo';
    if (code === 409) return 'Data se mezitím změnila na jiném zařízení.';
    if (code === 413) return 'Rozpočet je na tabulku moc velký. Ulož si zálohu a ubereš starý rok.';
    if (code === 422) return 'Server data odmítl, neodpovídají očekávanému tvaru. Data v telefonu zůstávají.';
    if (code === 500) return 'Skript hlásí chybu na straně Googlu. Zkus to za chvíli, v telefonu je všechno v pořádku.';
    if (code === 503) return 'Tabulka je právě zaneprázdněná. Zkusím to znovu.';
    return 'Server odmítl požadavek.';
  },

  // Fetch hází TypeError na síť i na CORS a nerozliší je. Rozliší se to výš:
  // syncTest pošle nejdřív GET, takže ví, jestli se server vůbec ozval.
  fail(e, aborted) {
    if (aborted || (e && e.name === 'AbortError')) {
      return { ok: false, code: 'timeout', note: 'Server neodpověděl včas. Zkus to prosím znovu.' };
    }
    if (typeof navigator !== 'undefined' && navigator.onLine === false) {
      return { ok: false, code: 'offline', note: 'Jsi bez internetu. Data zůstávají v telefonu, pošlu je později.' };
    }
    return { ok: false, code: 'net', note: 'Nepodařilo se spojit' };
  },

  // Zapíše chybu do stavu a vrátí ji ve tvaru, který vrací i veřejné funkce.
  say(res) {
    const S = syncOn.st;
    S.status = 'err';
    S.note = res.note || 'Nepodařilo se spojit';
    patchSyncStatus();
    return { ok: false, code: res.code, text: S.note };
  },
};

/* ---------- vyzkoušení spojení ---------- */

// Nejdřív holý GET (zdravotní stav, bez hesla), pak ping s heslem.
// Vrací { ok, code, text } — text je česká věta rovnou k zobrazení.
async function syncTest(url, secret) {
  const u = String(url === null || url === undefined ? '' : url).trim();
  const k = String(secret === null || secret === undefined ? '' : secret).trim();
  if (!u) return { ok: false, code: 'url', text: 'Vyplň adresu webové aplikace. Získáš ji v Apps Scriptu po nasazení.' };
  if (!/^https:\/\//i.test(u)) return { ok: false, code: 'url', text: 'Adresa musí začínat https:// — zkopíruj ji celou z Apps Scriptu.' };
  if (!/\/exec(\?|$)/.test(u)) return { ok: false, code: 'url', text: 'Adresa musí končit /exec. Adresa s /dev funguje jen tobě přihlášené.' };
  if (!k) return { ok: false, code: 'secret', text: 'Vyplň heslo. Je to hodnota SYNC_SECRET ve vlastnostech skriptu.' };
  if (k.length < 32) return { ok: false, code: 'secret', text: 'Heslo musí mít aspoň 32 znaků, kratší skript odmítne.' };

  const health = await syncOn.io.get(u, 20000);
  if (!health.ok) {
    if (health.code === 'net') return { ok: false, code: 'net', text: 'Nepodařilo se spojit. Zkontroluj internet a adresu.' };
    return { ok: false, code: health.code, text: health.note };
  }
  if (!health.data || health.data.app !== 'rozpocet-sync') {
    return { ok: false, code: 'other', text: 'Na téhle adrese odpovídá něco jiného než synchronizace Rozpočtu.' };
  }

  const ping = await syncOn.io.post(u, { secret: k, op: 'ping' }, 20000);
  if (!ping.ok) {
    if (ping.code === 401) return { ok: false, code: 401, text: 'Heslo nesouhlasí. Musí přesně odpovídat vlastnosti SYNC_SECRET ve skriptu.' };
    // GET prošel, POST ne — server žije, blokuje to prohlížeč.
    if (ping.code === 'net') {
      return { ok: false, code: 'cors', text: 'Prohlížeč spojení zablokoval (CORS). Nasaď skript znovu jako novou verzi webové aplikace s přístupem „Kdokoli“.' };
    }
    return { ok: false, code: ping.code, text: ping.note };
  }
  const rev = health.data.rev | 0;
  const uloz = health.data.hasDoc ? (' Na serveru je uložený rozpočet (revize ' + rev + ').') : ' Na serveru zatím nic není.';
  return { ok: true, code: 'ok', text: 'Spojení funguje a heslo sedí.' + uloz, rev: rev, hasDoc: !!health.data.hasDoc };
}

/* ---------- stažení ---------- */

async function syncPull() {
  if (!syncOn()) return { ok: false, code: 'off', text: 'Vypnuto' };
  const S = syncOn.st;
  if (S.busy) return { ok: false, code: 'busy', text: 'Právě synchronizuji.' };
  S.busy = true; S.status = 'busy'; patchSyncStatus();
  try { return await syncPull.once(); }
  finally { S.busy = false; if (S.status === 'busy') S.status = 'ok'; patchSyncStatus(); }
}

syncPull.once = async function () {
  const S = syncOn.st, s = state.settings;
  const res = await syncOn.io.post(s.syncUrl.trim(), { secret: s.syncSecret, op: 'pull' }, 45000);
  if (!res.ok) return syncOn.io.say(res);
  const rev = res.data.rev | 0;
  const remote = res.data.doc;
  if (remote === null || remote === undefined) {
    S.baseRev = rev; S.base = null; S.status = 'ok'; S.note = '';
    return { ok: true, code: 'empty', text: 'Na serveru zatím nic není.' };
  }
  if (S.baseRev !== null && rev === S.baseRev) {
    S.status = 'ok'; S.note = '';
    return { ok: true, code: 'same', text: 'Nic nového.' };
  }
  // Plná pojistka PŘED jakoukoliv změnou. Vrátit se dá i to, co se nepovedlo.
  snapshotSave('pred-synchronizaci');
  return await syncPull.absorb(remote, rev);
};

// Sloučí stažený dokument s tím naším a použije ho. Konflikty se ptají.
syncPull.absorb = async function (remote, rev) {
  const S = syncOn.st;
  const merged = syncMerge(remote, state);
  if (merged.conflicts.length) {
    const answered = await syncMerge.ask(merged.conflicts);
    if (!answered) return { ok: false, code: 'cancel', text: 'Slučování jsi zrušila, nic se nezměnilo.' };
    syncMerge.settle(merged.conflicts);
  }
  // Nikdy nepřepisovat rozepsané pole (železné pravidlo 6).
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) {
    S.pending = { doc: merged.doc, rev: rev };
    document.addEventListener('focusout', syncPull.flush, { once: true });
    return { ok: true, code: 'deferred', text: 'Nová data použiju, jakmile dopíšeš.' };
  }
  return syncPull.commit(merged.doc, rev);
};

// Posluchač se zakládá až ve chvíli, kdy je co použít, a hned se zase ruší.
syncPull.flush = function () {
  const S = syncOn.st, p = S.pending;
  S.pending = null;
  if (!p) return;
  syncPull.commit(p.doc, p.rev);
  syncPush(false);                     // co jsme mezitím napsali, pošli dál
};

syncPull.commit = function (doc, rev) {
  const S = syncOn.st;
  const rep = loadParseObj(doc);       // migrace + validace, nesmysl se nepoužije
  if (!rep.ok) {
    S.status = 'err';
    S.note = 'Stažená data neodpovídají očekávanému tvaru, zůstala tvoje.';
    patchSyncStatus();
    return { ok: false, code: 'invalid', text: S.note };
  }
  // Připojovací údaje, obrazovka a identita zařízení zůstávají místní.
  const keepSettings = state.settings, keepUi = state.ui;
  const keepDevice = state.deviceId, keepYear = state.activeYear;
  state = rep.doc;
  state.settings = keepSettings;
  state.ui = keepUi;
  state.deviceId = keepDevice;
  if (state.years[String(keepYear)]) state.activeYear = keepYear;
  state.rev = (state.rev | 0) + 1;
  S.baseRev = rev;
  S.base = storageClone(doc);
  S.status = 'ok'; S.note = '';
  setSetting('lastSyncAt', storageStamp());
  syncOn.arm();
  invalidateAll();
  saveNow();
  renderApp();
  return { ok: true, code: 'applied', text: 'Data jsou sladěná.' };
};

/* ---------- odeslání ---------- */

// manual = true pošle hned. Jinak se počká ~750 ms po poslední změně.
// Lokální ukládání na tomhle nezávisí, to běží samo a okamžitě.
function syncPush(manual) {
  const S = syncOn.st;
  if (!syncOn()) return Promise.resolve({ ok: false, code: 'off', text: 'Vypnuto' });
  if (S.timer) { clearTimeout(S.timer); S.timer = 0; }
  if (!manual) {
    S.timer = setTimeout(function () { S.timer = 0; syncPush.run(false); }, 750);
    return Promise.resolve({ ok: true, code: 'planned' });
  }
  return syncPush.run(true);
}

syncPush.run = async function (loud) {
  const S = syncOn.st;
  if (!syncOn()) return { ok: false, code: 'off', text: 'Vypnuto' };
  if (S.busy) { S.again = true; return { ok: false, code: 'busy', text: 'Právě synchronizuji.' }; }
  S.busy = true; S.status = 'busy'; patchSyncStatus();
  try {
    // Automatika po každém focusout: co se nezměnilo, se neposílá.
    if (!loud && S.baseRev !== null && S.pushedRev === (state.rev | 0)) {
      return { ok: true, code: 'nochange', text: 'Nic nového k odeslání.' };
    }
    // Neznámá základní revize (start aplikace, nejistý zápis) = nejdřív stáhnout.
    if (S.baseRev === null) {
      const pulled = await syncPull.once();
      if (!pulled.ok) return pulled;
      if (pulled.code === 'deferred') return pulled;
    }
    return await syncPush.once(loud, { merge: 0, lock: 0 });
  } finally {
    S.busy = false;
    if (S.status === 'busy') S.status = 'ok';
    patchSyncStatus();
    if (S.again) { S.again = false; syncPush(false); }
  }
};

syncPush.once = async function (loud, tries) {
  const S = syncOn.st, s = state.settings;
  const doc = syncPush.clean(state);
  const res = await syncOn.io.post(s.syncUrl.trim(),
    { secret: s.syncSecret, op: 'push', baseRev: S.baseRev | 0, doc: doc }, 45000);

  if (res.ok) {
    S.baseRev = res.data.rev | 0;
    S.base = doc;                      // na tomhle jsme se právě shodli
    S.status = 'ok'; S.note = '';
    setSetting('lastSyncAt', storageStamp());
    S.pushedRev = state.rev | 0;
    syncOn.arm();
    patchSyncStatus();
    return { ok: true, code: 'ok', rev: S.baseRev, text: 'Uloženo na server.' };
  }

  // Někdo zapsal dřív. Server posílá svůj dokument, sloučíme a zkusíme jednou znovu.
  if (res.code === 409 && tries.merge === 0) {
    tries.merge = 1;
    const rev = res.data && (res.data.rev | 0);
    const remote = res.data && res.data.doc;
    if (!remote) { S.baseRev = null; return syncOn.io.say(res); }
    snapshotSave('pred-slucenim');
    const absorbed = await syncPull.absorb(remote, rev);
    if (!absorbed.ok) return absorbed;
    if (absorbed.code === 'deferred') return absorbed;   // pošle se po focusout
    return await syncPush.once(loud, tries);
  }

  // Zámek tabulky. Odstup s náhodným přídavkem, nejvýš třikrát.
  if (res.code === 503 && tries.lock < 3) {
    const wait = 1000 * Math.pow(2, tries.lock) + Math.floor(Math.random() * 500);
    tries.lock += 1;
    await new Promise(function (r) { setTimeout(r, wait); });
    return await syncPush.once(loud, tries);
  }

  if (res.code === 401) {
    S.status = 'err'; S.note = 'Chyba: špatné heslo';
    patchSyncStatus();
    return { ok: false, code: 401, text: 'Heslo nesouhlasí. Oprav ho v nastavení, dokud to neuděláš, nic neodesílám.' };
  }

  // Po síti nebo timeoutu nevíme, jestli zápis prošel. Příště se nejdřív stahuje.
  if (res.code === 'net' || res.code === 'timeout' || res.code === 'offline') S.baseRev = null;
  return syncOn.io.say(res);
};

// Heslo ani adresa nikdy neopustí telefon — ani v kopii dokumentu.
syncPush.clean = function (doc) {
  const copy = storageClone(doc);
  if (copy && copy.settings) { copy.settings.syncSecret = ''; copy.settings.syncUrl = ''; }
  return copy;
};

/* ---------- slučování ----------
   Po záznamech, nikdy hodinami zařízení přes celý dokument. Mazání je měkké,
   proto ho slučování vidí. Vrací { doc, conflicts } a nesahá na DOM. */

function syncMerge(remote, local) {
  const out = storageClone(local) || {};
  const conflicts = [];
  const R = (remote && typeof remote === 'object') ? remote : {};
  const base = syncOn.st.base;
  const since = (local && local.settings && typeof local.settings.lastSyncAt === 'string')
    ? local.settings.lastSyncAt : '';
  if (!out.years || typeof out.years !== 'object') out.years = {};
  const keys = Object.create(null);
  Object.keys(R.years || {}).forEach(function (k) { keys[k] = 1; });
  Object.keys(out.years).forEach(function (k) { keys[k] = 1; });

  Object.keys(keys).sort().forEach(function (key) {
    const ry = (R.years || {})[key];
    if (!ry || typeof ry !== 'object') return;              // rok jen u nás
    if (!out.years[key]) { out.years[key] = storageClone(ry); return; }   // rok jen na serveru
    const ly = out.years[key];
    // Rok, kterému u nás chybí část struktury, se doplní z té cizí kopie.
    if (!Array.isArray(ly.catalog)) ly.catalog = storageClone(ry.catalog) || [];
    if (!Array.isArray(ly.tx)) ly.tx = storageClone(ry.tx) || [];
    if (!Array.isArray(ly.months)) ly.months = storageClone(ry.months) || [];
    const by = (base && base.years) ? base.years[key] : null;
    const ctx = { year: +key, m: null, since: since, cat: Object.create(null) };
    (ly.catalog || []).forEach(function (c) { if (c && c.id) ctx.cat[c.id] = c; });
    (ry.catalog || []).forEach(function (c) { if (c && c.id && !ctx.cat[c.id]) ctx.cat[c.id] = c; });

    syncMerge.list(ly.catalog, ry.catalog, by && by.catalog, 'cat', ctx, conflicts);
    for (let m = 0; m < 12; m++) {
      const lm = (ly.months || [])[m], rm = (ry.months || [])[m];
      if (!rm) continue;
      if (!lm) { ly.months[m] = storageClone(rm); continue; }
      if (!lm.note && rm.note) lm.note = rm.note;
      const bm = by && by.months ? by.months[m] : null;
      ctx.m = m;
      syncMerge.list(lm.entries, rm.entries, bm && bm.entries, 'entry', ctx, conflicts);
    }
    ctx.m = null;
    syncMerge.list(ly.tx, ry.tx, by && by.tx, 'tx', ctx, conflicts);
  });
  return { doc: out, conflicts: conflicts };
}

// Dva seznamy podle id. Co přibylo jen na jedné straně, zůstává oběma.
syncMerge.list = function (mine, theirs, baseList, kind, ctx, conflicts) {
  if (!Array.isArray(mine) || !Array.isArray(theirs)) return;
  const index = function (arr) {
    const map = Object.create(null);
    if (Array.isArray(arr)) for (let i = 0; i < arr.length; i++) {
      if (arr[i] && arr[i].id) map[arr[i].id] = arr[i];
    }
    return map;
  };
  const mineIdx = index(mine), baseIdx = index(baseList);
  for (let i = 0; i < theirs.length; i++) {
    const b = theirs[i];
    if (!b || !b.id) continue;
    const a = mineIdx[b.id];
    if (!a) { mine.push(storageClone(b)); continue; }
    syncMerge.pair(a, b, baseIdx[b.id] || null, kind, ctx, conflicts);
  }
};

syncMerge.pair = function (a, b, base, kind, ctx, conflicts) {
  if (deepEqual(a, b)) return;
  const au = typeof a.updatedAt === 'string' ? a.updatedAt : '';
  const bu = typeof b.updatedAt === 'string' ? b.updatedAt : '';
  // Se známou společnou verzí se pozná, kdo sáhl kam. Bez ní se použije
  // čas posledního sladění: co je novější, to vzniklo po něm.
  const aCh = base ? !deepEqual(a, base) : (au > ctx.since);
  const bCh = base ? !deepEqual(b, base) : (bu > ctx.since);
  if (!aCh && bCh) { syncMerge.copy(a, b, null); return; }   // změnil jen server
  if (aCh && !bCh) return;                                   // změnili jsme jen my

  // Smazání proti úpravě: ptát se, ve výchozím stavu data zůstávají.
  const flag = kind === 'cat' ? 'archived' : 'del';
  const aDel = a[flag] === true, bDel = b[flag] === true;
  if (aDel !== bDel) {
    conflicts.push(syncMerge.mark(a, aDel, bDel, flag, kind, ctx, aDel ? 'remote' : 'local'));
    if (aDel) syncMerge.copy(a, b, [flag]);                  // vzkřísit i obsah
    a[flag] = false;
    return;
  }

  const money = kind === 'entry' ? ['plan', 'act'] : (kind === 'tx' ? ['amt'] : []);
  let asked = false;
  for (let i = 0; i < money.length; i++) {
    const f = money[i];
    if (a[f] === b[f]) continue;
    conflicts.push(syncMerge.mark(a, a[f], b[f], f, kind, ctx, 'local'));
    asked = true;
  }
  // Částky se nikdy nehádají. Zbytek záznamu vezme novější strana.
  if (bu > au) syncMerge.copy(a, b, asked ? money : null);
};

// Přepíše a hodnotami z b. `skip` chrání pole, o kterých rozhodne uživatelka.
syncMerge.copy = function (a, b, skip) {
  for (const k in b) {
    if (!Object.prototype.hasOwnProperty.call(b, k)) continue;
    if (k === 'id') continue;
    if (skip && skip.indexOf(k) >= 0) continue;
    a[k] = storageClone(b[k]);
  }
};

// Konflikt drží živý odkaz na záznam ve sloučeném dokumentu, takže se
// odpověď zapíše přesně tam, odkud otázka přišla.
syncMerge.mark = function (rec, mine, theirs, field, kind, ctx, choice) {
  const cat = ctx.cat[rec.cat] || ctx.cat[rec.id] || null;
  const name = cat && cat.name ? cat.name : (kind === 'tx' ? 'Zápis v deníku' : 'Položka');
  const kdy = ctx.m === null ? String(ctx.year) : monthLabelCs(ctx.year, ctx.m);
  const co = field === 'plan' ? 'plán' : (field === 'act' ? 'skutečnost'
    : (field === 'amt' ? 'částka' : 'smazání'));
  const money = field === 'plan' || field === 'act' || field === 'amt';
  return {
    rec: rec, id: rec.id, field: field,
    kind: money ? 'amount' : 'delete',
    year: ctx.year, m: ctx.m,
    label: name + ' · ' + kdy + ' · ' + co,
    local: mine, remote: theirs,
    localText: money ? formatCzk(mine) : (mine ? 'smazat' : 'nechat'),
    remoteText: money ? formatCzk(theirs) : (theirs ? 'smazat' : 'nechat'),
    choice: choice || 'local',
  };
};

// Zapíše zvolené hodnoty. Bez volání zůstává výchozí (bezpečná) varianta.
syncMerge.settle = function (conflicts) {
  (conflicts || []).forEach(function (c) {
    if (!c || !c.rec) return;
    c.rec[c.field] = c.choice === 'remote' ? c.remote : c.local;
  });
  return conflicts;
};

// Malý panel s otázkami. Bez confirm(), bez innerHTML.
syncMerge.ask = function (conflicts) {
  return openSheet({
    title: 'Dvě různá čísla',
    build: function (body) {
      body.appendChild(el('p', { class: 'sheet-text' },
        'Tohle se změnilo na obou zařízeních. Vyber, co platí — nic jiného neměním.'));
      conflicts.forEach(function (c) {
        const wrap = el('div', { class: 'field' });
        wrap.appendChild(el('span', { class: 'field-label' }, c.label));
        const row = el('div', { class: 'sync-choice' });
        const mine = el('button', { class: 'chip is-active', type: 'button' }, 'V telefonu: ' + c.localText);
        const theirs = el('button', { class: 'chip', type: 'button' }, 'Na serveru: ' + c.remoteText);
        if (c.choice === 'remote') { mine.classList.remove('is-active'); theirs.classList.add('is-active'); }
        mine.addEventListener('click', function () {
          c.choice = 'local'; mine.classList.add('is-active'); theirs.classList.remove('is-active');
        });
        theirs.addEventListener('click', function () {
          c.choice = 'remote'; theirs.classList.add('is-active'); mine.classList.remove('is-active');
        });
        row.appendChild(mine); row.appendChild(theirs);
        wrap.appendChild(row);
        body.appendChild(wrap);
      });
    },
    foot: [
      { label: TXT.cancel, kind: 'ghost', value: null },
      { label: 'Použít', kind: 'primary', value: conflicts },
    ],
  });
};

/* ---------- stav pro nastavení ---------- */

function syncStatusText() {
  const S = syncOn.st;
  if (!syncOn()) return 'Vypnuto';
  if (S.busy) return 'Synchronizuji…';
  if (S.status === 'err' && S.note) return S.note;
  const at = state.settings.lastSyncAt;
  const t = typeof at === 'string' && at ? Date.parse(at) : NaN;
  if (!Number.isFinite(t)) return 'Zapnuto, zatím nesynchronizováno';
  return 'Naposledy synchronizováno ' + syncStatusText.ago(Date.now() - t);
}

syncStatusText.ago = function (ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 45) return 'právě teď';
  const min = Math.round(s / 60);
  if (min < 60) return min <= 1 ? 'před minutou' : 'před ' + min + ' minutami';
  const h = Math.round(min / 60);
  if (h < 24) return h <= 1 ? 'před hodinou' : 'před ' + h + ' hodinami';
  const d = Math.round(h / 24);
  return d <= 1 ? 'včera' : 'před ' + d + ' dny';
};

// Heslo se nikde nezobrazuje ani nevypisuje. Pro nastavení jen tečky.
syncStatusText.mask = function (secret) {
  const k = typeof secret === 'string' ? secret.trim() : '';
  return k ? '••••••••' : '';
};

// Nastavení má na stav jediný řádek — slot [data-d="sync-status"] uvnitř
// #screen-more (vykresluje 54-year-more.js, starší jméno slotu se bere taky).
// Píše se jen textContent, takže se tím nedá nic rozbít, a když obrazovka
// nastavení není vykreslená, funkce hned skončí.
function patchSyncStatus() {
  const screen = qs('#screen-more.is-active');
  if (!screen) return;
  const node = qs('[data-d="sync-status"]', screen)
    || qs('[data-d="sync-state"]', screen) || qs('#sync-status', screen);
  if (node) setText(node, syncStatusText());
  // Kdyby se klíč někde vypisoval jako text, ať jsou z něj jen tečky.
  const secret = qs('[data-d="sync-secret"]', screen);
  if (secret) setText(secret, syncStatusText.mask(state.settings.syncSecret));
}

/* ---------- akce ---------- */

Object.assign(ACTIONS, {
  // Připojení a zkouška. Obrazovka nastavení adresu ani heslo needituje —
  // jediné místo, kde se zapisují, je tenhle panel, a to teprve po úspěšné
  // zkoušce. Uložit adresu, která nefunguje, by byla past.
  'sync.test': function () {
    const s = state.settings;
    const foot = [{ label: TXT.cancel, kind: 'ghost', value: null }];
    if (s.syncUrl) foot.push({
      label: 'Vypnout', kind: 'danger',
      onClick: function () {
        setSetting('syncUrl', ''); setSetting('syncSecret', '');
        const S = syncOn.st;
        S.baseRev = null; S.base = null; S.status = 'idle'; S.note = '';
        flushSave(); patchSyncStatus(); patch();
        toast('Synchronizace je vypnutá. Nic se nikam neodesílá.');
        return true;
      }
    });
    foot.push({
      label: 'Vyzkoušet a uložit', kind: 'primary',
      onClick: function (body) {
        const out = body.querySelector('[data-d="sync-result"]');
        const url = body.querySelector('[data-f="url"]').value.trim();
        const key = body.querySelector('[data-f="secret"]').value.trim() || state.settings.syncSecret;
        setText(out, 'Zkouším spojení…');
        syncTest(url, key).then(function (r) {
          setText(out, r.text);
          if (!r.ok) return;
          setSetting('syncUrl', url);
          setSetting('syncSecret', key);
          const S = syncOn.st;
          S.baseRev = null; S.base = null; S.status = 'ok'; S.note = '';
          flushSave();
          closeSheet(true);
          toast('Hotovo. Data sladíš tlačítkem Synchronizovat teď.');
          patchSyncStatus(); patch();
        });
        return false;                   // panel zůstává, dokud není výsledek
      }
    });
    openSheet({
      title: 'Synchronizace mezi zařízeními',

    ['plus', '+250', 25000],
    ['minus', '-500', -50000],
    ['typografický minus', '−500', -50000],
  ];
  for (const c of cases) assertEq('parser: ' + c[0], P(c[1]).minor, c[2]);

  // Prázdné pole musí být null, nikdy nula. Number("") je nula a přesně
  // takhle se smazané pole tiše stane skutečnou nulou v součtu.
  assertEq('parser: prázdno je null', P(''), { ok: true, minor: null, reason: 'blank' });
  assertEq('parser: mezery jsou null', P('   '), { ok: true, minor: null, reason: 'blank' });
  for (const bad of ['abc', '50%', '(500)', '1,2,3', '1e3', '٣٥']) {
    assertTrue('parser odmítne: ' + bad, P(bad).ok === false && P(bad).minor === null);
  }
  assertEq('parser: strop', P('999999999999').reason, 'range');
  assertEq('parser: žádná záporná nula', Object.is(P('-0').minor, -0), false);

  /* --- formátování --- */
  assertEq('formát: nula', F(0), '0 Kč');
  assertEq('formát: tisíce', F(123400), '1 234 Kč');
  // Haléře se ukazují jen když nějaké jsou; při vynuceném zaokrouhlení na
  // koruny nesmí vzniknout „-0 Kč".
  assertEq('formát: -0,40 Kč se neztratí', F(-40), '-0,40 Kč');
  assertEq('formát: zaokrouhlená nula nemá minus', F(-40, { decimals: 0 }), '0 Kč');
  assertEq('formát: záporné s haléři', F(-123450), '-1 234,50 Kč');
  assertEq('formát: záporné na koruny', F(-123450, { decimals: 0 }), '-1 235 Kč');
  assertEq('formát: dvě místa', F(123450, { decimals: 2 }), '1 234,50 Kč');
  assertEq('formát: miliarda', F(100000000000), '1 000 000 000 Kč');
  assertEq('formát: NaN', F(NaN), '—');
  assertEq('formát: se znaménkem', F(150000, { sign: true }), '+1 500 Kč');
  assertTrue('formát: nikde obyčejná mezera', !/[  ]/.test(F(123456789)));
  assertEq('formát: kódy znaků', Array.from(F(123400)).map(function (c) { return c.codePointAt(0); }),
    [0x31, 0xA0, 0x32, 0x33, 0x34, 0xA0, 0x4B, 0x10D]);

  // Kontrolní orákulum: kdyby ICU v budoucím iOS mezeru změnilo, tady to
  // uvidíme, ale naše ruční funkce zůstane správně.
  try {
    const icu = new Intl.NumberFormat('cs-CZ').format(1000);
    if (icu.charCodeAt(1) !== 0xA0) assertSkip('ICU pozor: oddělovač je jiný', icu.charCodeAt(1).toString(16));
    else assertTrue('ICU souhlasí s naším oddělovačem', true);
  } catch (e) { assertSkip('ICU nedostupné', String(e)); }

  assertEq('editace: 8000', E(800000), '8000');
  assertEq('editace: 389,5', E(38950), '389,5');
  assertEq('editace: 1234,56', E(123456), '1234,56');
  assertEq('editace: null', E(null), '');

  let rt = 0;
  for (let i = 0; i < 200; i++) {
    const n = Math.floor(Math.random() * 2e7) - 1e7;
    if (P(F(n, { decimals: 2 })).minor !== n) rt++;
  }
  assertEq('kolečko formát→parser (200×)', rt, 0);

  /* --- zaokrouhlení od nuly --- */
  assertEq('zaokr. 1,50 nahoru', roundMinor(150), 200);
  assertEq('zaokr. -1,50 dolů', roundMinor(-150), -200);
  let sym = 0;
  for (let i = 0; i < 200; i++) { const v = Math.floor(Math.random() * 1e6); if (roundMinor(-v) !== -roundMinor(v)) sym++; }
  assertEq('zaokr. symetrie (200×)', sym, 0);

  /* --- datumy --- */
  assertEq('měsíc 1. ledna 2026', monthKey(new Date(2026, 0, 1)), '2026-01');
  assertEq('měsíc 31. prosince', monthKey(new Date(2026, 11, 31)), '2026-12');
  assertEq('splatnost 31. v únoru', dueDateFor(2026, 1, 31), '2026-02-28');
  assertEq('splatnost 31. v přestupném únoru', dueDateFor(2028, 1, 31), '2028-02-29');
  assertEq('splatnost 31. v dubnu', dueDateFor(2026, 3, 31), '2026-04-30');
  assertEq('splatnost 31. v lednu', dueDateFor(2026, 0, 31), '2026-01-31');
  assertEq('letní čas 28.→30. 3.', daysBetween('2026-03-28', '2026-03-30'), 2);
  assertEq('přes Silvestra', daysBetween('2025-12-31', '2026-01-01'), 1);
  assertEq('měsíc +1 z prosince', addMonths(2026, 11, 1), { y: 2027, m: 0 });
  assertEq('měsíc -1 z ledna', addMonths(2026, 0, -1), { y: 2025, m: 11 });
  assertEq('31. 1. patří do ledna', isInMonth('2026-01-31', 2026, 0), true);
  assertEq('1. 2. nepatří do ledna', isInMonth('2026-02-01', 2026, 0), false);
  assertEq('datum genitiv', fmtDateLong('2026-01-05'), '5. ledna 2026');
  assertEq('řazení podle češtiny',
    ['Čaj', 'Cukr', 'Chleba', 'Hudba', 'Žena', 'Zima'].sort(cmpCs),
    ['Cukr', 'Čaj', 'Hudba', 'Chleba', 'Zima', 'Žena']);
  assertEq('CSV: vzorec se odzbrojí', escapeCsv('=1+1'), "'=1+1");
  assertEq('CSV: středník v uvozovkách', escapeCsv('a;b'), '"a;b"');
  assertEq('procenta 0/0', pct(0, 0), null);
  assertEq('procenta 500/0', pct(500, 0), null);

  /* --- výpočty nad skutečnými daty --- */
  if (typeof computeMonth === 'function' && state && state.years) {
    const y = state.activeYear;
    let invOk = true, sumOk = true;
    let yr = null;
    for (let m = 0; m < 12; m++) {
      const md = computeMonth(y, m);
      const out = md.fixed.act + md.daily.act + md.savings.act + md.debt.act + md.subs.act;
      // Přísná rovnost platí pro součet sekcí. Zobrazovaný zůstatek je o
      // nezařazené nákupy nižší — jinak by smazaná kategorie peníze schovala.
      if (md.income.act - out !== md.balanceSections) invOk = false;
      if (md.balance !== md.balanceSections - md.orphans.total) invOk = false;
      if (!Number.isSafeInteger(md.balance)) invOk = false;
    }
    assertTrue('bilance: příjmy − pět sekcí = zůstatek', invOk);
    try {
      yr = computeYear(y);
      let acc = 0;
      for (let m = 0; m < 12; m++) acc += computeMonth(y, m).balance;
      if (yr.balance !== acc) sumOk = false;
      assertTrue('rok = součet dvanácti měsíců', sumOk);
    } catch (e) { assertSkip('roční součet', String(e)); }

    // Peníze nesmí zmizet, když se smaže kategorie.
    if (typeof orphanTx === 'function' && typeof txByCat === 'function') {
      let leakOk = true;
      for (let m = 0; m < 12; m++) {
        let inBuckets = 0;
        txByCat(y, m).forEach(function (v) { inBuckets += v; });
        let orphans = 0;
        for (const t of orphanTx(y, m)) orphans += t.amt;
        let all = 0;
        for (const t of getYear().tx) if (!t.del && t.m === m) all += t.amt;
        if (inBuckets + orphans !== all) leakOk = false;
      }
      assertTrue('nákupy: koše + osiřelé = všechno', leakOk);
    } else assertSkip('kontrola osiřelých nákupů', 'není implementováno');
  } else assertSkip('výpočty nad daty', 'model ještě není načtený');

  /* --- chyby, které tu už jednou byly --- */
  if (typeof computeMonth === 'function' && typeof addCatalogItem === 'function') {
    // Pískoviště: vlastní rok, ať se nesahá na skutečná data.
    // Po celou dobu je vypnuté ukládání — debounce umí vystřelit synchronně
    // a na disku by pak zůstal rok 1900 se vším všudy.
    const zk = 1900;
    const puvodniRok = state.activeYear;
    const zaloha = (function () { try { return JSON.stringify(state); } catch (e) { return null; } })();
    saveSuspended = true;
    // Zásobník vracení se po kontrole zkrátí zpátky. Uzávěry ukazují na
    // pískovištní rok a jedno klepnutí na „Vrátit zpět" by ho vzkřísilo.
    const undoPred = (typeof undoPush === 'function' && undoPush.stack) ? undoPush.stack.length : null;
    try {
      state.years[String(zk)] = newYear(zk);
      state.activeYear = zk;
      const M = 0;
      const kPrijem = addCatalogItem({ sec: 'income', name: 'Zkouška příjem' }, 'all', zk);
      const kFix = addCatalogItem({ sec: 'fixed', name: 'Zkouška fixní' }, 'all', zk);
      const kDen = addCatalogItem({ sec: 'daily', name: 'Zkouška denní' }, 'all', zk);
      setActual(M, ensureEntry(M, kPrijem.id, zk).id, 3000000, zk);
      const eFix = ensureEntry(M, kFix.id, zk);
      setPlanned(M, eFix.id, 1000000, zk); setActual(M, eFix.id, 1000000, zk);
      const eDen = ensureEntry(M, kDen.id, zk);
      setPlanned(M, eDen.id, 500000, zk);
      addTx({ d: zk + '-01-05', m: M, cat: kDen.id, amt: 300000 }, zk);

      let md = computeMonth(zk, M);
      assertEq('tři čísla na obrazovce sedí', md.incomeTotal - md.outflow, md.balance);

      // Zaplaceno nesmí přepsat skutečnost dopočítanou z deníku.
      togglePaid(M, eDen.id, true, zk);
      assertEq('zaplaceno nepřepíše deník', getEntry(M, eDen.id, zk).act, null);

      // Smazání kategorie s ručně zadanou skutečností nesmí zvednout zůstatek.
      const pred = computeMonth(zk, M).balance;
      archiveCatalogItem(kFix.id, zk);
      assertEq('smazaná kategorie peníze neschová', computeMonth(zk, M).balance, pred);

      // Prázdný plán je „nezadáno", ne nula.
      setPlanned(M, eDen.id, null, zk);
      assertEq('prázdný plán je null', getEntry(M, eDen.id, zk).plan, null);

      // Smazání „v celém roce" nesmí přepsat měsíce, ve kterých už něco je.
      const kHist = addCatalogItem({ sec: 'fixed', name: 'Zkouška historie' }, 'all', zk);
      const e0 = ensureEntry(0, kHist.id, zk), e5 = ensureEntry(5, kHist.id, zk);
      setPlanned(0, e0.id, 100000, zk); setActual(0, e0.id, 100000, zk);
      setPlanned(5, e5.id, 100000, zk);
      const ledenPred = computeMonth(zk, 0).balance;
      removeEntry(5, e5.id, 'all', zk);
      assertEq('smazání nepřepíše hotový měsíc', computeMonth(zk, 0).balance, ledenPred);
      assertEq('smazaný měsíc opravdu zmizel', getEntry(5, e5.id, zk).del, true);

    } catch (e) {
      assertSkip('kontrola dřívějších chyb', String(e));
    } finally {
      // Úklid proběhne i při výjimce. Nejdřív se zkusí přesná obnova ze
      // zálohy, teprve když ta chybí, ruční návrat.
      try {
        if (zaloha) {
          const puv = JSON.parse(zaloha);
          for (const k of Object.keys(state)) delete state[k];
          Object.assign(state, puv);
        } else {
          state.activeYear = puvodniRok;
          delete state.years[String(zk)];
        }
      } catch (e2) {
        state.activeYear = puvodniRok;
        try { delete state.years[String(zk)]; } catch (e3) {}
      }
      if (undoPred !== null && undoPush.stack && undoPush.stack.length > undoPred) {
        undoPush.stack.length = undoPred;
      }
      saveSuspended = false;
      invalidateAll();
      assertEq('kontrola po sobě uklidila', !state.years[String(zk)] && state.activeYear === puvodniRok, true);
    }
  } else assertSkip('kontrola dřívějších chyb', 'model není načtený');

  /* --- grafy --- */
  if (typeof polar === 'function') {
    const p0 = polar(50, 50, 40, 0), p90 = polar(50, 50, 40, 90);
    assertEq('graf: 0° je nahoře', [Math.round(p0.x), Math.round(p0.y)], [50, 10]);
    assertEq('graf: 90° je vpravo', [Math.round(p90.x), Math.round(p90.y)], [90, 50]);
    assertEq('graf: prstenec 0 % není NaN', /NaN/.test(String(donutDash(0, 40))), false);
    assertEq('graf: osa z nuly', niceScale(0)[1] > 0, true);
    assertEq('graf: cíl 0/0 je pomlčka', progressPct(0, 0).label, '—');
    assertEq('graf: cíl x/0 je pomlčka', progressPct(500, 0).label, '—');
  } else assertSkip('matematika grafů', 'není načtená');

  /* --- kontrola stránky --- */
  assertEq('nikde input[type=number]', document.querySelectorAll('input[type="number"]').length, 0);
  assertEq('jazyk stránky', document.documentElement.lang, 'cs');
  const badWords = /\b(NaN|Infinity|\[object Object\])\b/;
  // Panel s výsledky obsahuje názvy vlastních testů, ve kterých slovo NaN
  // stojí schválně. Bez jeho vynechání by druhé spuštění hlásilo falešnou
  // chybu — kontrola musí být opakovatelná.
  const oldPanel = qs('#selftest');
  const puvodniZobrazeni = oldPanel ? oldPanel.style.display : null;
  if (oldPanel) oldPanel.style.display = 'none';
  const textStranky = document.body.innerText || '';
  if (oldPanel) oldPanel.style.display = puvodniZobrazeni || '';
  assertTrue('nikde NaN ani [object Object] v textu', !badWords.test(textStranky));
  const smallInputs = qsa('input, select, textarea').filter(function (i) {
    const fs = parseFloat(getComputedStyle(i).fontSize);
    return Number.isFinite(fs) && fs < 16;
  });
  assertEq('všechna pole mají aspoň 16 px', smallInputs.length, 0);

  renderSelfTest();
  return { pass: T_pass, fail: T_fail, skip: T_skip };
}

function renderSelfTest() {
  const wrap = el('div', { class: 'selftest', id: 'selftest' });
  const head = el('div', { class: 'selftest-head' });
  const okAll = T_fail === 0;
  head.appendChild(el('strong', { class: okAll ? 'st-pass' : 'st-fail' },
    (okAll ? 'PASS ' : 'FAIL ') + T_pass + '/' + (T_pass + T_fail) +
    (T_skip ? '  (' + T_skip + ' přeskočeno)' : '')));
  const copy = el('button', { class: 'btn btn-ghost' }, 'Kopírovat výsledek');
  copy.addEventListener('click', function () {
    const txt = T_rows.map(function (r) {
      return (r.skip ? 'SKIP ' : (r.ok ? 'ok   ' : 'FAIL ')) + r.name +
        (r.ok ? '' : '  got=' + JSON.stringify(r.got) + ' want=' + JSON.stringify(r.want));
    }).join('\n');
    const full = 'Rozpočet ' + APP_VERSION + '\n' + navigator.userAgent + '\n' +
      (okAll ? 'PASS ' : 'FAIL ') + T_pass + '/' + (T_pass + T_fail) + '\n\n' + txt;
    if (navigator.clipboard) navigator.clipboard.writeText(full);
    else { const ta = el('textarea'); ta.value = full; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    toast('Zkopírováno');
  });
  head.appendChild(copy);
  const close = el('button', { class: 'btn btn-ghost' }, 'Zavřít');
  close.addEventListener('click', function () { wrap.remove(); location.hash = ''; });
  head.appendChild(close);
  wrap.appendChild(head);

  const list = el('div', { class: 'selftest-list' });
  for (const r of T_rows) {
    const row = el('div', { class: 'st-row ' + (r.skip ? 'st-row-skip' : (r.ok ? 'st-row-ok' : 'st-row-fail')) });
    row.appendChild(el('span', { class: 'st-mark' }, r.skip ? '–' : (r.ok ? '✓' : '✕')));
    row.appendChild(el('span', { class: 'st-name' }, r.name));
    if (!r.ok || r.skip) {
      row.appendChild(el('span', { class: 'st-detail' },
        r.skip ? String(r.got) : ('dostal ' + JSON.stringify(r.got) + ', čekal ' + JSON.stringify(r.want))));
    }
    list.appendChild(row);
  }
  wrap.appendChild(list);
  const old = qs('#selftest');
  if (old) old.remove();
  document.body.appendChild(wrap);
}

// 80-boot.js — start aplikace, motiv, instalace na plochu, ukázková data — vlastní: L0

/* ---------- pojistka proti bílé stránce ---------- */

function installErrorHandler() {
  let shown = false;
  function fail(msg) {
    if (shown) return;
    shown = true;
    try { flushSave(); } catch (e) {}
    const host = qs('#banner-host') || document.body;
    const b = el('div', { class: 'banner banner-error', role: 'alert' });
    b.appendChild(el('span', { class: 'banner-ico' }, '⚠️'));
    const t = el('span', { class: 'banner-text' });
    t.appendChild(el('span', { class: 'banner-title' }, 'Něco se pokazilo'));
    t.appendChild(el('span', { class: 'banner-body' },
      'Tvoje data jsou v pořádku uložená. Zkus aplikaci zavřít a otevřít znovu. ' +
      'Když to nepomůže, stáhni si zálohu v Nastavení.'));
    b.appendChild(t);
    const btn = el('button', { class: 'banner-action', 'data-act': 'io.export' }, 'Stáhnout zálohu');
    b.appendChild(btn);
    host.appendChild(b);
    console.error(msg);
  }
  window.addEventListener('error', function (e) { fail(e.message || e); });
  window.addEventListener('unhandledrejection', function (e) { fail(e.reason); });
}

/* ---------- úložiště ---------- */

function guardStorage() {
  let probe = { ok: false, reason: 'neznámé' };
  try { probe = storageProbe(); } catch (e) { probe = { ok: false, reason: String(e && e.name || e) }; }
  if (probe.ok) return true;

  // Nepředstírat, že se ukládá. Tohle je přesně ten způsob, jak se ztratí rok práce.
  const fromFile = location.protocol === 'file:';
  sheetBanner({
    id: 'storage-dead', kind: 'error', icon: '⚠️',
    title: TXT.storageDeadTitle,
    body: fromFile
      ? 'Otevřela jsi soubor z disku. Safari z tohohle místa neumí nic uložit. Otevři aplikaci přes její webovou adresu nebo z ikony na ploše.'
      : TXT.storageDeadBody,
  });
  return false;
}

/* ---------- motiv ---------- */

function applyTheme() {
  const t = (state && state.settings && state.settings.theme) || 'auto';
  const root = document.documentElement;
  if (t === 'auto') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', t);
}

function watchScheme() {
  if (!window.matchMedia) return;
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const h = function () { if (!state.settings || state.settings.theme === 'auto') applyTheme(); };
  if (mq.addEventListener) mq.addEventListener('change', h);
  else if (mq.addListener) mq.addListener(h);
}

/* ---------- instalace na plochu ----------
   Safari maže všechna data webu po 7 dnech nepoužívání. Jediná výjimka,
   kterou WebKit sám dokumentuje, je stránka přidaná na plochu. Proto to
   není kosmetika a proto na to appka upozorňuje, dokud se to nestane. */

function detectStandalone() {
  const mm = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
  return !!(mm || window.navigator.standalone);
}

function isApple() {
  const ua = navigator.userAgent || '';
  return /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
}

function maybeInstallNag() {
  if (detectStandalone()) { sheetBannerClear('install'); return; }
  if (location.protocol === 'file:') return;
  const d = state.settings.installNagDismissedAt;
  if (d && daysBetween(d, todayISO()) !== null && daysBetween(d, todayISO()) < 3) return;
  sheetBanner({
    id: 'install', kind: 'accent', icon: '📲', dismissible: true,
    title: TXT.notInstalledTitle,
    body: isApple()
      ? TXT.notInstalledBody
      : 'Přidej si aplikaci na plochu, ať ji máš po ruce a prohlížeč ti data nesmaže.',
    action: 'Jak na to', act: 'install.how',
  });
}

// Připomínka zálohy. Musí být vidět na hlavní obrazovce, ne schovaná
// v nastavení — jinak ji uvidí právě ten, kdo zálohy už řeší.
function maybeBackupNag() {
  const last = state.settings.lastExportAt;
  const dnu = last ? daysBetween(String(last).slice(0, 10), todayISO()) : null;
  const prazdna = (function () {
    try { const y = getYear(); return !y || (y.catalog.length === 0 && y.tx.length === 0); }
    catch (e) { return true; }
  })();
  if (prazdna) return;                       // není co zálohovat
  if (dnu !== null && dnu < 21) return;
  sheetBanner({
    id: 'backup', kind: 'warn', icon: '🛟', dismissible: true,
    title: last ? 'Zálohu sis dělala naposledy před ' + dnu + ' dny' : 'Ještě nemáš zálohu',
    body: 'Prohlížeč umí data smazat sám. Stažený soubor je jediná kopie, kterou máš plně pod kontrolou.',
    action: TXT.backup, act: 'io.export',
  });
}

// Hlásí, že se přestalo ukládat. Pruh je trvalý a nedá se odklepnout —
// je to nejdůležitější informace, jakou appka může mít.
// Zápis se zase povedl. Pruh o chybě musí pryč; když se to podařilo až
// po úklidu místa, řekne se to jednou nahlas.
function saveRecovered(poUklidu) {
  sheetBannerClear('save');
  if (poUklidu && Date.now() - (saveRecovered.last || 0) > 60000) {
    saveRecovered.last = Date.now();
    toast('Došlo místo, tak jsem uklidila staré kopie. Uložilo se to. Stáhni si zálohu.', { ms: 8000 });
  }
}

function saveProblemNotify(st) {
  const teksty = {
    quota: ['Došlo místo', 'Prohlížeč odmítl uložit další data. Stáhni si zálohu, ať o nic nepřijdeš, a smaž staré měsíce nebo ukázková data.'],
    write: ['Data se neukládají', 'Zápis do prohlížeče selhal. Stáhni si zálohu a zkus aplikaci zavřít a otevřít znovu.'],
    locked: ['Ukládání je pozastavené', 'Poškozená data leží stranou. Načti zálohu, nebo data vymaž — teprve pak se zase ukládá.'],
    invalid: ['V datech je chyba', 'Něco v datech neodpovídá očekávanému tvaru, tak se radši neuložila. Stáhni si zálohu.'],
    stringify: ['Data nejdou uložit', 'Nepodařilo se z nich udělat zápis. Stáhni si zálohu.'],
    nostate: ['Aplikace nemá data', 'Zkus ji zavřít a otevřít znovu.'],
  };
  const t = teksty[st && st.reason] || ['Data se neukládají', 'Stáhni si zálohu, ať o nic nepřijdeš.'];
  sheetBannerClear('save');
  sheetBanner({ id: 'save', kind: 'error', icon: '⚠️', title: t[0], body: t[1],
    action: TXT.backup, act: 'io.export' });
  const now = Date.now();
  // Čas posledního upozornění visí na funkci, ne na proměnné vedle ní:
  // funkce se hoistuje, `let` ne, a volající by ji trefil v mrtvé zóně.
  if (now - (saveProblemNotify.last || 0) > 20000) {
    saveProblemNotify.last = now;
    toast(t[0] + ' — stáhni si zálohu.', { ms: 8000 });
  }
}

function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol === 'file:') return;
  // Relativní cesta, aby fungoval i podadresář na GitHub Pages.
  navigator.serviceWorker.register('./sw.js').catch(function (e) {
    console.warn('service worker se nepodařilo zaregistrovat:', e && e.message);
  });
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(function () {});
  }
}

/* ---------- první spuštění ----------
   Aplikace startuje ÚPLNĚ prázdná. Kategorie se zakládají jedině tehdy,
   když si to uživatelka na uvítací obrazovce sama vybere. */

function firstRunSeed() {
  const y = getYear();
  if (!y) return;
  if (y.catalog.length > 0) return;
  if (state.settings.welcomeDone) return;

  openSheet({
    title: 'Vítej v Rozpočtu',
    autofocus: false,
    build: function (body) {
      body.appendChild(el('p', { class: 'sheet-text' },
        'Můžeš začít s doporučenými kategoriemi a jen si je upravit, nebo úplně od nuly.'));
      body.appendChild(el('p', { class: 'sheet-text sheet-text-dim' },
        'Částky budou v obou případech prázdné. Kategorie si můžeš kdykoliv přejmenovat, přidat i smazat.'));
    },
    foot: [
      { label: 'Začít od nuly', kind: 'ghost', value: 'empty' },
      { label: 'Doporučené kategorie', kind: 'primary', value: 'seed' },
    ],
  }).then(function (choice) {
    setSetting('welcomeDone', true);
    if (choice === 'seed') {
      for (const def of DEFAULT_CATALOG) {
        addCatalogItem({ sec: def.sec, name: def.name, icon: def.icon, dueDay: def.dueDay || null }, 'all');
      }
      toast('Kategorie jsou připravené. Doplň si k nim částky.');
    }
    invalidateAll();
    renderApp();
  });
}

/* ---------- ukázková data ----------
   Čistá funkce s jediným volacím místem: tlačítko v Nastavení.
   Nikde v inicializaci, nikde jako výchozí hodnota. */

function makeDemoData(seed) {
  let s = (seed || 42) >>> 0;
  const rnd = function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  const pick = function (a) { return a[Math.floor(rnd() * a.length)]; };
  const around = function (base, spread) {
    return roundMinor(Math.round(base * 100 * (1 + (rnd() - 0.5) * spread)), 100);
  };

  const y = state.activeYear;
  const plan = [
    ['income', 'Výplata', '💰', 3800000, null],
    ['income', 'Brigáda', '💵', 450000, null],
    ['fixed', 'Nájem', '🏠', 1450000, 15],
    ['fixed', 'Zálohy (voda, elektřina)', '⚡', 320000, 20],
    ['fixed', 'Internet', '🌐', 45000, 18],
    ['fixed', 'Telefon', '📱', 39900, 12],
    ['daily', 'Jídlo a potraviny', '🛒', 800000, null],
    ['daily', 'Restaurace a kafe', '☕', 180000, null],
    ['daily', 'Drogerie', '🧴', 90000, null],
    ['daily', 'Doprava', '🚌', 55000, null],
    ['savings', 'Nouzová rezerva', '🛟', 300000, null],
    ['savings', 'Dovolená', '✈️', 200000, null],
    ['debt', 'Půjčka', '🏦', 480000, 5],
    ['subs', 'Netflix', '🎬', 27900, 12],
    ['subs', 'Spotify', '🎵', 19900, 3],
  ];
  const ids = {};
  for (const p of plan) {
    const cat = addCatalogItem({ sec: p[0], name: p[1], icon: p[2], dueDay: p[4] }, 'all');
    ids[p[1]] = cat.id;
    for (let m = 0; m < 12; m++) {
      const en = ensureEntry(m, cat.id);
      setPlanned(m, en.id, p[3]);
      if (m <= state.ui.month && p[0] !== 'daily') {
        setActual(m, en.id, around(p[3] / 100, 0.06));
        if (p[4]) togglePaid(m, en.id, true);
      }
    }
  }
  setGoal(ids['Dovolená'], { target: 4500000, startBalance: 0, targetDate: y + '-08-31' });
  setGoal(ids['Nouzová rezerva'], { target: 10000000, startBalance: 2400000, targetDate: y + '-12-31' });

  const shops = ['Albert', 'Lidl', 'Rohlík', 'Kaufland', 'Billa', 'Penny', 'Globus'];
  const cafes = ['kafe', 'oběd', 'snídaně s Terkou', 'rozvoz'];
  const dailyIds = [ids['Jídlo a potraviny'], ids['Restaurace a kafe'], ids['Drogerie'], ids['Doprava']];
  for (let m = 0; m <= state.ui.month; m++) {
    const n = 18 + Math.floor(rnd() * 14);
    for (let i = 0; i < n; i++) {
      const day = 1 + Math.floor(rnd() * daysInMonth(y, m));
      const cat = pick(dailyIds);
      addTx({
        d: y + '-' + (m + 1 < 10 ? '0' : '') + (m + 1) + '-' + (day < 10 ? '0' : '') + day,
        m: m, cat: cat,
        amt: cat === ids['Jídlo a potraviny'] ? around(420, 0.9) : around(180, 1.2),
        note: cat === ids['Jídlo a potraviny'] ? pick(shops) : pick(cafes),
      });
    }
  }
  state.isDemo = true;
  bump(state);
  invalidateAll();
}

/* ---------- start ---------- */

function boot() {
  installErrorHandler();
  // Jazyk stránky nastavujeme i z kódu — appka může běžet vloženě v cizí
  // stránce, kde <html lang> není náš.
  try { document.documentElement.lang = 'cs'; } catch (e) {}

  const storageOk = (function () {
    try { return storageProbe().ok; } catch (e) { return false; }
  })();

  let load = null;
  try { load = loadState(); } catch (e) { console.error('loadState selhal', e); }

  // loadState() si `state` nastaví sám a vrací jen zprávu o tom, odkud data
  // přišla. Kdyby cokoliv selhalo, ať appka naběhne prázdná místo bílé stránky.
  if (!state || !state.app) {
    try { state = emptyDoc(); } catch (e) { console.error('emptyDoc selhal', e); }
  }
  if (!state.ui) state.ui = { screen: 'month', month: new Date().getMonth(), yearTab: 'summary', journalFilter: 'all' };
  if (!state.settings) state.settings = {};

  guardStorage();
  applyTheme();
  watchScheme();
  bindGlobalEvents();

  // Poškozená data: loadState je odloží stranou a naběhne ze zálohy nebo
  // ze snapshotu. Uživatelka se to musí dozvědět, ne to jen tak přejít.
  if (load && load.quarantineKey) {
    const src = load.source === 'backup' ? 'Aplikace naběhla ze zálohy.'
      : load.source === 'snapshot' ? 'Aplikace naběhla z poslední uložené verze.'
      : 'Aplikace musela začít prázdná.';
    sheetBanner({ id: 'corrupt', kind: 'warn', icon: '🛟',
      title: TXT.corruptTitle,
      body: TXT.corruptBody + ' ' + src
        + ' Původní soubor si můžeš stáhnout tlačítkem níž a poslat mi ho.',
      action: 'Stáhnout poškozený soubor', act: 'io.rescue' });
  }
  if (load && load.source === 'newer') {
    sheetBanner({ id: 'newer', kind: 'error', icon: '⏭️',
      title: 'Data jsou z novější verze aplikace',
      body: 'Nic se nepřepsalo a leží to odložené stranou. Otevři aplikaci na '
        + 'aktuální adrese, nebo si data stáhni a pošli mi je.',
      action: 'Stáhnout data', act: 'io.rescue' });
  }
  if (state.isDemo) {
    // Existuje-li snímek stavu před ukázkou, nabídne se návrat i po
    // restartu. Bez toho zbylo po zavření appky jediné tlačítko: Vymazat.
    let lzeVratit = false;
    try {
      lzeVratit = (typeof snapshotList === 'function') &&
        snapshotList().some(function (x) { return x && x.ok && x.reason === 'pred-ukazkou'; });
    } catch (e) { lzeVratit = false; }
    sheetBanner({ id: 'demo', kind: 'warn', icon: '🧪',
      title: TXT.demoBanner,
      body: lzeVratit
        ? 'Tvoje původní data leží stranou — vrátíš je jedním klepnutím.'
        : 'Až si to prohlédneš, vymaž je a začni s vlastními čísly.',
      action: lzeVratit ? 'Vrátit moje data' : TXT.demoWipe,
      act: lzeVratit ? 'demo.undo' : 'demo.wipe' });
  }

  goScreen(state.ui && state.ui.screen ? state.ui.screen : 'month');
  maybeInstallNag();
  maybeBackupNag();
  registerSW();
  firstRunSeed();

  // Testovací šev. Osobní appka, žádná bezpečnostní hranice.
  window.__APP__ = {
    state: function () { return state; },
    parseCzkInput: parseCzkInput, formatCzk: formatCzk, fmtEdit: fmtEdit,
    monthKey: monthKey, dueDateFor: dueDateFor, daysBetween: daysBetween,
    computeMonth: computeMonth, computeYear: computeYear, computeDue: computeDue,
    emptyDoc: emptyDoc, makeDemoData: makeDemoData,
    render: renderApp, patch: patchNow, save: flushSave, saveNow: saveNow,
    selfTest: function () { return typeof selfTest === 'function' ? selfTest() : null; },
    storageOk: storageOk, version: APP_VERSION,
  };

  window.__rozpocetBooted = true;
  if (location.hash === '#test' && typeof selfTest === 'function') selfTest();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
