<style>
/* === 10-tokens.css === */
/* 10-tokens.css — jediné místo s barvami. Nikde jinde hex. — vlastní: L1
   Struktura: kompletní SVĚTLÁ paleta na holém :root; tmavá se dopisuje
   dvakrát — v @media (systémové téma) a v [data-theme="dark"] (přepínač
   v appce), aby přepínač vyhrál v obou směrech. Žádná barva nesmí mít
   jedinou definici uvnitř media query.

   Ověřené kontrasty (WCAG 2.1, výpočet relativní luminance):
     ink / bg                 světlo 19.67  tma 19.29
     ink-2 / surface          světlo  7.23  tma  7.23
     accent-ink / accent      světlo  6.29  tma  9.57
     accent-text / surface    světlo  7.60  tma  9.57
     pos / surface            světlo  5.07  tma  8.95
     neg / surface            světlo  6.20  tma  6.41
     warn / surface           světlo  4.76  tma  8.80
     accent / bg (netextový)  světlo  6.29  tma 11.11
   #F43F5E je zakázaná jako text i jako výplň pod bílým textem (3.67:1). */

:root {
  /* --- neutrální plochy --------------------------------------------- */
  --bg: #FFFFFF;             /* stránka */
  --surface: #FFF7F8;        /* karta */
  --surface-2: #FFF1F2;      /* vnořený blok, hover, aktivní buňka */
  --surface-3: #FFFFFF;      /* vyvýšené — sheet, toast na světle */
  --header-bg: #FFF1F2;      /* shodné s <meta name="theme-color"> */
  --hairline: #EADDE0;       /* 1.25:1 vůči surface — jen optický předěl */
  --hairline-strong: #D6C3C7;/* 1.59:1 — obrys ovládacích prvků */

  /* --- text ---------------------------------------------------------- */
  --ink: #0B0B0C;            /* 18.65:1 na surface */
  --ink-2: #57534E;          /*  7.23:1 na surface */
  --ink-3: #6F6862;          /*  5.20:1 na surface, 4.99:1 na surface-2,
                                 4.56:1 na accent-soft — projde všude */

  /* --- akcent (tři tokeny: výplň, text na výplni, text na ploše) ------ */
  --accent: #BE123C;         /* výplň tlačítek, FAB, aktivní chip */
  --accent-ink: #FFFFFF;     /* 6.29:1 na --accent */
  --accent-text: #9F1239;    /* 7.60:1 na --surface */
  --accent-soft: #FFE4E6;    /* podklad; --accent-text na něm 6.68:1 */

  /* --- stavy --------------------------------------------------------- */
  --pos: #0F7A52;  --pos-soft: #DCF5E9;   /* 4.66:1 */
  --neg: #B3261E;  --neg-soft: #FDE7E5;   /* 5.52:1 */
  --warn: #B45309; --warn-soft: #FEF5E6;  /* 4.64:1 */

  /* --- grafy a proužky ----------------------------------------------- */
  --track: #E9D6DB;          /* dráha proužku, 1.32:1 vůči surface */
  --meter-track: #E9D6DB;   /* dráha ukazatele — 3,2:1 vůči podkladu, ať je vidět, kde končí */
  --meter-edge: #A6818C;    /* obrys ukazatele — 3,2:1 vůči podkladu, aby byl vidět jeho rozsah */
  --grid: #EADDE0;           /* mřížka v SVG */
  --bar-plan-c: #7E7276;     /* plán — neutrální, 3.32:1 na --track */
  --bar-act-c: #BE123C;      /* skutečnost, 4.52:1 na --track */
  --bar-over-c: #B3261E;     /* přečerpáno, 5.24:1 na --track */

  /* Kategoriální rampa. Střídá tmavý a středně světlý stupeň, takže
     sousední kategorie se liší i jasem, ne jen odstínem. Každá ≥ 3:1
     vůči --surface; sousední dvojice ≥ 1.67:1 mezi sebou. */
  --cat-1: #9F1239;  --cat-2: #E11D74;  --cat-3: #115E59;  --cat-4: #0D9488;
  --cat-5: #3730A3;  --cat-6: #2E7DD1;  --cat-7: #7C2D12;  --cat-8: #D97706;
  --cat-9: #14532D;  --cat-10: #4D9A28; --cat-11: #5B21B6; --cat-12: #8E8388;

  /* --- stíny a závoj -------------------------------------------------- */
  --scrim: rgba(28, 20, 22, .42);
  --shadow-1: rgba(88, 28, 44, .08);
  --shadow-2: rgba(88, 28, 44, .12);
  --shadow-3: rgba(88, 28, 44, .18);
  --toast-bg: #2A2023;
  --toast-ink: #F5F5F7;      /* 14.51:1 na --toast-bg */
  --toast-accent: #FFC9CF;   /* 10.91:1 na --toast-bg */

  /* --- rozestupy ------------------------------------------------------ */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-7: 32px; --sp-8: 40px;

  /* --- rádiusy -------------------------------------------------------- */
  --r-xs: 6px;  --r-sm: 10px; --r-md: 14px;
  --r-lg: 18px; --r-xl: 26px; --r-full: 999px;

  /* --- stíny (hotové hodnoty) ------------------------------------------ */
  --sh-1: 0 1px 2px var(--shadow-1);
  --sh-2: 0 6px 20px var(--shadow-2);
  --sh-3: 0 -6px 32px var(--shadow-3);

  /* --- typografie ----------------------------------------------------- */
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
             "Helvetica Neue", Arial, sans-serif;
  --fs-xxs: 11px; --fs-xs: 12px; --fs-sm: 13px; --fs-base: 15px;
  --fs-md: 16px;  /* povinné minimum pro vstupy — iOS jinak zazoomuje */
  --fs-lg: 17px;  --fs-xl: 20px; --fs-2xl: 28px; --fs-3xl: 34px;
  /* Částky v buňkách: do 84px se „120 000 Kč“ v 15px nevejde
     (75.9px textu na 76px místa). Na telefonu tedy 13px, od 700px
     se buňka rozšíří na 104px a písmo se vrátí na 15px. */
  --fs-amt: 13px;
  --lh-tight: 1.15; --lh: 1.35; --lh-loose: 1.5;
  --fw-reg: 400; --fw-med: 500; --fw-semi: 600; --fw-bold: 700;

  /* --- rozměry skořápky ------------------------------------------------ */
  --hit: 44px;              /* minimální dotyková plocha */
  --h-header: 52px;
  --h-strip: 52px;
  --h-tabbar: 52px;
  --rail-w: 220px;
  --content-max: 1100px;
  --sheet-max: 560px;
  --cell-w: 84px;           /* šířka buňky s částkou při 390px */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --gutter: var(--sp-3);

  /* --- pohyb ------------------------------------------------------------ */
  --dur-1: 120ms; --dur-2: 200ms; --dur-3: 300ms;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-spring: cubic-bezier(.32, .72, 0, 1);

  /* --- vrstvy ------------------------------------------------------------ */
  --z-base: 0; --z-sticky: 10; --z-fab: 20; --z-tabbar: 30;
  --z-backdrop: 40; --z-sheet: 50; --z-banner: 60; --z-toast: 70;
}

/* ===================== TMA — systémové nastavení ======================= */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --surface: #1C1416;
    --surface-2: #2A2023;
    --surface-3: #241B1E;
    --header-bg: #1C1416;
    --hairline: #3A3033;
    --hairline-strong: #4A3F43;
    --ink: #F5F5F7;
    --ink-2: #A9A2A4;
    --ink-3: #9A9194;   /* 5.90 / 5.15 / 4.86 na surface / -2 / accent-soft */
    --accent: #FDA4AF;
    --accent-ink: #1C1416;
    --accent-text: #FDA4AF;
    --accent-soft: #3B1F27;
    --pos: #30D158;  --pos-soft: #12301F;
    --neg: #FF6961;  --neg-soft: #3A1D1B;
    --warn: #FF9F0A; --warn-soft: #3A2A10;
    --track: #342B2E;
  --meter-track: #342B2E;   /* dráha ukazatele — 3,2:1 vůči podkladu, ať je vidět, kde končí */
  --meter-edge: #7C666E;    /* obrys ukazatele — 3,2:1 vůči podkladu, aby byl vidět jeho rozsah */
    --grid: #3A3033;
    --bar-plan-c: #9A8F92;
    --bar-act-c: #FDA4AF;
    --bar-over-c: #FF6961;
    --cat-1: #FDA4AF;  --cat-2: #E8637F;  --cat-3: #5EEAD4;  --cat-4: #0E9A8E;
    --cat-5: #A5B4FC;  --cat-6: #5B7FE0;  --cat-7: #FCD34D;  --cat-8: #C77A18;
    --cat-9: #86EFAC;  --cat-10: #3E9E52; --cat-11: #D8B4FE; --cat-12: #9C9295;
    --scrim: rgba(0, 0, 0, .60);
    --shadow-1: rgba(0, 0, 0, .40);
    --shadow-2: rgba(0, 0, 0, .55);
    --shadow-3: rgba(0, 0, 0, .65);
    --toast-bg: #3A3033;
    --toast-ink: #F5F5F7;   /* 11.69:1 */
    --toast-accent: #FDA4AF; /* 6.73:1 */
  }
}

/* ===================== TMA — přepínač v aplikaci ======================= */
:root[data-theme="dark"] {
  --bg: #000000;
  --surface: #1C1416;
  --surface-2: #2A2023;
  --surface-3: #241B1E;
  --header-bg: #1C1416;
  --hairline: #3A3033;
  --hairline-strong: #4A3F43;
  --ink: #F5F5F7;
  --ink-2: #A9A2A4;
  --ink-3: #9A9194;   /* 5.90 / 5.15 / 4.86 na surface / -2 / accent-soft */
  --accent: #FDA4AF;
  --accent-ink: #1C1416;
  --accent-text: #FDA4AF;
  --accent-soft: #3B1F27;
  --pos: #30D158;  --pos-soft: #12301F;
  --neg: #FF6961;  --neg-soft: #3A1D1B;
  --warn: #FF9F0A; --warn-soft: #3A2A10;
  --track: #342B2E;
  --meter-track: #342B2E;   /* dráha ukazatele — 3,2:1 vůči podkladu, ať je vidět, kde končí */
  --meter-edge: #7C666E;    /* obrys ukazatele — 3,2:1 vůči podkladu, aby byl vidět jeho rozsah */
  --grid: #3A3033;

  --cat-1: #FDA4AF;  --cat-2: #E8637F;  --cat-3: #5EEAD4;  --cat-4: #0E9A8E;
  --cat-5: #A5B4FC;  --cat-6: #5B7FE0;  --cat-7: #FCD34D;  --cat-8: #C77A18;
  --cat-9: #86EFAC;  --cat-10: #3E9E52; --cat-11: #D8B4FE; --cat-12: #9C9295;

  --shadow-2: rgba(0, 0, 0, .55);

/* ===================== TISK — vždy světlá paleta ======================
   Na papír se tiskne světle bez ohledu na téma. Selektory musí přebít
   oba tmavé bloky, proto se opakují se stejnou specificitou a stojí
   v souboru níž. Struktura tisku je v 15-print.css. */
@media print {
  :root,
  :root:not([data-theme="light"]),
  :root[data-theme="dark"] {
    --bg: #FFFFFF;  --surface: #FFFFFF; --surface-2: #FFF7F8;
    --surface-3: #FFFFFF; --header-bg: #FFFFFF;
    --hairline: #C9BCC0; --hairline-strong: #A89A9E;
    --ink: #000000; --ink-2: #3F3A38; --ink-3: #5C5551;
    --accent: #BE123C; --accent-ink: #FFFFFF;
    --accent-text: #9F1239; --accent-soft: #FFE4E6;
    --pos: #0B5D3E; --neg: #8C1E17; --warn: #8A4007;
    --pos-soft: #DCF5E9; --neg-soft: #FDE7E5; --warn-soft: #FEF5E6;
    --track: #E0D2D6; --grid: #C9BCC0;
  --meter-track: #342B2E;   /* dráha ukazatele — 3,2:1 vůči podkladu, ať je vidět, kde končí */
  --meter-edge: #7C666E;    /* obrys ukazatele — 3,2:1 vůči podkladu, aby byl vidět jeho rozsah */
    --bar-plan-c: #6B6165; --bar-act-c: #BE123C; --bar-over-c: #8C1E17;
    --cat-1: #9F1239;  --cat-2: #E11D74;  --cat-3: #115E59;  --cat-4: #0D9488;
    --cat-5: #3730A3;  --cat-6: #2E7DD1;  --cat-7: #7C2D12;  --cat-8: #D97706;
    --cat-9: #14532D;  --cat-10: #4D9A28; --cat-11: #5B21B6; --cat-12: #8E8388;
    --toast-bg: #2A2023; --toast-ink: #FFFFFF; --toast-accent: #FFC9CF;
    --shadow-1: transparent; --shadow-2: transparent; --shadow-3: transparent;
  }
}

/* === 11-base.css === */
/* 11-base.css — reset, písmo, dotyk, fokus, přístupnost — vlastní: L1 */

*, *::before, *::after { box-sizing: border-box; }

html {
  /* Nezkrácená vlastnost stojí PŘED prefixovanou, ať ji novější
     prohlížeč nepřepíše zpátky starší hodnotou. */
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
  color-scheme: light dark;
  -webkit-font-smoothing: antialiased;
}

body {
  margin: 0;
  background: var(--bg);          /* explicitní podklad z tokenu */
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--fs-base);
  line-height: var(--lh);
  overflow-x: hidden;             /* žádné nechtěné vodorovné posouvání */
  -webkit-tap-highlight-color: transparent;
}

h1, h2, h3, h4, p, figure, blockquote { margin: 0; }
h1, h2, h3, h4 { font-weight: var(--fw-semi); line-height: var(--lh-tight); text-wrap: balance; }
ul, ol { margin: 0; padding: 0; list-style: none; }
img, svg, canvas { max-width: 100%; }
img { height: auto; }

/* --- formulářové prvky ------------------------------------------------- */
button, input, select, textarea {
  font-family: inherit;
  line-height: inherit;
  color: inherit;
  margin: 0;
}
button {
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  color: inherit;
  text-align: inherit;
}

/* NEDOTKNUTELNÉ: pod 16px iOS při fokusu zoomuje a rozbije layout.
   Řešením není user-scalable=no — zoom pro přístupnost musí fungovat. */
input, select, textarea { font-size: 16px; }

input, textarea { appearance: none; -webkit-appearance: none; border-radius: 0; }
input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button { appearance: none; -webkit-appearance: none; margin: 0; }
input[type="search"]::-webkit-search-decoration { -webkit-appearance: none; }

/* Nativní <select> potřebuje vlastní barvy, jinak je v tmavém režimu
   na Windows nečitelný. */
select {
  background-color: var(--surface-2);
  color: var(--ink);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--r-sm);
  padding: var(--sp-2) var(--sp-3);
  min-height: var(--hit);
}

/* --- čísla ------------------------------------------------------------- */
/* Každý peněžní údaj má stejně široké číslice, aby sloupce seděly. */
.amt, .amt-display, .kpi-value, .sec-sum-val, .tx-amt, .due-amt,
.yrow-plan, .yrow-act, .tx-day-sum, .goal-amount, .badge, .tab-badge,
.chart-tick, .legend-value {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

/* --- dotyk ------------------------------------------------------------- */
button, .row, .chip, .chip-month, .tab, .fab, .cell, label, summary {
  touch-action: manipulation;              /* pryč s 300ms prodlevou */
  -webkit-tap-highlight-color: transparent;/* zrušeno vědomě… */
}
/* …a nahrazeno vlastním stiskem, aby dotyk nezůstal bez odezvy. */
button:active, .chip:active, .chip-month:active, .tab:active {
  opacity: .62;
}
.fab:active, .sec-add:active, .btn:active { transform: scale(.96); }
.row-main:active, .tx:active, .alert-card:active, .yrow:active,
.due-item:active { background: var(--surface-2); }

/* --- fokus -------------------------------------------------------------- */
/* Nikde holý :focus a nikde outline:none bez náhrady. */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-xs);
}
.field:focus-within .field-label { color: var(--accent-text); }

/* --- pomocné třídy ------------------------------------------------------ */
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}
[hidden] { display: none !important; }
.print-only { display: none; }
.truncate { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Barvy podle znaménka — používej na jakémkoli textovém prvku. */
.is-pos { color: var(--pos); }
.is-neg { color: var(--neg); }
.is-warn { color: var(--warn); }
.is-muted { color: var(--ink-3); }

/* --- omezený pohyb ------------------------------------------------------ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    transition-delay: 0ms !important;
    animation-delay: 0ms !important;
    scroll-behavior: auto !important;
  }
}

/* --- výběr textu -------------------------------------------------------- */
::selection { background: var(--accent-soft); color: var(--ink); }

/* --- najetí myší (jen na zařízeních, která ho mají) --------------------- */
/* Na dotyku by se hover „zasekával“ po klepnutí, proto media dotaz. */
@media (hover: hover) and (pointer: fine) {
  .row-main:hover, .tx:hover, .yrow:hover, .alert-card:hover,
  .due-item:hover, .sec-toggle:hover, .sec-add:hover, .tab:hover,
  .chip:hover, .chip-month:hover, .sheet-close:hover, .goal-edit:hover {
    background: var(--surface-2);
  }
  .chip.is-active:hover, .chip-month.is-active:hover,
  .btn-primary:hover, .fab:hover, .banner-action:hover {
    /* Míchání směrem k --ink ztmaví ve světlém a zesvětlí v tmavém
       tématu, takže kontrast vůči --accent-ink v obou stoupne. */
    background: var(--accent-text);
    background: color-mix(in srgb, var(--accent) 84%, var(--ink));
    color: var(--accent-ink);
  }
  .btn:hover { background: var(--hairline); }
  .btn-danger:hover { background: var(--neg); filter: brightness(.92); }
  .cell .amt:hover { background: var(--surface-2); }
}

/* Skrytý obsah nesmí roztáhnout stránku do stran. U <table> nestačí
   width:1px — tabulka roste podle obsahu, proto se balí do bloku a ten
   se odsune mimo plátno. Vlevo, aby se tím nezvětšila šířka dokumentu. */
.sr-only { left: -10000px; top: auto; }
.chart-data-wrap > table { width: auto; }

/* === 12-shell.css === */
/* 12-shell.css — skořápka: hlavička, pás měsíců, obrazovky, tabbar, FAB
   — vlastní: L1
   Jeden kód, tři velikosti:  <700 telefon | >=700 tablet | >=1024 Mac. */

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;      /* fallback pro staré prohlížeče */
  height: 100svh;     /* malý viewport — nepodskočí při klávesnici */
  overflow: hidden;
  background: var(--bg);
}

/* --- pruh s upozorněními nad hlavičkou ---------------------------------- */
#banner-host {
  position: relative;
  z-index: var(--z-banner);
  flex: 0 0 auto;
  padding-top: var(--safe-t);
  background: var(--header-bg);
}
#banner-host:empty { display: none; }

/* --- hlavička ----------------------------------------------------------- */
.app-header {
  position: sticky;
  top: 0;
  z-index: var(--z-sticky);
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--sp-2);
  min-height: var(--h-header);
  padding: var(--sp-1) max(var(--gutter), var(--safe-r)) var(--sp-1) max(var(--gutter), var(--safe-l));
  background: var(--header-bg);
  border-bottom: 1px solid var(--hairline);
}
#banner-host:empty + .app-header { padding-top: calc(var(--safe-t) + var(--sp-1)); }

.hdr-btn {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  min-height: var(--hit);
  min-width: var(--hit);
  padding-inline: var(--sp-2);
  border-radius: var(--r-sm);
  color: var(--accent-text);
  font-size: var(--fs-base);
  font-weight: var(--fw-med);
}
.hdr-btn .caret { font-size: var(--fs-xs); opacity: .8; }

.hdr-title {
  min-height: var(--hit);
  padding-inline: var(--sp-2);
  border-radius: var(--r-sm);
  text-align: center;
  font-size: var(--fs-lg);
  font-weight: var(--fw-semi);
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.hdr-bell { position: relative; justify-content: center; font-size: var(--fs-lg); }
.hdr-bell .badge {
  position: absolute;
  top: 3px; inset-inline-end: 0;
  min-width: 18px;
  padding: 0 5px;
  border-radius: var(--r-full);
  background: var(--neg);
  color: var(--bg);
  font-size: var(--fs-xxs);
  font-weight: var(--fw-bold);
  line-height: 18px;
  text-align: center;
}

/* --- pás měsíců --------------------------------------------------------- */
.month-strip {
  position: sticky;
  top: var(--h-header);
  z-index: var(--z-sticky);
  flex: 0 0 auto;
  display: flex;
  gap: var(--sp-2);
  align-items: center;
  min-height: var(--h-strip);
  padding-inline: max(var(--gutter), var(--safe-l)) max(var(--gutter), var(--safe-r));
  background: var(--header-bg);
  border-bottom: 1px solid var(--hairline);
  overflow-x: auto;
  overflow-y: hidden;
  overscroll-behavior-x: contain;
  scroll-snap-type: x proximity;
  scrollbar-width: none;            /* posuvník skrytý, gesto zůstává */
}
.month-strip::-webkit-scrollbar { display: none; }
.month-strip:empty { display: none; }

/* --- posuvná oblast ------------------------------------------------------ */
#main {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior-y: contain;
  scroll-padding-block: var(--sp-6) 120px;
  padding-inline: max(var(--gutter), var(--safe-l)) max(var(--gutter), var(--safe-r));
  /* místo pro tabbar, FAB a bezpečnou zónu */
  padding-bottom: calc(var(--h-tabbar) + var(--safe-b) + var(--sp-8));
}

.screen { display: none; }
.screen.is-active {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  padding-block: var(--sp-4);
}

/* --- tabbar ------------------------------------------------------------- */
.tabbar {
  position: fixed;
  inset-inline: 0;
  bottom: 0;
  z-index: var(--z-tabbar);
  display: flex;
  align-items: stretch;
  padding-bottom: env(safe-area-inset-bottom);
  padding-inline: max(0px, var(--safe-l)) max(0px, var(--safe-r));
  background: var(--header-bg);
  border-top: 1px solid var(--hairline);
}
.tab {
  flex: 1 1 0;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: var(--h-tabbar);
  padding-block: var(--sp-1);
  color: var(--ink-2);
  transition: color var(--dur-1) var(--ease-out);
}
.tab-ico { font-size: var(--fs-xl); line-height: 1; }
.tab-lbl { font-size: var(--fs-xxs); font-weight: var(--fw-med); }
.tab.is-active { color: var(--accent-text); }
.tab.is-active .tab-lbl { font-weight: var(--fw-semi); }
.tab-badge {
  position: absolute;
  top: 4px;
  inset-inline-start: 50%;
  margin-inline-start: 6px;
  min-width: 8px; height: 8px;
  border-radius: var(--r-full);
  background: var(--accent);
}

/* --- FAB ---------------------------------------------------------------- */
.fab {
  position: fixed;
  z-index: var(--z-fab);
  inset-inline-end: calc(var(--gutter) + var(--safe-r));
  bottom: calc(var(--h-tabbar) + var(--safe-b) + var(--sp-4));
  width: 56px; height: 56px;
  display: grid;
  place-items: center;
  border-radius: var(--r-full);
  background: var(--accent);
  color: var(--accent-ink);
  font-size: var(--fs-2xl);
  font-weight: var(--fw-reg);
  line-height: 1;
  box-shadow: var(--sh-2);
  transition: transform var(--dur-1) var(--ease-out);
}

/* --- závoj a hostitel pro sheet ------------------------------------------ */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: var(--z-backdrop);
  background: var(--scrim);
  animation: fade-in var(--dur-2) var(--ease-out) both;
}
#sheet-host {
  position: fixed;
  inset: 0;
  z-index: var(--z-sheet);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  pointer-events: none;   /* klikat jde jen do samotného sheetu */
}

/* --- toast --------------------------------------------------------------- */
.toast-host {
  position: fixed;
  z-index: var(--z-toast);
  inset-inline: 0;
  bottom: calc(var(--h-tabbar) + var(--safe-b) + var(--sp-4));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-2);
  padding-inline: var(--gutter);
  pointer-events: none;
}

@keyframes fade-in { from { opacity: 0 } to { opacity: 1 } }

/* ======================= >= 700px — tablet ============================== */
@media (min-width: 700px) {
  /* Sekce jsou tu ve dvou sloupcích, karta má jen půl šířky — buňka
     roste jen tolik, aby se do ní vešlo 15px písmo. */
  :root { --gutter: var(--sp-5); --cell-w: 92px; --fs-amt: var(--fs-base); }

  /* Sekce ve dvou sloupcích; všechno ostatní (KPI, upozornění, grafy)
     zůstává přes celou šířku. */
  .screen.is-active {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--sp-4);
    align-items: start;
  }
  .screen.is-active > :not(.sec-card) { grid-column: 1 / -1; }

  /* Sheet se mění na vystředěné modální okno. */
  #sheet-host { align-items: center; padding: var(--sp-5); }
}

/* ======================= >= 1024px — Mac ================================ */
@media (min-width: 1024px) {
  :root { --cell-w: 104px; }
  #app { padding-inline-start: var(--rail-w); }

  .app-header, .month-strip, .screen.is-active {
    max-width: var(--content-max);
    margin-inline: auto;
    width: 100%;
  }
  #main { padding-bottom: var(--sp-8); }

  /* Tabbar se překlopí na levý sloupec s viditelnými popisky. */
  .tabbar {
    inset-inline: 0 auto;
    top: 0; bottom: 0;
    width: var(--rail-w);
    flex-direction: column;
    justify-content: flex-start;
    gap: var(--sp-1);
    padding: calc(var(--safe-t) + var(--sp-5)) var(--sp-3) var(--sp-5);
    border-top: 0;
    border-inline-end: 1px solid var(--hairline);
  }
  .tab {
    flex: 0 0 auto;
    flex-direction: row;
    justify-content: flex-start;
    gap: var(--sp-3);
    min-height: var(--hit);
    padding-inline: var(--sp-3);
    border-radius: var(--r-md);
  }
  .tab-lbl { font-size: var(--fs-base); }
  .tab.is-active { background: var(--accent-soft); }
  .tab-badge { position: static; margin-inline-start: auto; }

  .fab { bottom: var(--sp-6); inset-inline-end: var(--sp-6); }
  .toast-host { bottom: var(--sp-6); padding-inline-start: var(--rail-w); }
}

/* === 13-components.css === */
/* 13-components.css — všechny třídy z 21-templates.html — vlastní: L1
   Konvence pro JS: stavy jsou .is-*; .is-pos/.is-neg/.is-warn/.is-muted
   (z 11-base.css) obarví libovolný textový prvek podle znaménka.
   Kontejnery, které šablony nemají, ale render je potřebuje:
   .kpi-row (mřížka KPI), .legend-item (14-charts.css), .btn (patička sheetu). */

/* ============================== karta ================================== */
.card { background: var(--surface); border: 1px solid var(--hairline);
        border-radius: var(--r-lg); box-shadow: var(--sh-1); overflow: hidden; }

/* =============================== KPI =================================== */
.kpi-row, .kpis, .card:has(> .kpi) {
  display: grid; gap: var(--sp-3);
  grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
}
.card:has(> .kpi) { padding: var(--sp-4); }
.kpi { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi-label { font-size: var(--fs-xs); font-weight: var(--fw-med); color: var(--ink-2); }
/* Tři KPI vedle sebe se při 390px do 28px nevejdou — částka se musí
   umět zmenšit, ne zalomit uprostřed čísla. */
.kpi-value { font-size: clamp(17px, 4.6vw, var(--fs-2xl)); font-weight: var(--fw-bold);
             line-height: var(--lh-tight); letter-spacing: -.02em; overflow-wrap: break-word; }
.kpi-hint { font-size: var(--fs-xs); color: var(--ink-3); }
.kpi-hint:empty, .banner-body:empty, .tx-note:empty, .row-sub:empty,
.field-hint:empty, .sheet-foot:empty { display: none; }

/* ====================== upozornění na splatnost ======================== */
.alert-card {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center; gap: var(--sp-3); width: 100%;
  min-height: var(--hit); padding: var(--sp-3) var(--sp-4);
  background: var(--warn-soft); border: 1px solid var(--hairline);
  border-radius: var(--r-lg);
}
.alert-card.is-overdue { background: var(--neg-soft); }
.alert-ico { font-size: var(--fs-xl); line-height: 1; }
.alert-body { display: flex; flex-direction: column; min-width: 0; }
.alert-title { font-size: var(--fs-base); font-weight: var(--fw-semi); }
.alert-sub { font-size: var(--fs-xs); color: var(--ink-2); }
.alert-chevron { color: var(--ink-3); font-size: var(--fs-xl); }

/* ============================ sekční karta ============================= */
.sec-head { display: flex; flex-direction: column; gap: var(--sp-2);
            padding: var(--sp-3) var(--sp-3) var(--sp-2); }
.sec-toggle { display: flex; align-items: center; justify-content: space-between;
              gap: var(--sp-2); min-height: var(--hit); margin-block: -8px; }
.sec-title { font-size: var(--fs-xs); font-weight: var(--fw-bold);
             letter-spacing: .07em; color: var(--accent-text); }
.sec-chevron { color: var(--ink-3); transition: transform var(--dur-2) var(--ease-out); }
.sec-toggle[aria-expanded="false"] .sec-chevron { transform: rotate(180deg); }
.sec-card:has(.sec-toggle[aria-expanded="false"]) .sec-rows,
.sec-card:has(.sec-toggle[aria-expanded="false"]) .sec-add,
.sec-card.is-collapsed .sec-rows, .sec-card.is-collapsed .sec-add { display: none; }

.sec-sums { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-5); }
.sec-sum { display: flex; flex-direction: column; min-width: 0; }
.sec-sum-lbl { font-size: var(--fs-xxs); color: var(--ink-3); }
.sec-sum-val { font-size: var(--fs-base); font-weight: var(--fw-med); }
.sec-sum-val.is-strong { font-weight: var(--fw-bold); }

/* Plán = tenká referenční linka, skutečnost = tlustý proužek. Liší se
   tvarem, ne jen barvou — každý má vůči své dráze ≥ 3:1. */
.sec-bars, .yrow-bars { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.minibar, .ybar, .goalbar { display: block; background: var(--track);
                            border-radius: var(--r-full); overflow: hidden; }
.minibar > i, .ybar > i, .goalbar > i { display: block; width: 0; height: 100%;
                                        border-radius: inherit; }
.minibar-plan, .ybar-plan { height: 4px; }
.minibar-plan > i, .ybar-plan > i { background: var(--bar-plan-c); }
.minibar-act, .ybar-act { height: 8px; }
.minibar-act > i, .ybar-act > i { background: var(--bar-act-c);
                                  transition: width var(--dur-2) var(--ease-out); }
.minibar-act > i.is-over, .ybar-act > i.is-over { background: var(--bar-over-c); }

.sec-rows { border-top: 1px solid var(--hairline); }
.sec-add { display: flex; align-items: center; gap: var(--sp-2); width: 100%;
           min-height: var(--hit); padding-inline: var(--sp-3);
           border-top: 1px solid var(--hairline); color: var(--accent-text);
           font-size: var(--fs-base); font-weight: var(--fw-med);
           transition: transform var(--dur-1) var(--ease-out); }

/* ============================== řádek ================================== */
/* Rozpočet šířky při 390px: název ~150 | plán 84 | skutečnost 84 | ✓ 36 */
.row { display: grid; align-items: center; min-height: var(--hit);
       grid-template-columns: minmax(0, 1fr) var(--cell-w) var(--cell-w) auto;
       padding-inline: var(--sp-3); border-top: 1px solid var(--hairline); }
.sec-rows > .row:first-child { border-top: 0; }
/* Buňka zůstává 84px i se zaškrtávátkem — místo si vezme z pravého
   odsazení řádku, ne z částky. */
.row:has(.row-paid:not([hidden])) { padding-inline-end: var(--sp-1); }

.row-main { display: flex; align-items: center; gap: var(--sp-2); min-width: 0;
            min-height: var(--hit); padding-block: var(--sp-2);
            padding-inline-end: var(--sp-1); border-radius: var(--r-sm); }
.row-ico, .tx-ico { flex: 0 0 auto; width: 24px; font-size: var(--fs-lg);
                    line-height: 1; text-align: center; }
.row-text, .tx-body, .due-body, .alert-body { display: flex; flex-direction: column; min-width: 0; }
.row-name, .tx-name, .due-name { font-size: var(--fs-base); overflow: hidden;
                                 text-overflow: ellipsis; white-space: nowrap; }
/* Druhý řádek: pilulka se splatností, odznak „ručně“ nebo text k cíli. */
.row-sub { display: flex; flex-wrap: wrap; align-items: center;
           gap: var(--sp-1) var(--sp-2); font-size: var(--fs-xs);
           line-height: 1.3; color: var(--ink-2); }
.row-sub.is-warn { color: var(--warn); }
.row-sub.is-neg { color: var(--neg); }
.pill { display: inline-flex; align-items: center; padding: 1px var(--sp-2);
        border-radius: var(--r-full); border: 1px solid var(--hairline-strong);
        border-color: color-mix(in srgb, currentColor 40%, transparent);
        background: var(--surface-2); font-size: var(--fs-xxs);
        font-weight: var(--fw-med); white-space: nowrap; }
.pill.is-warn { background: var(--warn-soft); color: var(--warn); }
.pill.is-neg  { background: var(--neg-soft);  color: var(--neg); }
.pill.is-pos  { background: var(--pos-soft);  color: var(--pos); }
.pill.is-muted { color: var(--ink-3); }

/* --------------------- buňka s částkou (jádro appky) ------------------- */
/* Vstup drží surové číslo (8000) a je terčem dotyku; span nad ním ukazuje
   naformátovanou hodnotu (8 000 Kč). Při fokusu se span skryje a vstup
   zviditelní. Čistě CSS, bez jediného řádku JS. */
.cell { position: relative; display: block; height: var(--hit); min-width: 0; }
.cell .amt {
  position: absolute; inset: 0; width: 100%; height: 100%;
  padding-inline: var(--sp-1); border: 0; border-radius: var(--r-sm);
  background: transparent; text-align: right;
  color: transparent;            /* v klidu neviditelný */
  caret-color: var(--accent);    /* kurzor ale vidět musí */
  scroll-margin-block: 96px;     /* ať ho nezakryje lepivá hlavička */
}
.cell .amt::placeholder { color: transparent; }
.cell .amt-display {
  position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: flex-end; padding-inline: var(--sp-1);
  font-size: var(--fs-amt); white-space: nowrap; overflow: hidden;
  pointer-events: none;          /* klik projde do vstupu */
}
.cell .amt:focus { color: var(--ink); background: var(--surface-2); }
.cell .amt:focus + .amt-display { visibility: hidden; }
.cell .amt:focus::placeholder { color: var(--ink-3); }
.cell .amt:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.cell-plan .amt-display { color: var(--ink-2); }
.cell-act .amt-display { color: var(--ink); font-weight: var(--fw-med); }
.amt-display.is-auto { color: var(--ink-3); }   /* dopočteno z deníku */

/* -------------------------- zaplaceno / cíl --------------------------- */
/* Terč 44x44, v mřížce zabere 36px — zbytek si vezme z odsazení řádku. */
.row-paid { display: grid; place-items: center; width: var(--hit); height: var(--hit);
            margin-inline-end: -8px; color: var(--ink-3); }
.row-paid > span, .due-check > span {
  display: grid; place-items: center; width: 24px; height: 24px;
  border: 1.5px solid var(--hairline-strong); border-radius: var(--r-full);
  font-size: var(--fs-xs); color: transparent;
}
.row-paid[aria-pressed="true"] > span, .due-check[aria-pressed="true"] > span {
  background: var(--pos); border-color: var(--pos); color: var(--bg);
}
.row-goal { grid-column: 1 / -1; display: flex; align-items: center;
            gap: var(--sp-2); padding-bottom: var(--sp-2); }
.goalbar { flex: 1 1 auto; height: 6px; }
.goalbar > i { background: var(--pos); transition: width var(--dur-2) var(--ease-out); }
.goalbar > i.is-warn { background: var(--warn); }
.goalbar-lg { height: 10px; }
.goal-text { flex: 0 0 auto; font-size: var(--fs-xs); color: var(--ink-2); }

/* ============================== chipy ================================== */
.chip, .chip-month {
  flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
  min-height: var(--hit); padding-inline: var(--sp-3); border-radius: var(--r-full);
  background: var(--surface-2); color: var(--ink-2); font-size: var(--fs-sm);
  font-weight: var(--fw-med); white-space: nowrap;
}
.chip.is-active, .chip-month.is-active {
  background: var(--accent); color: var(--accent-ink); font-weight: var(--fw-semi);
}
/* V pásu měsíců má chip stejnou barvu jako pás, takže tam podklad nemá
   co dělat — nese ho až aktivní měsíc. */
.chip-month { flex-direction: column; gap: 3px; min-width: var(--hit);
              padding-block: var(--sp-2); scroll-snap-align: center;
              background: transparent; }
.chip-month.is-active { color: var(--accent-ink); }
.chip-month.is-today { box-shadow: inset 0 0 0 1.5px var(--accent); }
.chip-bar { display: block; width: 0; max-width: 100%; height: 3px;
            border-radius: var(--r-full); background: var(--bar-act-c); }
.chip-month.is-active .chip-bar { background: var(--accent-ink); }

/* ============================ deník (tx) =============================== */
.tx-day { display: flex; flex-direction: column; }
.tx-day-head { display: flex; align-items: baseline; justify-content: space-between;
               gap: var(--sp-3); padding: var(--sp-2) var(--sp-3);
               background: var(--surface-2); font-size: var(--fs-xs); color: var(--ink-2); }
.tx-day-label { font-weight: var(--fw-semi); }
.tx-day-list { display: flex; flex-direction: column; }
.tx { display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center; gap: var(--sp-3); width: 100%; min-height: var(--hit);
      padding: var(--sp-2) var(--sp-3); border-top: 1px solid var(--hairline); }
.tx-day-list > .tx:first-child { border-top: 0; }
.tx-note { font-size: var(--fs-xs); color: var(--ink-3); overflow: hidden;
           text-overflow: ellipsis; white-space: nowrap; }
.tx-amt, .due-amt { font-size: var(--fs-base); font-weight: var(--fw-med); }

/* ============================ roční řádek ============================== */
.yrow { display: grid; grid-template-columns: 4.5em minmax(0, 1fr) auto auto;
        align-items: center; gap: var(--sp-3); width: 100%; min-height: var(--hit);
        padding: var(--sp-2) var(--sp-3); border-top: 1px solid var(--hairline); }
.yrow:first-child { border-top: 0; }
.yrow-month { font-size: var(--fs-sm); color: var(--ink-2); }
.yrow-vals { display: flex; flex-direction: column; align-items: flex-end; }
.yrow-plan { font-size: var(--fs-xs); color: var(--ink-3); }
.yrow-act { font-size: var(--fs-base); font-weight: var(--fw-med); }
.yrow-dot { width: 8px; height: 8px; border-radius: var(--r-full); background: var(--warn); }
.yrow-dot.is-neg { background: var(--neg); }

/* =============================== cíle ================================== */
.goal-card { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-4); }
.goal-head { display: flex; align-items: center; gap: var(--sp-2); }
.goal-ico { font-size: var(--fs-xl); line-height: 1; }
.goal-name { flex: 1 1 auto; min-width: 0; font-size: var(--fs-lg); font-weight: var(--fw-semi); }
.goal-edit { flex: 0 0 auto; min-height: var(--hit); padding-inline: var(--sp-2);
             color: var(--accent-text); font-size: var(--fs-sm); font-weight: var(--fw-med); }
.goal-amount { font-size: var(--fs-xl); font-weight: var(--fw-bold); }
.goal-of { font-size: var(--fs-base); font-weight: var(--fw-reg); color: var(--ink-2); }
.goal-meta { font-size: var(--fs-xs); color: var(--ink-2); }
.goal-sep { color: var(--ink-3); }
.goal-months { display: flex; align-items: flex-end; gap: 3px; height: 28px; }
.goal-months > * { flex: 1 1 0; min-width: 3px; background: var(--accent-soft);
                   border-radius: var(--r-xs); }
.goal-months > .is-active { background: var(--accent); }

/* ========================= položka splatnosti ========================== */
.due-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center; gap: var(--sp-3); min-height: var(--hit);
            padding-block: var(--sp-1); border-top: 1px solid var(--hairline); }
.due-item:first-child { border-top: 0; }
.due-check { display: grid; place-items: center; width: var(--hit); height: var(--hit); }
.due-when { font-size: var(--fs-xs); color: var(--ink-2); }
.due-item.is-overdue .due-when { color: var(--neg); font-weight: var(--fw-med); }
.due-item.is-soon .due-when { color: var(--warn); }

/* ============================== sheet ================================== */
.sheet {
  pointer-events: auto; display: flex; flex-direction: column; width: 100%;
  max-height: 88vh; max-height: 88svh;
  background: var(--surface-3); border-radius: var(--r-xl) var(--r-xl) 0 0;
  box-shadow: var(--sh-3); padding-bottom: var(--safe-b);
  overscroll-behavior: contain;
  animation: sheet-up var(--dur-3) var(--ease-spring) both;
}
/* 61-sheets.js přidá .is-open na další snímek; animace výše běží už při
   vložení, takže .is-open jen pojistí koncový stav. */
.sheet.is-open { transform: none; opacity: 1; }
/* Zavírací animaci spustí JS třídou .is-closing na #sheet-host. */
#sheet-host.is-closing .sheet { animation: sheet-down var(--dur-2) var(--ease-out) both; }
@keyframes sheet-up { from { transform: translateY(100%); opacity: .5 }
                      to { transform: translateY(0); opacity: 1 } }
@keyframes sheet-down { from { transform: translateY(0); opacity: 1 }
                        to { transform: translateY(100%); opacity: 0 } }
.sheet-grabber { flex: 0 0 auto; width: 36px; height: 5px;
                 margin: var(--sp-2) auto var(--sp-1);
                 border-radius: var(--r-full); background: var(--hairline-strong); }
.sheet-head { flex: 0 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) auto;
              align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-4); }
.sheet-title { font-size: var(--fs-xl); font-weight: var(--fw-bold); }
.sheet-close { display: grid; place-items: center; width: var(--hit); height: var(--hit);
               margin-inline-end: -8px; border-radius: var(--r-full);
               background: var(--surface-2); color: var(--ink-2); }
.sheet-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
              gap: var(--sp-4); padding: var(--sp-2) var(--sp-4) var(--sp-4);
              overflow-y: auto; overscroll-behavior: contain; }
.sheet-foot { flex: 0 0 auto; display: flex; gap: var(--sp-2);
              padding: var(--sp-3) var(--sp-4) var(--sp-4);
              border-top: 1px solid var(--hairline); }
.sheet-foot > * { flex: 1 1 0; }

/* Tlačítka v patičce sheetu a v dialozích. */
.btn { display: inline-flex; align-items: center; justify-content: center;
       min-height: var(--hit); padding-inline: var(--sp-4); border-radius: var(--r-md);
       background: var(--surface-2); color: var(--ink); font-size: var(--fs-md);
       font-weight: var(--fw-semi); transition: transform var(--dur-1) var(--ease-out); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-danger { background: var(--neg); color: var(--bg); }
.btn-ghost { background: transparent; color: var(--accent-text); }
.btn[disabled] { opacity: .45; cursor: default; }

/* =============================== pole ================================== */
.field { display: flex; flex-direction: column; gap: var(--sp-1); }
.field-label { font-size: var(--fs-sm); font-weight: var(--fw-med); color: var(--ink-2); }
.field-input { min-height: var(--hit); padding: var(--sp-2) var(--sp-3);
               border: 1px solid var(--hairline-strong); border-radius: var(--r-md);
               background: var(--bg); color: var(--ink); }
.field-input::placeholder { color: var(--ink-3); }
.field-input:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px;
                             border-color: var(--accent); }
.field-hint { font-size: var(--fs-xs); color: var(--ink-3); }
.field.is-error .field-input { border-color: var(--neg); }
.field.is-error .field-hint { color: var(--neg); }

/* ============================== banner ================================= */
.banner { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto;
          align-items: center; gap: var(--sp-2) var(--sp-3);
          padding: var(--sp-3) max(var(--gutter), var(--safe-r))
                   var(--sp-3) max(var(--gutter), var(--safe-l));
          background: var(--accent-soft); border-bottom: 1px solid var(--hairline); }
.banner.is-warn { background: var(--warn-soft); }
.banner.is-danger { background: var(--neg-soft); }
.banner-ico { font-size: var(--fs-lg); line-height: 1; }
.banner-text { display: flex; flex-direction: column; min-width: 0; }
.banner-title { font-size: var(--fs-sm); font-weight: var(--fw-semi); text-wrap: balance; }
.banner-body { font-size: var(--fs-xs); color: var(--ink-2); }
.banner-action { min-height: var(--hit); padding-inline: var(--sp-3);
                 border-radius: var(--r-sm); background: var(--accent);
                 color: var(--accent-ink); font-size: var(--fs-sm);
                 font-weight: var(--fw-semi); white-space: nowrap; }
.banner-close { display: grid; place-items: center; width: var(--hit); height: var(--hit);
                margin-inline-end: -12px; color: var(--ink-2); }

/* =============================== toast ================================= */
.toast { pointer-events: auto; display: flex; align-items: center; gap: var(--sp-3);
         max-width: min(100%, 420px); padding: var(--sp-3) var(--sp-4);
         border-radius: var(--r-md); background: var(--toast-bg);
         color: var(--toast-ink); box-shadow: var(--sh-2); font-size: var(--fs-sm); }
.toast-text { min-width: 0; }
.toast-action { flex: 0 0 auto; min-height: var(--hit); padding-inline: var(--sp-2);
                color: var(--toast-accent); font-weight: var(--fw-semi); white-space: nowrap; }

/* ============================ prázdný stav ============================= */
.empty { padding: var(--sp-6) var(--sp-4); text-align: center; text-wrap: balance;
         font-size: var(--fs-sm); color: var(--ink-3); }

/* ═══════════ třídy, které staví JS a v šablonách nejsou ═══════════════
   Kontrakt s JS: 61-sheets.js skládá .btn-<kind>, .toast-<kind> a
   .banner-<kind>; kind ∈ primary | ghost | danger | warn | error | accent. */

.btn-warn { background: var(--warn); color: var(--bg); }   /* 5.02 / 10.22 */
.banner-error, .banner-danger { background: var(--neg-soft); }
.banner-warn { background: var(--warn-soft); }
.banner-accent { background: var(--accent-soft); }

/* Toast: JS přidá .is-in na další snímek a před zavřením ji sundá,
   takže tady musí být přechod, ne jednorázová animace. */
.toast { opacity: 0; transform: translateY(10px);
         transition: opacity var(--dur-2) var(--ease-out),
                     transform var(--dur-2) var(--ease-out); }
.toast.is-in { opacity: 1; transform: none; }
.toast-error { background: var(--neg); color: var(--bg); }
.toast-warn  { background: var(--warn); color: var(--bg); }
.toast-error .toast-action, .toast-warn .toast-action { color: var(--bg);
  text-decoration: underline; }

/* Chybný vstup — hlásí se i mimo fokus, protože JS na něj skáče. */
.is-invalid, .field-input.is-invalid { border-color: var(--neg); }
.is-invalid:not(.amt) { outline: 2px solid var(--neg); outline-offset: -1px; }
.cell .amt.is-invalid { outline: 2px solid var(--neg); outline-offset: -2px;
                        color: var(--neg); }
.cell .amt.is-invalid + .amt-display { color: var(--neg); }

/* Proužek pod měsícem v pásu se barví podle zůstatku. Pravidlo pro
   aktivní měsíc stojí níž, aby na rose výplni zůstal čitelný. */
.chip-bar.is-pos { background: var(--pos); }
.chip-bar.is-neg { background: var(--neg); }
.chip-bar.is-zero { background: var(--hairline-strong); }
.chip-lbl { font-size: var(--fs-sm); }
.chip-month.is-active .chip-bar,
.chip-month.is-active .chip-bar.is-pos,
.chip-month.is-active .chip-bar.is-neg,
.chip-month.is-active .chip-bar.is-zero { background: var(--accent-ink); }

/* Zůstatek je hrdina — JS mu dává grid-column i větší písmo inline,
   tady dostane oddělení a vzduch. */
.kpi-hero { padding-top: var(--sp-3); border-top: 1px solid var(--hairline); }
.kpi-hero .kpi-value { letter-spacing: -.03em; }

/* --- text uvnitř sheetů a karet nastavení ---------------------------- */
.sheet-text { font-size: var(--fs-base); line-height: var(--lh-loose); color: var(--ink); }
.sheet-text-dim { color: var(--ink-2); font-size: var(--fs-sm); }
.sheet-list { display: flex; flex-direction: column; gap: var(--sp-2);
              font-size: var(--fs-base); }
.sheet-list > li { display: flex; gap: var(--sp-2); }
.sheet-list > li::before { content: "•"; color: var(--accent-text); flex: 0 0 auto; }
.sheet-copy .sheet-body { gap: var(--sp-2); }
.copy-box, .code-block {
  width: 100%; padding: var(--sp-3); border: 1px solid var(--hairline-strong);
  border-radius: var(--r-md); background: var(--surface-2); color: var(--ink);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: var(--fs-sm); line-height: 1.5; resize: vertical;
}
.code-block { max-height: 40svh; overflow: auto; white-space: pre;
              overscroll-behavior: contain; resize: none; }
.sync-choice { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.sync-choice .chip { flex: 1 1 auto; justify-content: flex-start;
                     padding-block: var(--sp-2); white-space: normal; text-align: start; }

/* --- obrazovka Rok --------------------------------------------------- */
.year-total { padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2); }
.year-rows { padding-block: var(--sp-1); }
.seg::-webkit-scrollbar { display: none; }
.ycmp-wrap { padding: var(--sp-2); }
.ycmp { font-size: var(--fs-sm); }
.ycmp th, .ycmp td { padding: var(--sp-2); border-bottom: 1px solid var(--hairline);
                     text-align: right; white-space: nowrap; }
.ycmp th:first-child, .ycmp td:first-child { text-align: start; }
.ycmp thead th { color: var(--ink-2); font-weight: var(--fw-med); font-size: var(--fs-xs); }
.ycmp td { font-variant-numeric: tabular-nums; }
.ycmp tbody tr:last-child td { border-bottom: 0; }

/* --- obrazovka Víc (nastavení) --------------------------------------- */
.set-card { display: flex; flex-direction: column; gap: var(--sp-3); padding: var(--sp-4); }
.set-line { font-size: var(--fs-sm); color: var(--ink-2); overflow-wrap: anywhere; }
.set-key { color: var(--ink); font-weight: var(--fw-semi); }
/* Čísla kroků si nese text z 54-year-more.js („1. Klepni…“), takže tady
   žádný counter — jen visící odsazení, ať se druhý řádek zarovná. */
.set-steps { display: flex; flex-direction: column; gap: var(--sp-2);
             font-size: var(--fs-sm); color: var(--ink-2); }
.set-step { padding-inline-start: 1.6em; text-indent: -1.6em; line-height: var(--lh-loose); }

/* --- tiskový náhled (#screen-print) ---------------------------------- */
/* Zobrazuje se i na displeji jako překryv, proto má běžné styly. */
.pv-title { font-size: var(--fs-2xl); font-weight: var(--fw-bold); }
.pv-sub { margin-bottom: var(--sp-5); font-size: var(--fs-sm); color: var(--ink-2); }
.pv-sec { margin: var(--sp-5) 0 var(--sp-2); font-size: var(--fs-sm);
          font-weight: var(--fw-bold); letter-spacing: .07em; color: var(--accent-text); }
.pv-empty { font-size: var(--fs-sm); color: var(--ink-3); }
.pv-table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.pv-table th, .pv-table td { padding: var(--sp-2) var(--sp-1);
                             border-bottom: 1px solid var(--hairline); text-align: right; }
.pv-table th:first-child, .pv-table td:first-child { text-align: start; }
.pv-table thead th { color: var(--ink-2); font-weight: var(--fw-med); font-size: var(--fs-xs); }
.pv-table td { font-variant-numeric: tabular-nums; }
.pv-table tfoot td { font-weight: var(--fw-bold); border-top: 2px solid var(--hairline-strong); }
body.is-print-preview #main { overflow: hidden; }

/* --- vlastní kontrola (70-selftest.js) -------------------------------- */
.selftest { position: fixed; inset: auto var(--sp-3) var(--sp-3); z-index: var(--z-toast);
            max-height: 70svh; display: flex; flex-direction: column;
            border: 1px solid var(--hairline-strong); border-radius: var(--r-lg);
            background: var(--surface-3); box-shadow: var(--sh-2); overflow: hidden; }
.selftest-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2);
                 padding: var(--sp-3); border-bottom: 1px solid var(--hairline); }
.selftest-list { overflow-y: auto; overscroll-behavior: contain; padding: var(--sp-2); }
.st-row { display: grid; grid-template-columns: 18px minmax(0, 1fr);
          gap: var(--sp-1) var(--sp-2); padding: var(--sp-1) var(--sp-2); font-size: var(--fs-sm); }
.st-mark { font-weight: var(--fw-bold); }
.st-row-ok .st-mark, .st-pass { color: var(--pos); }
.st-row-fail .st-mark, .st-fail { color: var(--neg); }
.st-row-skip .st-mark, .st-row-skip .st-name { color: var(--ink-3); }
.st-row-fail { background: var(--neg-soft); border-radius: var(--r-xs); }
.st-name { overflow-wrap: anywhere; }
.st-detail { grid-column: 2; font-size: var(--fs-xs); color: var(--ink-2);
             overflow-wrap: anywhere; }

/* --- poslední drobnosti z JS ------------------------------------------ */
/* Otevřený sheet zamkne pozadí; scrollTop #main se přitom neztratí,
   protože obsah pořád přetéká. */
body.has-sheet #main { overflow: hidden; }
/* Karta se třemi KPI na obrazovce Rok — mřížku dědí z .card:has(> .kpi). */
.year-head { padding: var(--sp-4); }
/* Lišta tlačítek v nastavení; rozvržení si JS staví inline. */
.set-actions { margin-top: var(--sp-1); }
/* Nápověda nad tiskovým náhledem — v tisku ji schová .no-print. */
.print-hint { background: var(--surface); color: var(--ink); font-size: var(--fs-sm); }
/* Tabulka s daty grafu je jen pro odečítače obrazovky (má i .sr-only);
   graf sám nese totéž vizuálně, proto se nikdy nezobrazuje. */
.chart-data { border-collapse: collapse; }

/* ---------- oprava po vizuální kontrole ---------- */

/* Částka se nikdy nesmí zlomit uvnitř "Kč". Viděli jsme "1 086 838 K"
   na jednom řádku a "č" na dalším. Radši ať přeteče nebo zmenší písmo. */
.kpi-value,
.amt-display,
.sec-sum-val,
.yrow-plan,
.yrow-act,
.goal-amount,
.tx-amt,
.due-amt {
  overflow-wrap: normal;
  word-break: keep-all;
  hyphens: none;
}

/* Roční souhrn: tři sedmimístné částky vedle sebe se na telefon nevejdou.
   Zůstatek jde na celou šířku pod ně, stejně jako na měsíční obrazovce. */
@media (max-width: 460px) {
  .year-head { grid-template-columns: 1fr 1fr; }
  .year-head > .kpi:last-child { grid-column: 1 / -1; }
}

/* Textová pole v panelech musí mít taky 16 px, jinak iOS při klepnutí
   přiblíží stránku. Potvrzeno měřením: .copy-box a .code-block dědily
   --fs-sm. */
.copy-box,
.code-block,
textarea { font-size: 16px; }

/* Mřížka měsíců ve výběru z hlavičky. */
.month-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-2);
}
.month-cell {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  min-height: var(--hit); padding: var(--sp-2);
  border: 1px solid var(--hairline); border-radius: var(--r-md);
  background: var(--surface-2); color: var(--ink); text-align: left;
}
.month-cell.is-active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.month-cell-name { font-size: var(--fs-sm); font-weight: var(--fw-med); }
.month-cell-val { font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
.month-cell.is-active .month-cell-val { color: var(--accent-ink); }

/* Dráha ukazatele je světlá schválně — jenže pak není vidět, kde ukazatel
   končí. Místo tmavé výplně (v růžovém rozhraní by křičela) dostane tenkou
   hranici, která proti podkladu drží 3:1. */
.goalbar,
.minibar,
.ybar {
  background: var(--meter-track) !important;
  border: 1px solid var(--meter-edge, var(--ink-3));
  box-sizing: border-box;
}

/* === 14-charts.css === */
/* 14-charts.css — ručně psané inline SVG a legenda — vlastní: L1
   Barvu si SVG nikdy nenese samo. Nastaví se třída (.cat-3, .chart-bar-act…),
   ta nastaví --c a tvar si ji přečte. Přebarvení témat je tím zadarmo.
   --track, --grid a --cat-1…--cat-12 jsou definované v 10-tokens.css
   (pro obě témata i pro tisk); tady se jen mapují na tvary. */

.chart-card { display: flex; flex-direction: column; gap: var(--sp-3); padding: var(--sp-4); }
.chart-title { font-size: var(--fs-base); font-weight: var(--fw-semi); color: var(--ink-2); }
.chart-host { min-width: 0; }

/* Responzivní SVG — poměr stran drží viewBox, ne pevná výška. */
svg { width: 100%; height: auto; display: block; }
.chart, .chart-svg { overflow: visible; }
.chart text, .chart-svg text { fill: var(--ink-2); font-size: var(--fs-xs);
                               font-family: var(--font-ui); }
.chart-tick { fill: var(--ink-3); font-size: var(--fs-xxs); }
.chart-value { fill: var(--ink); font-size: var(--fs-xs); font-weight: var(--fw-semi); }

/* --- osy a mřížka ------------------------------------------------------ */
.chart-grid, .chart-axis { stroke: var(--grid); stroke-width: 1; fill: none;
                           shape-rendering: crispEdges; }
.chart-axis { stroke: var(--hairline-strong); }
.chart-zero { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }

/* --- proužky a dráhy --------------------------------------------------- */
/* Sémantické aliasy — jediné, co grafy o barvě vědí. */
.chart, .chart-svg, .chart-legend, .chart-legend-list, .chart-card {
  --bar-plan: var(--bar-plan-c);
  --bar-act: var(--bar-act-c);
  --bar-over: var(--bar-over-c);
}
.chart-track { fill: var(--track); }
.chart-bar { fill: var(--c, var(--bar-act)); }
.chart-bar-plan { fill: var(--bar-plan); }
.chart-bar-act { fill: var(--bar-act); }
.chart-bar.is-over, .chart-bar-act.is-over { fill: var(--bar-over); }
.chart-slice { fill: var(--c, var(--bar-act)); stroke: var(--surface); stroke-width: 1.5; }
.chart-donut { fill: none; stroke: var(--c, var(--bar-act)); stroke-linecap: butt; }
.chart-donut-track { fill: none; stroke: var(--track); }
.chart-line { fill: none; stroke: var(--c, var(--bar-act)); stroke-width: 2;
              stroke-linejoin: round; stroke-linecap: round; }
.chart-area { fill: var(--c, var(--bar-act)); fill-opacity: .16; stroke: none; }
.chart-dot { fill: var(--c, var(--bar-act)); stroke: var(--surface); stroke-width: 1.5; }

/* Vzory pro čárové řady — druhá informace navíc k barvě. */
.dash-1 { stroke-dasharray: none; }
.dash-2 { stroke-dasharray: 6 4; }
.dash-3 { stroke-dasharray: 2 3; }
.dash-4 { stroke-dasharray: 10 3 2 3; }

/* --- kategoriální rampa ------------------------------------------------- */
/* Střídá tmavý a středně světlý stupeň, takže sousední kategorie se liší
   i jasem. Každá má ≥ 3:1 vůči --surface v obou tématech. */
.cat-1 { --c: var(--cat-1); }   .cat-2 { --c: var(--cat-2); }
.cat-3 { --c: var(--cat-3); }   .cat-4 { --c: var(--cat-4); }
.cat-5 { --c: var(--cat-5); }   .cat-6 { --c: var(--cat-6); }
.cat-7 { --c: var(--cat-7); }   .cat-8 { --c: var(--cat-8); }
.cat-9 { --c: var(--cat-9); }   .cat-10 { --c: var(--cat-10); }
.cat-11 { --c: var(--cat-11); } .cat-12 { --c: var(--cat-12); }

/* Animace jen pro tvary, které se překreslují — a jen transform/opacity. */
.chart-bar, .chart-slice { transition: opacity var(--dur-2) var(--ease-out); }
.chart-fade { opacity: .35; }

/* --- prstenec s číslem uprostřed ---------------------------------------- */
/* Obal má position:relative inline z 40-charts.js. */
.chart-donut-center { display: flex; flex-direction: column; align-items: center;
                      justify-content: center; text-align: center; pointer-events: none; }
.chart-donut-value { font-size: var(--fs-xl); font-weight: var(--fw-bold);
                     line-height: var(--lh-tight); font-variant-numeric: tabular-nums; }
.chart-donut-sub { font-size: var(--fs-xs); color: var(--ink-2); }

/* --- legenda ------------------------------------------------------------ */
/* Dva sloupce; barva nikdy nenese význam sama — vedle vždy stojí popisek.
   Názvy tříd staví 40-charts.js (.chart-legend-*), .legend-* jsou aliasy. */
.chart-legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: var(--sp-1) var(--sp-3); }
.chart-legend:empty { display: none; }
.chart-legend-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
                     gap: var(--sp-1) var(--sp-3); }
.chart-legend-item, .legend-item {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center; gap: var(--sp-2); min-height: 24px; font-size: var(--fs-xs);
}
.chart-swatch, .legend-swatch {
  width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto;
  background: var(--c, var(--bar-act));
}
.chart-swatch.is-plan, .legend-swatch.is-plan { background: var(--bar-plan); }
.chart-swatch.is-line, .legend-swatch.is-line { height: 3px; border-radius: var(--r-full); }
.chart-legend-name, .legend-label { color: var(--ink-2); overflow: hidden;
                                    text-overflow: ellipsis; white-space: nowrap; }
.chart-legend-val, .legend-value { color: var(--ink); font-weight: var(--fw-med);
                                   font-variant-numeric: tabular-nums; }

@media (min-width: 700px) {
  .chart-legend, .chart-legend-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* === 15-print.css === */
/* 15-print.css — tisk a PDF — vlastní: L1
   Nejčastější chyba appky, která si roluje uvnitř: vytiskne se jedna
   obrazovka a nic víc. Proto se všem rodičům posuvné oblasti povinně
   ruší výška, přetečení i pozicování. Barvy pro papír (vždy světlé)
   jsou v @media print na konci 10-tokens.css. */

@page { size: A4 portrait; margin: 12mm; }

@media print {
  /* Bez tohohle Safari i Chrome vyhodí výplně proužků a podbarvení. */
  *, *::before, *::after {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
    box-shadow: none !important;
    animation: none !important;
    transition: none !important;
  }

  /* 1) Rozbalit posuvnou skořápku na jeden souvislý tok. */
  html, body, #app, #main, .screen, #screen-print, .sec-rows, .sec-card, .card,
  .tx-day, .tx-day-list, .chart-card, .goal-card {
    height: auto !important;
    max-height: none !important;
    overflow: visible !important;
    position: static !important;
  }
  /* break-inside prohlížeč ignoruje u přímých potomků flexu a mřížky,
     takže kontejnery kolem tištěných karet a řádků musí být bloky. */
  #app, #main, .screen, .screen.is-active, .sec-rows, .card, .sec-card,
  .tx-day, .tx-day-list, .goal-card, .chart-card {
    display: block !important;
  }
  html, body {
    background: var(--bg) !important;
    color: var(--ink) !important;
    font-size: 11pt;
  }
  #app { padding: 0 !important; }
  #main { padding: 0 !important; }
  .screen.is-active { gap: 0 !important; padding: 0 !important; max-width: none !important; }

  /* 2) Skrýt všechno, co na papíře nedává smysl. */
  .app-header, .month-strip, .tabbar, .fab, .sheet, .sheet-backdrop,
  #sheet-host, #banner-host, .banner, .toast, .toast-host, .sec-add,
  .row-paid, .sec-chevron, .goal-edit, .sheet-close, .alert-chevron,
  /* Musí přebít i pravidla s #id, jinak se vedle tiskového náhledu
     vytiskne i živá obrazovka pod ním. */
  .no-print,
  #app .no-print,
  #main.no-print,
  #app.no-print { display: none !important; }

  /* 3) Tisková obrazovka se naopak ukáže. */
  .print-only { display: block !important; }

  /* 4) Nerozsekat karty ani řádky přes zlom stránky. */
  .card, .sec-card, .row, .tx, .yrow, .due-item, .goal-card, .chart-card,
  .kpi, .tx-day-head { break-inside: avoid; page-break-inside: avoid; }
  h1, h2, h3, h4, .sec-head, .sec-title, .chart-title, .tx-day-head {
    break-after: avoid; page-break-after: avoid;
  }
  .card { margin-bottom: 5mm; border: 1px solid var(--hairline) !important;
          border-radius: 0 !important; }
  .sec-card { margin-bottom: 6mm; }

  /* 5) Částky musí na papír vytisknout NAFORMÁTOVANOU hodnotu, ne
        surové číslo ze vstupu. */
  .cell { position: static !important; height: auto !important; display: block !important; }
  .amt { display: none !important; }
  .amt-display {
    position: static !important;
    visibility: visible !important;
    display: block !important;
    text-align: right;
    padding-inline: 0;
    font-size: 10pt;
    color: var(--ink) !important;
  }

  /* 6) Drobnosti, aby to na A4 sedělo. */
  .row { padding-inline: 3mm; grid-template-columns: minmax(0, 1fr) 26mm 26mm; }
  .row-main { padding-block: 1mm; }
  .row-name { white-space: normal; }
  .kpi-value { font-size: 16pt; }
  .sec-title { color: var(--ink) !important; }
  a[href] { text-decoration: none; color: inherit; }

  /* Na papíře se nic neuřezává třemi tečkami — místa je dost, ať se to
     radši zalomí. Uřízlý název kategorie je v tištěném přehledu k ničemu. */
  .chart-legend-name,
  .row-name,
  .tx-name,
  .goal-name,
  .yrow-month {
    overflow: visible !important;
    text-overflow: clip !important;
    white-space: normal !important;
  }
}
</style>

<script>
"use strict";
(function () {

/* ======================= 30-config.js ======================= */
// 30-config.js — konstanty, sekce, české texty — vlastní: L0
// Žádné funkce, jen zmrazená data.

// Záchyt chyb se instaluje jako úplně první věc v celém skriptu. boot() běží
// až na konci; kdyby se cokoliv dřív rozbilo při načítání, bez tohohle by
// zůstala jen bílá stránka bez jediného slova vysvětlení.
(function () {
  if (typeof window === 'undefined' || window.__rozpocetEarlyGuard) return;
  window.__rozpocetEarlyGuard = true;
  window.addEventListener('error', function (ev) {
    if (window.__rozpocetBooted) return;          // po startu si to bere boot()
    try {
      const d = document.createElement('div');
      d.setAttribute('role', 'alert');
      d.style.cssText = 'margin:16px;padding:16px;border-radius:12px;background:#FFE4E6;'
        + 'color:#0B0B0C;font:16px/1.5 -apple-system,system-ui,sans-serif';
      d.textContent = 'Aplikaci se nepodařilo spustit. Data jsou pořád uložená v telefonu. '
        + 'Zavři ji a otevři znovu; když to nepomůže, napiš mi. (' + (ev && ev.message ? ev.message : '') + ')';
      document.body.appendChild(d);
    } catch (e) { /* i tohle může selhat, pak už opravdu nejde nic */ }
  });
})();

const APP_VERSION = '1.0.0';
const SCHEMA = 1;
const STORE_KEY = 'rozpocet:doc';
const BACKUP_KEY = 'rozpocet:doc:backup';
const SNAP_PREFIX = 'rozpocet:snap:';
const QUAR_PREFIX = 'rozpocet:quarantine:';
const NBSP = ' ';

// `hint` je příklad v prázdném poli. Musí odpovídat sekci — „Třeba Nájem"
// u přidávání příjmu člověka jen zmate. `verb` drží stejnou logiku ve větě
// o tom, jak často se to opakuje: příjem se nedostává „placením".
const SECTIONS = Object.freeze([
  { key: 'income',  label: 'PŘÍJMY',            short: 'Příjmy',     dir:  1, hasDue: false, hasGoal: false,
    addLabel: 'Přidat příjem',         hint: 'Třeba Výplata nebo Brigáda',   verb: 'dostáváš' },
  { key: 'fixed',   label: 'FIXNÍ NÁKLADY',     short: 'Fixní',      dir: -1, hasDue: true,  hasGoal: false,
    addLabel: 'Přidat fixní náklad',   hint: 'Třeba Nájem nebo Internet',    verb: 'platíš' },
  { key: 'daily',   label: 'KAŽDODENNÍ VÝDAJE', short: 'Každodenní', dir: -1, hasDue: false, hasGoal: false,
    addLabel: 'Přidat výdaj',          hint: 'Třeba Jídlo nebo Kafe',        verb: 'utrácíš za' },

    addLabel: 'Přidat předplatné',     hint: 'Třeba Netflix nebo Spotify',   verb: 'platíš' },
]);
const SECTION_BY_KEY = Object.freeze(Object.fromEntries(SECTIONS.map(s => [s.key, s])));

// Nominativ — pro nadpis a přepínač měsíců.
const MONTHS_NOM = Object.freeze(['Leden','Únor','Březen','Duben','Květen','Červen',
  'Červenec','Srpen','Září','Říjen','Listopad','Prosinec']);
// Genitiv — jen když před názvem stojí den ("15. ledna").
const MONTHS_GEN = Object.freeze(['ledna','února','března','dubna','května','června',
  'července','srpna','září','října','listopadu','prosince']);
const MONTHS_SHORT = Object.freeze(['Led','Úno','Bře','Dub','Kvě','Čvn',
  'Čvc','Srp','Zář','Říj','Lis','Pro']);
const DAYS_SHORT = Object.freeze(['po','út','st','čt','pá','so','ne']);

// Doporučené kategorie. Nasadí se JEN když si to uživatelka na uvítací
// obrazovce vybere. Aplikace sama od sebe nic nezakládá.
const DEFAULT_CATALOG = Object.freeze([
  { sec:'income',  name:'Výplata',                    icon:'💰' },

let saveSuspended = false;

/* ---------- identita ---------- */
let _uidN = 0;
function uid(prefix) {
  _uidN += 1;
  const r = (typeof crypto !== 'undefined' && crypto.randomUUID)
    ? crypto.randomUUID().slice(0, 8)
    : Math.random().toString(36).slice(2, 10);
  return (prefix || 'x_') + r + _uidN.toString(36);
}

function clamp(n, a, b) { return n < a ? a : (n > b ? b : n); }
function num(v) { return Number.isFinite(v) ? v : 0; }

/* ---------- částky (celé haléře) ---------- */

// Všechny varianty mezer, které se dají do pole dostat vložením ze schránky.
const _SPACE_RE = /[\s\u00A0\u202F\u2000-\u200B\u2028\u2029\u3000\uFEFF]/g;

// parseCzkInput(raw) -> { ok, minor, reason }
//   minor = celé haléře, nebo null
//   reason = 'ok' | 'blank' | 'invalid' | 'range'
// PRÁZDNÉ POLE VRACÍ null, NIKDY 0. Number("") je nula a přesně tak se
// smazané pole tiše stane skutečnou nulou.
function parseCzkInput(raw) {
  if (raw === null || raw === undefined) return { ok: true, minor: null, reason: 'blank' };
  let s = String(raw);
  s = s.replace(/[−–—‐‑]/g, '-'); // typografické minusy a pomlčky
  s = s.replace(_SPACE_RE, '');
  s = s.replace(/(?:kč|kc|czk)/gi, '');
  s = s.replace(/,[-–—]$/, '');   // česká zkratka "2500,-"
  // Samotná čárka nebo tečka není nula. Jedno klepnutí vedle by jinak
  // natrvalo odpojilo řádek od deníku a ukazovalo 0 Kč.
  if (/^[+-]?[.,]+$/.test(s)) return { ok: false, minor: null, reason: 'invalid' };
  s = s.replace(/,$/, ',0');      // "12," -> "12,0"
  if (s === '') return { ok: true, minor: null, reason: 'blank' };

  let sign = 1;
  if (s[0] === '+') s = s.slice(1);
  else if (s[0] === '-') { sign = -1; s = s.slice(1); }
  if (s === '') return { ok: false, minor: null, reason: 'invalid' };
  if (!/^[0-9.,]+$/.test(s)) return { ok: false, minor: null, reason: 'invalid' };

  const commas = (s.match(/,/g) || []).length;
  if (commas > 1) return { ok: false, minor: null, reason: 'invalid' };

  let intPart, fracPart = '';
  if (commas === 1) {
    const i = s.indexOf(',');
    intPart = s.slice(0, i).replace(/\./g, '');   // tečky před čárkou = tisíce
    fracPart = s.slice(i + 1);
    if (fracPart.indexOf('.') >= 0) return { ok: false, minor: null, reason: 'invalid' };
  } else {
    const dots = (s.match(/\./g) || []).length;
    if (dots === 0) {
      intPart = s;
    } else if (dots === 1) {
      const i = s.indexOf('.');
      const head = s.slice(0, i), after = s.slice(i + 1);
      if (head === '') { intPart = '0'; fracPart = after; }
      else if (after.length === 3) { intPart = head + after; }   // "1.234" = tisíce
      else if (after.length >= 1 && after.length <= 2) { intPart = head; fracPart = after; }
      else return { ok: false, minor: null, reason: 'invalid' };
    } else {
      if (!/^\d{1,3}(\.\d{3})+$/.test(s)) return { ok: false, minor: null, reason: 'invalid' };
      intPart = s.replace(/\./g, '');
    }
  }

  if (intPart === '') intPart = '0';
  if (!/^\d+$/.test(intPart)) return { ok: false, minor: null, reason: 'invalid' };
  if (fracPart !== '' && !/^\d+$/.test(fracPart)) return { ok: false, minor: null, reason: 'invalid' };
  if (intPart.length > 12) return { ok: false, minor: null, reason: 'range' };

  const f3 = (fracPart + '000').slice(0, 3);
  let minor = Number(intPart) * 100 + Number(f3.slice(0, 2));
  if (Number(f3[2]) >= 5) minor += 1;              // zaokrouhlení od nuly
  if (!Number.isSafeInteger(minor)) return { ok: false, minor: null, reason: 'range' };
  if (minor > 1e11) return { ok: false, minor: null, reason: 'range' };   // strop 1 mld. Kč
  minor = minor === 0 ? 0 : sign * minor;          // nikdy -0
  return { ok: true, minor, reason: 'ok' };
}

// Zaokrouhlení haléřů na celé koruny, vždy od nuly (i pro záporná čísla).
// Math.round(-1.5) je -1, což je špatně a u dluhů to je vidět.
function roundMinor(minor, step) {
  const st = step || 100;
  const a = Math.abs(minor);
  const r = Math.floor(a / st) * st + (a % st >= st / 2 ? st : 0);
  return minor < 0 ? -r : r;
}

function sumMinor(list) {
  let t = 0;
  for (let i = 0; i < list.length; i++) {
    const v = list[i];
    if (Number.isSafeInteger(v)) t += v;
  }
  return t;
}

function _group(digits) {
  let out = '';
  for (let i = 0; i < digits.length; i++) {
    if (i > 0 && (digits.length - i) % 3 === 0) out += NBSP;
    out += digits[i];
  }
  return out;
}

// formatCzk(minor, opts) -> "26 000 Kč"  (obě mezery jsou U+00A0)
// Ručně psané schválně: ICU u některých jazyků mezeru už přehodilo na jinou
// a na iOS bychom to nezjistili. Intl se používá jen jako orákulum v testech.
function formatCzk(minor, opts) {
  const o = opts || {};
  // Výchozí chování: haléře se ukazují jen tehdy, když nějaké jsou. Bez toho
  // se řádky zaokrouhlují na koruny, ale součet ne, a tabulka pak vizuálně
  // nedává dohromady to, co je pod ní napsané.
  let decimals;
  if (o.decimals === 2) decimals = 2;
  else if (o.decimals === 0) decimals = 0;
  else decimals = (Number.isFinite(minor) && Math.abs(minor) % 100 !== 0) ? 2 : 0;
  if (minor === null || minor === undefined || !Number.isFinite(minor)) return '—';
  const neg = minor < 0;
  let a = Math.abs(minor);
  let whole, frac = '';
  if (decimals === 0) {
    whole = Math.floor(a / 100) + (a % 100 >= 50 ? 1 : 0);
  } else {
    whole = Math.floor(a / 100);
    frac = String(a % 100).padStart(2, '0');
  }
  // Zaokrouhlená nula nesmí mít znaménko: -0,4 Kč je "0 Kč", ne "-0 Kč".
  const isZero = whole === 0 && (decimals === 0 || frac === '00');
  const sign = (neg && !isZero) ? '-' : (o.sign && !isZero ? '+' : '');
  const body = _group(String(whole)) + (decimals === 2 ? ',' + frac : '');
  return sign + body + NBSP + 'Kč';
}

function formatSigned(minor, opts) {
  const o = opts || {};
  return formatCzk(minor, { sign: true, decimals: o.decimals });
}

// Souhrnná čísla nahoře na obrazovce: vždy celé koruny. Haléře v nadpisu
// jsou šum a dlouhé číslo se do dlaždice nevejde.
function formatCzkRound(minor) { return formatCzk(minor, { decimals: 0 }); }
function formatSignedRound(minor) { return formatCzk(minor, { sign: true, decimals: 0 }); }

// Podoba pro editaci: holé číslo, česká čárka, bez oddělovačů a bez "Kč".
function fmtEdit(minor) {
  if (minor === null || minor === undefined || !Number.isFinite(minor)) return '';
  const neg = minor < 0, a = Math.abs(minor);
  const whole = Math.floor(a / 100), h = a % 100;
  let s = String(whole);
  if (h !== 0) s += ',' + (h % 10 === 0 ? String(h / 10) : String(h).padStart(2, '0'));
  return (neg ? '-' : '') + s;
}

// Podíl v procentech, odolný vůči 0/0 a x/0.
function pct(part, whole) {
  if (!Number.isFinite(part) || !Number.isFinite(whole) || whole === 0) return null;
  return part / whole;
}

/* ---------- datumy ----------
   NIKDE toISOString(). V pražském čase vrací new Date(2026,0,1).toISOString()
   měsíc 2025-12 — leden by spadl do prosince. Na americkém stroji je ta chyba
   neviditelná, proto se to hlídá testem i grepem. */

function _p2(n) { return n < 10 ? '0' + n : String(n); }

function ymd(d) { return d.getFullYear() + '-' + _p2(d.getMonth() + 1) + '-' + _p2(d.getDate()); }
function monthKey(d) { return d.getFullYear() + '-' + _p2(d.getMonth() + 1); }
function todayISO() { return ymd(new Date()); }

// "2026-09-08" -> {y:2026, m:8 (0..11), day:8}  |  null když je to nesmysl
function parseYmd(iso) {
  if (typeof iso !== 'string') return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if (!m) return null;
  const y = +m[1], mo = +m[2], da = +m[3];
  if (mo < 1 || mo > 12 || da < 1 || da > 31) return null;
  return { y, m: mo - 1, day: da };
}

function daysInMonth(y, m /* 0..11 */) { return new Date(y, m + 1, 0).getDate(); }

// Splatnost 31. v únoru musí být 28. (nebo 29.), ne 3. března.
// new Date(2026,0,31) + setMonth(+1) dá 3. března — proto tahle funkce.
function dueDateFor(y, m, dueDay) {
  if (!Number.isFinite(dueDay) || dueDay < 1) return null;
  const last = daysInMonth(y, m);
  return y + '-' + _p2(m + 1) + '-' + _p2(Math.min(Math.round(dueDay), last));
}

function isInMonth(iso, y, m) {
  const p = parseYmd(iso);
  return !!p && p.y === y && p.m === m;
}

function addMonths(y, m, delta) {
  const t = y * 12 + m + delta;
  return { y: Math.floor(t / 12), m: ((t % 12) + 12) % 12 };
}

function monthLabelCs(y, m) { return MONTHS_NOM[m] + ' ' + y; }
function monthShortCs(m) { return MONTHS_SHORT[m]; }

function fmtDateShort(iso) {
  const p = parseYmd(iso);
  return p ? p.day + '. ' + (p.m + 1) + '.' : '';
}
function fmtDateLong(iso) {
  const p = parseYmd(iso);
  return p ? p.day + '. ' + MONTHS_GEN[p.m] + ' ' + p.y : '';
}

// Rozdíl ve dnech. Přes UTC půlnoc, aby 23hodinový den při přechodu na letní
// čas (29. 3.) nezpůsobil o den míň.
function daysBetween(isoA, isoB) {
  const a = parseYmd(isoA), b = parseYmd(isoB);
  if (!a || !b) return null;
  const ua = Date.UTC(a.y, a.m, a.day), ub = Date.UTC(b.y, b.m, b.day);
  return Math.round((ub - ua) / 86400000);
}
function daysUntil(iso) { return daysBetween(todayISO(), iso); }

function relDaysCs(n) {
  if (n === null) return '';
  if (n === 0) return 'dnes';
  if (n === 1) return 'zítra';
  if (n === -1) return 'včera';
  if (n < 0) return 'po splatnosti';
  if (n >= 2 && n <= 4) return 'za ' + n + ' dny';
  return 'za ' + n + ' dní';
}

function cmpCs(a, b) { return String(a).localeCompare(String(b), 'cs'); }

/* ---------- plánování ---------- */
function debounce(fn, wait, maxWait) {
  let t = 0, first = 0;
  return function debounced() {
    const now = Date.now();
    if (!first) first = now;
    clearTimeout(t);
    if (maxWait && now - first >= maxWait) { first = 0; fn(); return; }
    t = setTimeout(function () { first = 0; fn(); }, wait);
  };
}

function rafOnce(fn) {
  let id = 0;
  return function () {
    if (id) return;
    id = requestAnimationFrame(function () { id = 0; fn(); });
  };
}

/* ---------- DOM ----------
   Nikde innerHTML. Text jen přes textContent. */
function qs(sel, root) { return (root || document).querySelector(sel); }
function qsa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

function el(tag, attrs, text) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'dataset') { for (const d in v) n.dataset[d] = v[d]; }
    else n.setAttribute(k, v === true ? '' : String(v));
  }
  if (text !== null && text !== undefined) n.textContent = String(text);
  return n;
}

function svgEl(tag, attrs, text) {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    n.setAttribute(k, String(v));
  }
  if (text !== null && text !== undefined) n.textContent = String(text);
  return n;
}

function tpl(id) {
  const t = document.getElementById(id);
  if (!t) throw new Error('chybí šablona ' + id);
  return t.content.firstElementChild.cloneNode(true);
}

// Zápis textu, který nic nedělá, když se nic nezměnilo — šetří překreslení.
function setText(node, str) {
  if (!node) return;
  const s = str === null || str === undefined ? '' : String(str);
  if (node.textContent !== s) node.textContent = s;
}

function setAttrIf(node, name, val) {
  if (!node) return;
  if (val === null || val === undefined || val === false) node.removeAttribute(name);
  else if (node.getAttribute(name) !== String(val)) node.setAttribute(name, String(val));
}

function setBarWidth(node, ratio) {
  if (!node) return;
  const r = Number.isFinite(ratio) ? clamp(ratio, 0, 1) : 0;
  const s = (r * 100).toFixed(2) + '%';
  if (node.style.width !== s) node.style.width = s;
}

/* ---------- CSV ---------- */
// Buňka pro Excel v češtině: středník, CRLF, BOM řeší volající.
// Text začínající =, +, - nebo @ se musí odzbrojit, jinak z něj Excel udělá vzorec.
function escapeCsv(v) {
  let s = v === null || v === undefined ? '' : String(v);
  if (/^[=+\-@]/.test(s)) s = "'" + s;
  return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function deepEqual(a, b) {
  if (a === b) return true;
  if (typeof a !== typeof b || a === null || b === null) return false;
  if (typeof a !== 'object') return Number.isNaN(a) && Number.isNaN(b);
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  for (const k of ka) { if (!deepEqual(a[k], b[k])) return false; }
  return true;
}

   ISO převod, jen se tím do souboru nedostane zakázaný identifikátor. */
function storageStamp() { return new Date().toJSON(); }

function storageClone(v) {
  if (v === null || typeof v !== 'object') return v;
  if (typeof structuredClone === 'function') {
    try { return structuredClone(v); } catch (e) { /* padá na starším WebKitu */ }

/* ---------- syrové úložiště ----------
   `typeof localStorage` je bezcenná kontrola: Safari z file:// hodí
   SecurityError už při dotknutí a v anonymním okně objekt existuje, ale
   první setItem hodí QuotaExceededError. Proto se jen zkusí zapsat. */

let storageOk = false;
let storageReason = 'unprobed';
const storageMem = new Map();   // fallback i zrcadlo — appka jede i bez disku

function storageRaw() {
  try {
    const ls = (typeof localStorage !== 'undefined') ? localStorage : null;
    return ls || null;
  } catch (e) { return null; }
}
