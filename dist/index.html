      [['Naspořeno', formatCzk(num(saved))], ['Cíl', formatCzk(num(target))], ['Hotovo', p.label]])];
  });
}

/* ======================= 60-events.js ======================= */
// 60-events.js — router, delegované události, pole s částkou, patch smyčka — vlastní: L0
// Šest posluchačů na #app. Žádné onclick, žádné navazování při překreslení.

const ACTIONS = Object.create(null);

/* ---------- router ---------- */

const SCREENS = ['month', 'year', 'journal', 'savings', 'more'];

function goScreen(name) {
  if (SCREENS.indexOf(name) < 0) name = 'month';
  // Jen otevřít appku není změna dat. Bez téhle podmínky se při každém
  // spuštění zapisuje do úložiště, i když uživatelka na nic nesáhla.
  const zmena = state.ui.screen !== name;
  state.ui.screen = name;
  for (const s of SCREENS) {
    const node = qs('#screen-' + s);
    if (!node) continue;
    const on = s === name;
    node.classList.toggle('is-active', on);
    node.hidden = !on;
  }
  for (const t of qsa('#tabbar .tab')) {
    const on = t.dataset.screen === name;
    t.classList.toggle('is-active', on);
    setAttrIf(t, 'aria-current', on ? 'page' : null);
  }
  const fab = qs('#fab');
  if (fab) fab.hidden = !(name === 'month' || name === 'journal');
  renderApp();
  if (zmena) scheduleSave();
}

function goMonth(m) {
  const mm = clamp(Math.round(m), 0, 11);
  if (state.ui.month === mm) return;
  state.ui.month = mm;
  renderApp();
  scheduleSave();
}

function goYear(y) {
  const yy = Math.round(y);
  if (!Number.isFinite(yy) || state.activeYear === yy) return;
  if (!state.years[String(yy)]) state.years[String(yy)] = newYear(yy);
  state.activeYear = yy;
  invalidateAll();
  renderApp();
  scheduleSave();
}

// Strukturální vykreslení. Jediné, co smí vytvářet a rušit uzly.
function renderApp() {
  const y = state.activeYear, m = state.ui.month;
  setText(qs('#hdr-year'), String(y));
  setText(qs('#hdr-month'), monthLabelCs(y, m));
  renderMonthStrip();
  switch (state.ui.screen) {
    case 'year':    renderYearScreen(); break;
    case 'journal': renderJournalScreen(); break;
    case 'savings': renderSavingsScreen(); break;
    case 'more':    renderSettingsScreen(); break;
    default:        renderMonthScreen(); break;
  }
  patchNow();
}

// Dopočty. Zapisuje jen textContent, style.width, classList a aria-*.
// NIKDY nesahá na prvek, ve kterém je kurzor.
function patchNow() {
  try {
    patchMonthStrip();
    patchTabBadges();
    switch (state.ui.screen) {
      case 'year':    patchYear(); break;
      case 'journal': patchJournal(); break;
      case 'savings': patchSavings(); break;
      case 'more':    patchSettings(); break;
      default:        patchMonth(); break;
    }
  } catch (err) {
    console.error('patch selhal', err);
  }
}
const patch = rafOnce(patchNow);

function patchTabBadges() {
  const badge = qs('#hdr-badge');
  if (!badge) return;
  let n = 0;
  try {
    // Stejný zdroj jako panel plateb, jinak zvonek hlásí jiné číslo, než
    // co se pod ním po klepnutí objeví — a svítí i u minulých měsíců.
    if (typeof dueList === 'function') {
      const d = dueList(state.activeYear, state.ui.month, state.settings.dueSoonDays);
      n = d.overdue.length + d.soon.length;
    } else {
      const due = computeDue(state.activeYear, state.ui.month, state.settings.dueSoonDays);
      n = due.overdue.length + due.soon.length;
    }
  } catch (e) { n = 0; }
  setText(badge, String(n));
  badge.hidden = n === 0;
}

/* ---------- pole s částkou ----------
   Smlouva, která chrání kurzor:
     focusin  -> input.value = holé číslo, span se schová (CSS)
     input    -> přečti, zapiš do modelu, přepočítej součty; do pole NESAHEJ
     focusout -> zapiš, přeformátuj pole i span
   Formátovaná podoba žije v sousedním <span class="amt-display">, ne v poli. */

function amtContext(input) {
  const row = input.closest('[data-id]');
  if (!row) return null;
  return { id: row.dataset.id, field: input.dataset.f, row };
}

function writeAmount(ctx, minorOrNull) {
  if (!ctx) return;
  const m = state.ui.month;
  if (ctx.field === 'plan') setPlanned(m, ctx.id, minorOrNull);
  else if (ctx.field === 'act') setActual(m, ctx.id, minorOrNull);
}

function onFocusIn(e) {
  const input = e.target.closest && e.target.closest('input.amt');
  if (!input) return;
  input.classList.remove('is-invalid');
  // Označit obsah, aby se dal rovnou přepsat. Nejdřív hned — Safari na iOS
  // to při klepnutí občas přebije, proto ještě jednou v dalším snímku, ALE
  // jen když se hodnota mezitím nezměnila. Bez té podmínky se označí právě
  // napsaná číslice a další stisk ji přepíše: z „1500" bylo „500".
  const puvodni = input.value;
  if (puvodni) {
    try { input.setSelectionRange(0, puvodni.length); } catch (_) {}
    requestAnimationFrame(function () {
      if (document.activeElement !== input) return;
      if (input.value !== puvodni) return;          // už píše, nesahat
      try { input.setSelectionRange(0, input.value.length); } catch (_) {}
    });
  }
}

function onInput(e) {
  const input = e.target.closest && e.target.closest('input.amt');
  if (!input) return;
  const ctx = amtContext(input);
  if (!ctx) return;
  const r = parseCzkInput(input.value);
  if (r.ok) {
    input.classList.remove('is-invalid');
    writeAmount(ctx, r.minor);
    patch();                       // jen dopočty, pole zůstává jak je
  } else {
    input.classList.add('is-invalid');
  }
}

function onFocusOut(e) {
  const input = e.target.closest && e.target.closest('input.amt');
  if (!input) return;
  const ctx = amtContext(input);
  const r = parseCzkInput(input.value);
  if (r.ok) {
    if (ctx) writeAmount(ctx, r.minor);
    input.value = r.minor === null ? '' : fmtEdit(r.minor);
    input.classList.remove('is-invalid');
    const disp = input.parentNode && input.parentNode.querySelector('.amt-display');
    setText(disp, r.minor === null ? '—' : formatCzk(r.minor));
  } else {
    // Neplatný vstup se NEPŘEVÁDÍ na nulu. Vrátíme poslední platnou hodnotu.
    input.classList.remove('is-invalid');
    const cur = currentAmountOf(ctx);
    input.value = cur === null ? '' : fmtEdit(cur);
    toast('Tohle číslo se nepodařilo přečíst, zůstala původní hodnota.');
  }
  flushSave();
  patch();
}

function currentAmountOf(ctx) {
  if (!ctx) return null;
  try {
    const en = getEntry(state.ui.month, ctx.id);
    if (!en) return null;
    return ctx.field === 'plan' ? (en.plan === undefined ? null : en.plan) : en.act;
  } catch (e) { return null; }
}

function onKeyDown(e) {
  if (e.key === 'Escape') { if (closeSheet) closeSheet(null); return; }
  const input = e.target.closest && e.target.closest('input.amt');
  if (!input) return;
  if (e.key === 'Enter') {
    e.preventDefault();
    const inputs = qsa('input.amt', qs('#main'));
    const i = inputs.indexOf(input);
    input.blur();
    if (i >= 0 && i + 1 < inputs.length) inputs[i + 1].focus({ preventScroll: false });
  }
}

/* ---------- kliknutí ---------- */

function onClick(e) {
  const node = e.target.closest && e.target.closest('[data-act]');
  if (!node) return;
  const act = node.dataset.act;
  const fn = ACTIONS[act];
  if (!fn) return;
  const ctx = {
    node,
    id: node.dataset.id || (node.closest('[data-id]') ? node.closest('[data-id]').dataset.id : null),
    m: node.dataset.m !== undefined ? Number(node.dataset.m) : null,
    sec: node.dataset.sec || (node.closest('[data-sec]') ? node.closest('[data-sec]').dataset.sec : null),
    val: node.dataset.val !== undefined ? node.dataset.val : null,
    screen: node.dataset.screen || null,
  };
  fn(ctx, e);
}

function onChange(e) {
  const node = e.target.closest && e.target.closest('[data-change]');
  if (!node) return;
  const fn = ACTIONS[node.dataset.change];
  if (fn) fn({ node, value: node.value, checked: node.checked }, e);
}

/* ---------- gesta ---------- */

function bindSwipe(el, onPrev, onNext) {
  let x0 = 0, y0 = 0, dx = 0, locked = null, pid = null;
  el.addEventListener('pointerdown', function (e) {
    if (e.target.closest('input, textarea, .sheet, .month-strip')) return;
    pid = e.pointerId; x0 = e.clientX; y0 = e.clientY; dx = 0; locked = null;
  }, { passive: true });
  el.addEventListener('pointermove', function (e) {
    if (e.pointerId !== pid) return;
    dx = e.clientX - x0;
    const dy = e.clientY - y0;
    if (locked === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
      locked = Math.abs(dx) > Math.abs(dy) * 1.7 ? 'x' : 'y';
    }
  }, { passive: true });
  const end = function (e) {
    if (e.pointerId !== pid) return;
    pid = null;
    if (locked === 'x' && Math.abs(dx) > 60) { (dx > 0 ? onPrev : onNext)(); }
    dx = 0; locked = null;
  };
  el.addEventListener('pointerup', end, { passive: true });
  el.addEventListener('pointercancel', function () { pid = null; dx = 0; locked = null; }, { passive: true });
}

/* ---------- navázání ---------- */

function bindGlobalEvents() {
  const app = qs('#app');
  app.addEventListener('click', onClick);
  app.addEventListener('input', onInput);
  app.addEventListener('change', onChange);
  app.addEventListener('focusin', onFocusIn);
  app.addEventListener('focusout', onFocusOut);
  app.addEventListener('keydown', onKeyDown);

  const main = qs('#main');
  if (main) bindSwipe(main, function () { goMonth(state.ui.month - 1); },
                            function () { goMonth(state.ui.month + 1); });

  // Tvrdý zápis. Tohle jsou tři události, které na iOS opravdu padnou,
  // když appka jde do pozadí. beforeunload se na iOS spolehnout nedá.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flushSave();
  });
  window.addEventListener('pagehide', flushSave);
  window.addEventListener('blur', flushSave);
  window.addEventListener('hashchange', function () {
    if (location.hash === '#test' && typeof selfTest === 'function') selfTest();
  });
}

/* ---------- základní akce ---------- */

Object.assign(ACTIONS, {

/* ---------- pruh měsíců ---------- */

function renderMonthStrip() {

// 61-sheets.js — spodní panely, hlášky, potvrzení — vlastní: L0
// Žádný prompt() ani confirm() — v appce na ploše se chovají nespolehlivě.

let _sheetStack = [];
let _lastFocus = null;

function trapFocus(root) {
  const sel = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
  root.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab') return;
    const items = qsa(sel, root).filter(function (n) { return !n.disabled && n.offsetParent !== null; });
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
}

// openSheet({title, build(bodyEl), foot:[{label, act, kind, onClick}], onClose})
// Vrací Promise, která se naplní tím, co předá closeSheet().
function openSheet(opts) {
  const host = qs('#sheet-host');
  const backdrop = qs('#sheet-backdrop');
  if (!host) return Promise.resolve(null);
  _lastFocus = document.activeElement;

  const sheet = tpl('tpl-sheet');
  setText(sheet.querySelector('[data-d="title"]'), opts.title || '');
  const body = sheet.querySelector('[data-d="body"]');
  const foot = sheet.querySelector('[data-d="foot"]');

  let resolveFn = null;
  const p = new Promise(function (res) { resolveFn = res; });

  if (typeof opts.build === 'function') opts.build(body, sheet);

  (opts.foot || []).forEach(function (b) {
    const btn = el('button', { class: 'btn ' + (b.kind ? 'btn-' + b.kind : 'btn-ghost') }, b.label);
    btn.addEventListener('click', function () {
      if (typeof b.onClick === 'function') { const r = b.onClick(body, sheet); if (r === false) return; closeSheet(r); }
      else closeSheet(b.value === undefined ? null : b.value);
    });
    foot.appendChild(btn);
  });
  if (!(opts.foot || []).length) foot.remove();

  host.replaceChildren(sheet);
  host.hidden = false;
  if (backdrop) backdrop.hidden = false;
  document.body.classList.add('has-sheet');
  trapFocus(sheet);
  _sheetStack.push({ sheet: sheet, resolve: resolveFn, onClose: opts.onClose });

  requestAnimationFrame(function () {
    sheet.classList.add('is-open');
    const first = sheet.querySelector('input, button:not(.sheet-close)');
    if (first && opts.autofocus !== false) { try { first.focus({ preventScroll: true }); } catch (e) {} }
  });
  return p;
}

function closeSheet(result) {
  const top = _sheetStack.pop();
  const host = qs('#sheet-host');
  const backdrop = qs('#sheet-backdrop');
  if (!top) { if (host) host.hidden = true; if (backdrop) backdrop.hidden = true; return; }
  top.sheet.classList.remove('is-open');
  document.body.classList.remove('has-sheet');
  if (host) { host.hidden = true; host.replaceChildren(); }
  if (backdrop) backdrop.hidden = true;
  if (typeof top.onClose === 'function') top.onClose(result);
  top.resolve(result);
  if (_lastFocus && _lastFocus.isConnected) { try { _lastFocus.focus({ preventScroll: true }); } catch (e) {} }
}

// Potvrzení. Destruktivní tlačítko nese sloveso, druhé je jen "Zpět".
function confirmSheet(o) {
  return openSheet({
    title: o.title,
    build: function (body) {
      body.appendChild(el('p', { class: 'sheet-text' }, o.body || ''));
      if (o.typeToConfirm) {
        const f = tpl('tpl-field');
        setText(f.querySelector('[data-d="label"]'), o.typeToConfirm);
        const inp = f.querySelector('input');
        inp.setAttribute('autocapitalize', 'characters');
        inp.dataset.f = 'confirm';
        body.appendChild(f);
      }
    },
    foot: [
      { label: TXT.cancel, kind: 'ghost', value: false },
      {
        label: o.okLabel || TXT.ok, kind: o.danger ? 'danger' : 'primary',
        onClick: function (body) {
          if (o.typeToConfirm) {
            const v = body.querySelector('[data-f="confirm"]');
            if (!v || v.value.trim().toUpperCase() !== (o.typeWord || 'SMAZAT')) {
              v && v.classList.add('is-invalid');
              return false;
            }
          }
          return true;
        }
      },
    ],
  });
}

// Textový nebo číselný vstup místo prompt().
function inputSheet(o) {
  return openSheet({
    title: o.title,
    build: function (body) {
      const f = tpl('tpl-field');
      setText(f.querySelector('[data-d="label"]'), o.label || '');
      setText(f.querySelector('[data-d="hint"]'), o.hint || '');
      const inp = f.querySelector('input');
      inp.dataset.f = 'value';
      inp.value = o.value === undefined || o.value === null ? '' : String(o.value);
      if (o.numeric) { inp.setAttribute('inputmode', 'decimal'); inp.setAttribute('enterkeyhint', 'done'); }
      if (o.placeholder) inp.setAttribute('placeholder', o.placeholder);
      body.appendChild(f);
    },
    foot: [
      { label: TXT.cancel, kind: 'ghost', value: null },
      {
        label: o.okLabel || TXT.save, kind: 'primary',
        onClick: function (body) {
          const v = body.querySelector('[data-f="value"]').value;
          if (o.numeric) {
            const r = parseCzkInput(v);
            if (!r.ok) { body.querySelector('[data-f="value"]').classList.add('is-invalid'); return false; }
            return r.minor;
          }
          const t = String(v).trim();
          if (o.required && !t) { body.querySelector('[data-f="value"]').classList.add('is-invalid'); return false; }
          return t;
        }
      },
    ],
  });
}

/* ---------- hlášky ---------- */

function toast(msg, o) {
  const host = qs('#toast-host');
  if (!host) return;
  const opts = o || {};
  const node = tpl('tpl-toast');
  setText(node.querySelector('[data-d="text"]'), msg);
  const act = node.querySelector('[data-d="action"]');
  if (opts.action) {
    setText(act, opts.action);
    act.hidden = false;
    node._onAction = opts.onAction || null;
  } else if (act) act.remove();
  if (opts.kind) node.classList.add('toast-' + opts.kind);
  host.appendChild(node);
  requestAnimationFrame(function () { node.classList.add('is-in'); });
  setTimeout(function () {
    node.classList.remove('is-in');
    setTimeout(function () { if (node.isConnected) node.remove(); }, 250);
  }, opts.ms || 4200);
  announce(msg);
}

function announce(msg) {
  const live = qs('#sr-live');
  if (live) setText(live, msg);
}

// Trvalý pruh nahoře. `id` zabrání zdvojení, `dismissible` povolí křížek.
function sheetBanner(o) {
  const host = qs('#banner-host');
  if (!host) return null;
  if (o.id && qs('[data-banner="' + o.id + '"]', host)) return null;
  const b = tpl('tpl-banner');
  if (o.id) b.dataset.banner = o.id;
  if (o.kind) b.classList.add('banner-' + o.kind);
  setText(b.querySelector('[data-d="icon"]'), o.icon || 'ℹ️');
  setText(b.querySelector('[data-d="title"]'), o.title || '');
  setText(b.querySelector('[data-d="body"]'), o.body || '');
  const act = b.querySelector('[data-d="action"]');
  if (o.action) { setText(act, o.action); act.dataset.act = o.act || ''; act.hidden = false; }
  const close = b.querySelector('.banner-close');
  if (o.dismissible && close) close.hidden = false;
  host.appendChild(b);
  return b;
}

function sheetBannerClear(id) {
  const n = qs('[data-banner="' + id + '"]');
  if (n) n.remove();
}

/* ======================= 50-month.js ======================= */
// 50-month.js — obrazovka Měsíc: KPI, splatnosti, sekce, řádky, grafy — vlastní: L7
//
// Dvě vrstvy, které se nesmí míchat:
//   render*  staví uzly z <template>. Jediné místo, kde vzniká nebo mizí DOM.
//   patch*   dopočítává. Smí zapsat jen textContent, style.width, classList,
//            aria-* a hidden — a NIKDY nesáhne na buňku, ve které stojí kurzor.
// Díky tomu přepočet součtů nikdy nerozhodí rozepsané číslo.
//
// Osm veřejných jmen podle _CONTRACT.md. Všechny pomocné funkce žijí
// v soukromém scope uvnitř IIFE, aby do sdíleného scope nic neuniklo.

let renderMonthScreen, renderSectionCard, renderRow;
let patchMonth, patchRow, patchTotals, patchAlertCard, patchOrphanCard;
const rowIndex = new Map();   // id POLOŽKY -> uzel .row

(function () {

  /* ======================= soukromé pomůcky ============================= */

  // Výchozí ikona nové položky podle sekce. Uživatelka si ji hned přepíše.
  const SEC_ICON = { income: '💰', fixed: '🏠', daily: '🛒', savings: '🐖', debt: '🏦', subs: '🔁' };
  const EMPTY_SEC = { plan: 0, act: 0, diff: 0, rows: [] };

  // computeMonth() je memoizované na state.rev, takže se smí volat často.
  // Kdyby přesto spadlo (rozbitá data), obrazovka se vykreslí s nulami
  // místo toho, aby zmizela celá.
  function md(y, m) {
    try {
      const d = computeMonth(y, m);
      if (d && d.sections) return d;
    } catch (e) { console.error('computeMonth selhal', e); }
    return { sections: {}, incomeTotal: 0, outflow: 0, balance: 0, leftPerDay: null, daysLeft: 0 };
  }
  // md.income je SEKCE (objekt), skalární součet příjmů se jmenuje incomeTotal.
  function incomeOf(data) {
    return Number.isSafeInteger(data.incomeTotal) ? data.incomeTotal : num(sec(data, 'income').act);
  }
  function sec(data, key) { return (data.sections && data.sections[key]) || EMPTY_SEC; }

  function isCurrentMonth(y, m) {
    const t = parseYmd(todayISO());
    return !!t && t.y === y && t.m === m;
  }

  // Součet deníku pro kategorii. Map<catId, haléře> je memoizovaná.
  function txSum(y, m, catId) {
    try {
      const v = txByCat(y, m).get(catId);
      return Number.isSafeInteger(v) ? v : 0;
    } catch (e) { return 0; }
  }

  // Splatnost řádku: entry.due (den 1–31) přebíjí cat.dueDay, 31. v únoru
  // ořízne dueDateFor() na poslední den měsíce.
  function dueIso(entry, cat, y, m) {
    const day = (entry.due !== null && entry.due !== undefined) ? entry.due : cat.dueDay;
    return Number.isInteger(day) ? dueDateFor(y, m, day) : null;
  }

  // 1 položka / 2–4 položky / 5+ položek
  function csItems(n) {
    if (n === 1) return '1 položka';
    if (n >= 2 && n <= 4) return n + ' položky';
    return n + ' položek';
  }

  // Sbalené sekce si pamatuje state.ui. Sanitizer v 32-storage.js cizí klíče
  // v ui nemaže, takže to přežije uložení i načtení.
  function collapsedMap() {
    if (!state.ui.secCollapsed || typeof state.ui.secCollapsed !== 'object') state.ui.secCollapsed = {};
    return state.ui.secCollapsed;
  }

  function goalOf(cat) {
    try {
      const list = computeGoals(state.activeYear);
      for (let i = 0; i < list.length; i++) if (list[i].id === cat.id) return list[i];
    } catch (e) {}
    return null;
  }

  /* ============================ struktura =============================== */

  renderMonthScreen = function renderMonthScreen() {
    const host = qs('#screen-month');
    if (!host) return;
    const y = state.activeYear, m = state.ui.month;
    const data = md(y, m);
    rowIndex.clear();

    const frag = document.createDocumentFragment();

    // 1) Tři dlaždice. Zůstatek je hrdina — přes celou šířku a větším písmem.
    const kpis = el('div', { class: 'card kpi-row' });
    kpis.appendChild(kpiTile('income', TXT.kpiIncome));
    kpis.appendChild(kpiTile('expense', TXT.kpiExpense));
    const hero = kpiTile('left', TXT.kpiLeft);
    hero.classList.add('kpi-hero');
    hero.style.gridColumn = '1 / -1';
    hero.querySelector('[data-d="value"]').style.fontSize = 'var(--fs-3xl)';
    kpis.appendChild(hero);
    frag.appendChild(kpis);

    // 2) Upozornění na splatnosti. Obsah i schování řeší patchAlertCard().
    frag.appendChild(tpl('tpl-alert-card'));

    // 2b) Nezařazené nákupy. Peníze, které se počítají do výdajů, ale nemají
    //     v tomhle měsíci řádek — musí být vidět tady, ne jen v deníku.
    const orph = tpl('tpl-alert-card');
    orph.dataset.kind = 'orphan';
    orph.dataset.act = 'nav';
    orph.dataset.screen = 'journal';
    orph.hidden = true;
    frag.appendChild(orph);

    // 3) Šest sekcí v pořadí ze SECTIONS.
    for (const s of SECTIONS) frag.appendChild(renderSectionCard(s, sec(data, s.key).rows));

    // 4) Grafy. Kreslí se až po zavěšení do stránky, jinak by chartMount()
    //    měřil nulovou šířku.
    const draws = chartCards(frag, y, m, data);

    // 5) Tisk / PDF
    const print = el('button', { class: 'btn btn-ghost', 'data-act': 'io.print' }, TXT.print);
    frag.appendChild(print);

    host.replaceChildren(frag);
    for (const fn of draws) { try { fn(); } catch (e) { console.error('graf selhal', e); } }
  };

  function kpiTile(key, label) {
    const k = tpl('tpl-kpi');
    k.dataset.kpi = key;
    setText(k.querySelector('[data-d="label"]'), label);
    return k;
  }

  renderSectionCard = function renderSectionCard(secDef, rows) {
    const card = tpl('tpl-section-card');
    card.dataset.sec = secDef.key;
    setText(card.querySelector('[data-d="title"]'), secDef.label);
    setText(card.querySelector('[data-d="addlabel"]'), secDef.addLabel);

    const off = !!collapsedMap()[secDef.key];
    card.classList.toggle('is-collapsed', off);
    setAttrIf(card.querySelector('.sec-toggle'), 'aria-expanded', off ? 'false' : 'true');

    const host = card.querySelector('[data-d="rows"]');
    const list = Array.isArray(rows) ? rows : [];
    if (!list.length) {
      const p = tpl('tpl-empty');          // kořen šablony sám nese data-d="text"
      setText(p, TXT.emptySection);
      host.appendChild(p);
    } else {
      for (const r of list) host.appendChild(renderRow(r.entry, r.cat, secDef));
    }
    return card;
  };

  renderRow = function renderRow(entry, cat, secDef) {
    const row = tpl('tpl-row');
    row.dataset.id = entry.id;             // POZOR: id POLOŽKY, ne kategorie
    setText(row.querySelector('[data-d="icon"]'), cat.icon || '•');
    setText(row.querySelector('[data-d="name"]'), cat.name);

    // Bez tohohle čte odečítač dvě bezejmenná textová pole za sebou.
    setText(row.querySelector('[data-d="a11yplan"]'), TXT.colPlan + ', ' + cat.name);
    setText(row.querySelector('[data-d="a11yact"]'), TXT.colActual + ', ' + cat.name);

    const planCell = row.querySelector('.cell-plan'), actCell = row.querySelector('.cell-act');
    planCell.querySelector('input.amt').value = fmtEdit(entry.plan);
    actCell.querySelector('input.amt').value = fmtEdit(entry.act);   // null = počítá se z deníku

    const sub = row.querySelector('[data-d="sub"]');
    const duePill = el('span', { class: 'pill', 'data-d': 'duepill', hidden: true });
    const paidPill = el('span', { class: 'pill is-pos', 'data-d': 'paidpill', hidden: true }, 'zaplaceno');
    const manual = el('span', { 'data-d': 'manual', hidden: true });
    sub.append(duePill, paidPill, manual);

    // Tlačítko „Použít deník" nesmí být uvnitř .row-main — to je samo <button>.
    // Dostane proto vlastní linku přes celou šířku řádku, jako pruh cíle.
    let jwrap = null;
    if (!secDef.hasDue) {
      jwrap = el('div', { class: 'row-goal', 'data-d': 'jwrap', hidden: true });
      jwrap.appendChild(el('button', { class: 'pill', 'data-act': 'row.useJournal' }, TXT.useJournal));
      row.appendChild(jwrap);
    }

    // Uzly si zapamatujeme, aby patchRow() nemusel ve smyčce hledat v DOMu.
    row._n = {
      planCell: planCell, actCell: actCell, jwrap: jwrap,
      planDisp: planCell.querySelector('.amt-display'), actDisp: actCell.querySelector('.amt-display'),
      paid: row.querySelector('.row-paid'), duePill: duePill, paidPill: paidPill, manual: manual,
      goalWrap: row.querySelector('[data-d="goalwrap"]'), goalBar: row.querySelector('[data-d="goalbar"]'),
      goalText: row.querySelector('[data-d="goaltext"]'),
    };
    rowIndex.set(entry.id, row);
    patchRow(entry, cat, secDef);           // texty, pilulky a stavy jen na jednom místě
    return row;
  };

  // Karty grafů. Vrací seznam funkcí, které se spustí až po zavěšení.
  function chartCards(frag, y, m, data) {
    const draws = [];
    // Když graf ještě neexistuje, karta se prostě nevyrobí — nic nespadne.
    const card = function (title, fn) {
      const c = tpl('tpl-chart-card');
      setText(c.querySelector('[data-d="title"]'), title);
      frag.appendChild(c);
      draws.push(function () { fn(c.querySelector('[data-d="host"]'), c.querySelector('[data-d="legend"]')); });
    };

    if (typeof chartBars === 'function') {
      const items = SECTIONS.map(function (s) {
        const v = sec(data, s.key);
        return { name: s.short, plan: num(v.plan), act: num(v.act) };
      });
      card('Plán a skutečnost', function (host) { chartBars(host, items, { title: 'Plán a skutečnost' }); });
    }

    // Výseče z 34-derived.js mají klíč `label`, grafy čtou `name`.
    let slices = [];
    try { slices = dailySlices(y, m) || []; } catch (e) { slices = []; }
    slices = slices.map(function (s) { return { name: s.label || s.name || '', value: num(s.value) }; });
    if (typeof chartPie === 'function' && slices.length) {
      card('Kam jdou každodenní výdaje', function (host, legend) {
        chartPie(host, slices, { title: 'Kam jdou každodenní výdaje', legend: legend });
      });
    }

    const sv = sec(data, 'savings');
    if (typeof chartDonut === 'function' && num(sv.plan) > 0) {
      card('Úspory tenhle měsíc', function (host) {
        chartDonut(host, { value: num(sv.act), max: num(sv.plan),
          title: 'Úspory tenhle měsíc', centerSub: formatCzk(num(sv.act)) });
      });
    }
    return draws;
  }

  /* ============================= dopočty ================================ */

  patchMonth = function patchMonth() {
    const screen = qs('#screen-month.is-active');
    if (!screen) return;
    const y = state.activeYear, m = state.ui.month;
    const data = md(y, m);

    const setKpi = function (key, value, hint) {
      const k = screen.querySelector('.kpi[data-kpi="' + key + '"]');
      if (!k) return null;
      setText(k.querySelector('[data-d="value"]'), value);
      setText(k.querySelector('[data-d="hint"]'), hint || '');
      return k;
    };

    setKpi('income', formatCzkRound(incomeOf(data)), '');
    setKpi('expense', formatCzkRound(num(data.outflow)), '');

    // Hrdina: znaménko slovy i barvou. Nápověda jen v běžícím měsíci —
    // „na den do konce měsíce" u dubna v září nedává smysl.
    // Poškozený zůstatek se NEPŘEVÁDÍ na nulu — formatCzk z něj udělá
    // pomlčku. Zelená nula by tvrdila, že je všechno v pořádku, i když není.
    const balOk = Number.isSafeInteger(data.balance);
    const bal = balOk ? data.balance : NaN;
    let hint = '';
    if (isCurrentMonth(y, m) && Number.isSafeInteger(data.leftPerDay)) {
      hint = formatCzkRound(data.leftPerDay) + ' ' + TXT.kpiLeftHint;
    }
    const hero = setKpi('left', formatSignedRound(bal), hint);
    if (hero) {
      const v = hero.querySelector('[data-d="value"]');
      v.classList.toggle('is-pos', bal >= 0);
      v.classList.toggle('is-neg', bal < 0);
    }

    patchAlertCard();
    patchOrphanCard(data);
    patchTotals();

    // Řádky se hledají v rowIndexu, ne v DOMu.
    for (const s of SECTIONS) {
      const rows = sec(data, s.key).rows;
      for (let i = 0; i < rows.length; i++) patchRow(rows[i].entry, rows[i].cat, s);
    }
  };

  patchTotals = function patchTotals() {
    const screen = qs('#screen-month.is-active');
    if (!screen) return;
    const data = md(state.activeYear, state.ui.month);

    // Společné měřítko, ať jsou proužky mezi sekcemi porovnatelné.
    let peak = 0;
    for (const s of SECTIONS) {
      const v = sec(data, s.key);
      peak = Math.max(peak, num(v.plan), num(v.act));
    }

    for (const s of SECTIONS) {
      const card = screen.querySelector('.sec-card[data-sec="' + s.key + '"]');
      if (!card) continue;
      const v = sec(data, s.key);
      const plan = num(v.plan), act = num(v.act);
      setText(card.querySelector('.sec-sums [data-d="plan"]'), formatCzk(plan));
      setText(card.querySelector('.sec-sums [data-d="act"]'), formatCzk(act));

      // U výdajů je „méně, než bylo v plánu" dobrá zpráva, proto obrácené znaménko.
      const diffVal = s.dir > 0 ? act - plan : plan - act;
      const diff = card.querySelector('.sec-sums [data-d="diff"]');
      setText(diff, formatSigned(diffVal));
      diff.classList.toggle('is-pos', diffVal > 0);
      diff.classList.toggle('is-neg', diffVal < 0);

      setBarWidth(card.querySelector('[data-d="barplan"]'), pct(plan, peak) || 0);
      const bar = card.querySelector('[data-d="baract"]');
      setBarWidth(bar, pct(act, peak) || 0);
      // Bez zadaného plánu není co přečerpat — červený pruh by lhal.
      bar.classList.toggle('is-over', s.dir < 0 && plan > 0 && act > plan);
    }
  };

  patchOrphanCard = function patchOrphanCard(data) {
    const node = qs('#screen-month [data-kind="orphan"]');
    if (!node) return;
    const total = (data && data.orphans && Number.isSafeInteger(data.orphans.total)) ? data.orphans.total : 0;
    const pocet = (data && data.orphans && data.orphans.count) | 0;
    if (!total) { node.hidden = true; return; }
    node.hidden = false;
    setText(node.querySelector('[data-d="title"]'), 'Nezařazené výdaje: ' + formatCzk(total));
    setText(node.querySelector('[data-d="sub"]'),
      pocet ? (pocet === 1 ? '1 nákup nemá v tomhle měsíci svůj řádek'
                           : pocet + ' nákupů nemá v tomhle měsíci svůj řádek')
            : 'Částka u smazané kategorie');
    node.classList.add('is-warn');
  };

  patchAlertCard = function patchAlertCard() {
    const screen = qs('#screen-month.is-active');
    if (!screen) return;
    const card = screen.querySelector('.alert-card');
    if (!card) return;

    let due = null;
    try { due = computeDue(state.activeYear, state.ui.month, state.settings.dueSoonDays); } catch (e) { due = null; }
    const n = due ? due.count : 0;
    card.hidden = n === 0;
    if (!n) return;

    const overdue = due.overdue.length;
    setText(card.querySelector('[data-d="title"]'),
      'Do zaplacení: ' + csItems(n) + ' · ' + formatCzk(due.total));
    setText(card.querySelector('[data-d="sub"]'), overdue
      ? (csItems(overdue) + (overdue === 1 ? ' je po splatnosti' : ' jsou po splatnosti'))
      : 'Klepni a odškrtej, co je zaplacené');
    card.classList.toggle('is-overdue', overdue > 0);
  };

  patchRow = function patchRow(entry, cat, secDef) {
    const row = rowIndex.get(entry && entry.id);
    const n = row && row._n;
    if (!n) return;
    const y = state.activeYear, m = state.ui.month;
    const focused = document.activeElement;

    // Buňku s kurzorem přeskakujeme — tohle jediné pravidlo chrání
    // rozepsané číslo před přepsáním uprostřed psaní.
    if (!n.planCell.contains(focused)) {
      setText(n.planDisp, entry.plan === null || entry.plan === undefined ? '—' : formatCzk(entry.plan));
    }

    const manual = entry.act !== null && entry.act !== undefined;
    const fromTx = txSum(y, m, cat.id);
    if (!n.actCell.contains(focused)) {
      const eff = effActual(entry, txByCat(y, m));
      setText(n.actDisp, (!manual && fromTx === 0) ? '—' : formatCzk(eff));
      n.actDisp.classList.toggle('is-auto', !manual);   // dopočítané číslo je kurzívou
    }

    n.paid.hidden = !secDef.hasDue;
    if (secDef.hasDue) setAttrIf(n.paid, 'aria-pressed', entry.paid ? 'true' : 'false');

    // Druhý řádek. Priorita: splatnost > „ručně, ale v deníku něco je" > nic.
    if (secDef.hasDue) {
      const iso = dueIso(entry, cat, y, m);
      const days = iso ? daysUntil(iso) : null;
      n.duePill.hidden = !iso;
      if (iso) {
        setText(n.duePill, fmtDateShort(iso) + ' · ' + relDaysCs(days));
        const soon = num(state.settings.dueSoonDays);
        n.duePill.classList.toggle('is-neg', !entry.paid && days !== null && days < 0);
        n.duePill.classList.toggle('is-warn', !entry.paid && days !== null && days >= 0 && days <= soon);
        n.duePill.classList.toggle('is-muted', !!entry.paid);
      }
      n.paidPill.hidden = !entry.paid;
      n.manual.hidden = true;
    } else {
      n.duePill.hidden = true;
      n.paidPill.hidden = true;
      const show = manual && fromTx !== 0;
      n.manual.hidden = !show;
      if (show) setText(n.manual, TXT.manualBadge + ' · z deníku ' + formatCzk(fromTx));
      if (n.jwrap) n.jwrap.hidden = !show;
    }

    // Pruh spořicího cíle.
    const hasGoal = !!(secDef.hasGoal && cat.goal);
    n.goalWrap.hidden = !hasGoal;
    if (hasGoal) {
      const g = goalOf(cat);
      const saved = g ? num(g.saved) : 0;
      const target = g ? num(g.target) : num(cat.goal.target);
      const ratio = pct(saved, target);
      setBarWidth(n.goalBar, ratio === null ? 0 : ratio);
      n.goalBar.classList.toggle('is-warn', !!(g && g.late));
      setText(n.goalText, formatCzk(saved) + ' z ' + formatCzk(target));
    }
  };

  /* ============================== akce ================================== */

  // Tři možnosti místo zaškrtávátka: ptáme se česky a bez žargonu.
  // Výchozí je celý rok — opakující se náklad je ten častější případ.
  function askScope(title, okLabel) {
    return openSheet({
      title: title,
      build: function (body) {
        body.appendChild(el('p', { class: 'sheet-text' }, 'Na které měsíce to má platit?'));
        const add = function (label, value, kind) {
          const b = el('button', { class: 'btn ' + kind }, label);
          b.addEventListener('click', function () { closeSheet(value); });
          body.appendChild(b);
        };
        add((okLabel ? okLabel + ' — ' : '') + 'celý rok', 'all', 'btn-primary');
        add((okLabel ? okLabel + ' — ' : '') + 'od tohoto měsíce dál', 'rest', 'btn-ghost');
        add((okLabel ? okLabel + ' — ' : '') + 'jen tento měsíc', 'this', 'btn-ghost');
      },
      foot: [{ label: TXT.cancel, kind: 'ghost', value: null }],
    });
  }

  // Nákupy z deníku v dané kategorii a měsíci — jen na čtení.
  function txListFor(cat, m) {
    const wrap = el('div', { class: 'tx-day-list' });
    let yr = null;
    try { yr = getYear(); } catch (e) { yr = null; }
    const list = (yr && yr.tx) ? yr.tx.filter(function (t) { return !t.del && t.m === m && t.cat === cat.id; }) : [];
    if (!list.length) return null;
    list.sort(function (a, b) { return a.d < b.d ? 1 : (a.d > b.d ? -1 : 0); });
    for (const t of list) {
      const node = tpl('tpl-tx-item');
      node.removeAttribute('data-act');       // uvnitř sheetu se nikam neproklikává
      node.dataset.id = t.id;
      setText(node.querySelector('[data-d="icon"]'), cat.icon || '•');
      setText(node.querySelector('[data-d="name"]'), fmtDateShort(t.d));
      setText(node.querySelector('[data-d="note"]'), t.note || '');
      setText(node.querySelector('[data-d="amt"]'), formatCzk(t.amt));
      wrap.appendChild(node);
    }
    return wrap;
  }

  function field(body, label, value, hint, mode) {
    const f = tpl('tpl-field');
    setText(f.querySelector('[data-d="label"]'), label);
    setText(f.querySelector('[data-d="hint"]'), hint || '');
    const i = f.querySelector('input');
    i.value = value === null || value === undefined ? '' : String(value);
    if (mode) i.setAttribute('inputmode', mode);
    body.appendChild(f);
    return i;
  }

  // "15" -> 15, prázdno -> null. Nikdy Number() na uživatelský vstup jinde.
  function dayFromText(raw) {
    const s = String(raw === null || raw === undefined ? '' : raw).trim();
    if (!/^\d{1,2}$/.test(s)) return null;
    const d = parseInt(s, 10);
    return d >= 1 && d <= 31 ? d : null;
  }

  function openRowSheet(entryId) {
    const m = state.ui.month;
    const entry = getEntry(m, entryId);
    const cat = entry ? getCat(entry.cat) : null;
    if (!entry || !cat) return;
    const secDef = SECTION_BY_KEY[cat.sec] || SECTIONS[0];
    let fName = null, fIcon = null, fDue = null, fNote = null, fTarget = null, fStart = null, fDate = null;

    openSheet({
      title: cat.name,
      build: function (body) {
        fName = field(body, 'Název', cat.name);
        fIcon = field(body, 'Ikona', cat.icon, 'Jeden emoji.');
        if (secDef.hasDue) {
          fDue = field(body, TXT.colDue, cat.dueDay,
            'Den v měsíci, 1 až 31. V kratším měsíci se posune na poslední den.', 'numeric');
        }
        fNote = field(body, 'Poznámka', cat.note, 'Nepovinné, jen pro tebe.');
        if (secDef.hasGoal) {
          const g = cat.goal || {};
          fTarget = field(body, 'Cíl', g.target ? fmtEdit(g.target) : '', 'Kolik chceš mít dohromady.', 'decimal');
          fStart = field(body, 'Už naspořeno před lednem', g.startBalance ? fmtEdit(g.startBalance) : '', '', 'decimal');
          fDate = field(body, 'Do kdy', g.targetDate, 'Ve tvaru 2026-12-31.');
        }
        const txs = txListFor(cat, m);
        if (txs) {
          body.appendChild(el('p', { class: 'field-label' }, 'Nákupy v tomhle měsíci'));
          body.appendChild(txs);
        }
      },
      foot: [
        { label: TXT.del, kind: 'danger', value: 'del' },
        { label: TXT.save, kind: 'primary', value: 'save' },
      ],
    }).then(function (res) {
      if (res === 'del') {
        askScope('Smazat „' + cat.name + '"?', 'Smazat').then(function (scope) {
          if (!scope) return;
          removeEntry(m, entry.id, scope);
          renderApp();
          toast('Smazáno: ' + cat.name, {
            action: TXT.undo,
            onAction: function () { undoLast(); renderApp(); },
          });
        });
        return;
      }
      if (res !== 'save') return;

      updateCatalogItem(cat.id, {
        name: fName.value,
        icon: fIcon.value.trim(),
        dueDay: fDue ? dayFromText(fDue.value) : undefined,
      });
      // Katalog pole pro poznámku nemá a updateCatalogItem() ho neumí zapsat.
      // Píšeme ho proto přímo a necháme bump() zvednout revizi; sanitizer
      // v 32-storage.js cizí klíče nemaže, takže poznámka přežije uložení.
      const note = String(fNote.value || '').trim();
      if (note !== String(cat.note || '')) { cat.note = note; bump(cat); }

      if (secDef.hasGoal) {
        const t = parseCzkInput(fTarget.value);
        const s = parseCzkInput(fStart.value);
        const d = String(fDate.value || '').trim();
        if (t.ok && t.minor) {
          setGoal(cat.id, {
            target: t.minor,
            startBalance: (s.ok && s.minor) ? s.minor : 0,
            targetDate: parseYmd(d) ? d : null,
          });
        } else if (t.ok && t.minor === null) {
          setGoal(cat.id, null);
        }
      }
      renderApp();
      toast(TXT.saved);
    });
  }

  // ACTIONS žije v 60-events.js, které se slepuje AŽ ZA tímhle souborem.
  // Přímé Object.assign(ACTIONS, …) na úrovni souboru by spadlo do dočasné
  // mrtvé zóny `const ACTIONS`. Odložíme to o jeden mikroúkol — pořád je to
  // dávno před prvním klepnutím.
  Promise.resolve().then(function () {
    Object.assign(ACTIONS, {

      'row.add': function (ctx) {
        const secDef = SECTION_BY_KEY[ctx.sec];
        if (!secDef) return;
        inputSheet({
          title: secDef.addLabel, label: 'Název položky', required: true,
          placeholder: secDef.hint || 'Třeba Nájem', okLabel: 'Pokračovat',
        }).then(function (name) {
          if (!name) return;
          askScope('Jak často „' + name + '" ' + (secDef.verb || 'platíš') + '?', '').then(function (scope) {
            if (!scope) return;
            addCatalogItem({ sec: secDef.key, name: name, icon: SEC_ICON[secDef.key] || '•' }, scope);
            renderApp();
            toast('Přidáno: ' + name, {
              action: TXT.undo,
              onAction: function () { undoLast(); renderApp(); },
            });
          });
        });
      },

      'row.open': function (ctx) { if (ctx.id) openRowSheet(ctx.id); },

      'row.paid': function (ctx) {
        const m = state.ui.month;
        const entry = getEntry(m, ctx.id);
        if (!entry) return;
        const was = !!entry.paid;
        togglePaid(m, ctx.id, !was);
        renderApp();                         // autofill mohl přepsat i pole skutečnosti
        toast(was ? 'Zaplacení zrušeno' : 'Zaplaceno', {
          action: TXT.undo,
          onAction: function () { togglePaid(m, ctx.id, was); renderApp(); },
        });
      },

      'row.useJournal': function (ctx) {
        const m = state.ui.month;
        const entry = getEntry(m, ctx.id);
        if (!entry) return;
        const was = entry.act;
        clearActual(m, ctx.id);
        renderApp();
        toast('Skutečnost se počítá z deníku.', {
          action: TXT.undo,
          onAction: function () { setActual(m, ctx.id, was); renderApp(); },
        });
      },

      'sec.toggle': function (ctx) {
        const card = ctx.node.closest('.sec-card');
        if (!card) return;
        const map = collapsedMap();
        const off = !map[card.dataset.sec];
        map[card.dataset.sec] = off;
        card.classList.toggle('is-collapsed', off);
        setAttrIf(ctx.node, 'aria-expanded', off ? 'false' : 'true');
        scheduleSave();
      },

    });
  });

})();

/* ======================= 51-journal.js ======================= */
// 51-journal.js — deník nákupů: rychlý zápis, filtr, seskupení po dnech — vlastní: L8
// Kvůli tomuhle appka poráží tabulku: místo odhadu měsíční sumy se každý
// nákup zapíše a součet kategorie se dopočítá sám.
//
// Fragment smí zabrat jen sedm jmen (viz _CONTRACT.md) a tady jsou všechna.
// Soukromí pomocníci proto visí na renderJournalScreen jako vlastnosti —
// nezakládají ve sdíleném scope nové jméno. Deklarace funkcí se vytahují
// nahoru, takže tenhle zápis smí stát před nimi.
renderJournalScreen.h = {

  cap: 200,   // kolik řádků najednou; zbytek přes „Načíst starší“

  // Aktivní rok z modelu, se záložní cestou přímo do state, aby deník
  // nespadl, dokud datová vrstva ještě není hotová.
  year: function () {
    try { const y = getYear(state.activeYear); if (y) return y; } catch (e) {}
    try { return state.years[String(state.activeYear)] || null; } catch (e) { return null; }
  },

  // Katalogová položka, nebo null.
  cat: function (id) {
    try { return id ? (getCat(id) || null) : null; } catch (e) { return null; }
  },

  // „Nezařazeno“ musí být přesně ta množina, kterou zná 34-derived.js:
  // nákup, který se nepromítá do žádného řádku měsíce (kategorie smazaná,
  // archivovaná, nebo řádek v tom měsíci prostě není). Kdyby deník počítal
  // jinak, ukazoval by peníze v koši, který na obrazovce Měsíc nikde není.
  orphanSet: function (m) {
    const key = state.rev + ':' + state.activeYear + ':' + m;
    if (this._oKey !== key) {
      const s = new Set();
      try { for (const t of orphanTx(state.activeYear, m)) s.add(t.id); }
      catch (e) { return null; }
      this._oKey = key; this._oSet = s;
    }
    return this._oSet;
  },
  isOrphan: function (t) {
    const s = this.orphanSet(t.m);
    return s ? s.has(t.id) : !this.cat(t.cat);
  },

  // Nabídka kategorií: bez archivovaných, po sekcích.
  catalogList: function () {
    const yr = this.year();
    const out = ((yr && Array.isArray(yr.catalog)) ? yr.catalog : [])
      .filter(function (c) { return c && c.id && !c.archived; });
    const rank = function (k) { return SECTIONS.findIndex(function (s) { return s.key === k; }); };
    out.sort(function (a, b) {
      return (rank(a.sec) - rank(b.sec)) || (num(a.order) - num(b.order)) || cmpCs(a.name, b.name);
    });
    return out;
  },

  // Bez diakritiky a malými písmeny — „jidlo“ musí najít „Jídlo“.
  norm: function (s) {
    return String(s === null || s === undefined ? '' : s)
      .normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  },

  // Nesmazané nákupy aktivního roku v rozpočtovém měsíci m.
  // Filtruje se na tx.m, NE na tx.d: nákup z 1. února, který patří do ledna,
  // musí zůstat v lednu.
  monthTx: function (m) {
    const yr = this.year();
    return ((yr && Array.isArray(yr.tx)) ? yr.tx : [])
      .filter(function (t) { return t && !t.del && t.m === m; });
  },

  // Stav filtru a hledání ze state.ui.
  ui: function () {
    const f = typeof state.ui.journalFilter === 'string' ? state.ui.journalFilter : 'all';
    const raw = typeof state.ui.journalSearch === 'string' ? state.ui.journalSearch : '';
    const q = this.norm(raw.trim());
    return { filter: f, raw: raw, q: q, on: f !== 'all' || q !== '' };
  },

  // Projde nákup filtrem a hledáním?
  match: function (t, filter, q) {
    const c = this.cat(t.cat);
    const orphan = this.isOrphan(t);
    if (filter === '__none') { if (!orphan) return false; }
    else if (filter !== 'all' && (orphan || !c || c.id !== filter)) return false;
    if (!q) return true;
    return this.norm((c ? c.name : 'Nezařazeno') + ' ' + (t.note || '')).indexOf(q) >= 0;
  },

  label: function (c) { return c ? ((c.icon ? c.icon + ' ' : '') + c.name) : 'Nezařazeno'; },

  chip: function (val, label, act) {
    const n = tpl('tpl-chip');
    n.setAttribute('type', 'button');
    n.dataset.val = val;
    if (act) n.dataset.act = act; else n.removeAttribute('data-act');
    setText(n.querySelector('[data-d="label"]'), label);
    return n;
  },

  // Vodorovný pás, ve kterém chipy nezalomí řádek.
  strip: function (attrs) {
    const a = attrs || {};
    a.style = 'display:flex;gap:var(--sp-2);overflow-x:auto;overscroll-behavior-x:contain;'
      + 'padding-block:2px;scrollbar-width:none';
    return el('div', a);
  },

  // Rozbalovací seznam všech kategorií, seskupený po sekcích.
  catSelect: function (cats, withNone) {
    const sel = el('select', { class: 'field-input' });
    sel.dataset.f = 'cat';
    if (withNone) sel.appendChild(el('option', { value: '' }, 'Nezařazeno'));
    for (const s of SECTIONS) {
      const inSec = cats.filter(function (c) { return c.sec === s.key; });
      if (!inSec.length) continue;
      const og = el('optgroup', { label: s.short });
      for (const c of inSec) og.appendChild(el('option', { value: c.id }, this.label(c)));
      sel.appendChild(og);
    }
    return sel;
  },

  // Pole z tpl-field s nastavenými atributy.
  field: function (label, name, attrs) {
    const f = tpl('tpl-field');
    setText(f.querySelector('[data-d="label"]'), label);
    const i = f.querySelector('input');
    i.dataset.f = name;
    for (const k in (attrs || {})) i.setAttribute(k, attrs[k]);
    return f;
  },

  // Chybová hláška u pole. Prázdná zpráva stav uklidí.
  mark: function (input, msg) {
    const field = input ? input.closest('.field') : null;
    if (field) field.classList.toggle('is-error', !!msg);
    if (field) setText(field.querySelector('.field-hint'), msg || '');
    if (msg) { announce(msg); try { input.focus({ preventScroll: true }); } catch (e) {} }
    return null;
  },
};

/* ======================= obrazovka Deník ============================== */

// Strukturální vykreslení. Skořápka (hlavička, filtr, hledání, hostitel
// seznamu) vzniká jen tady; seznam plní applyJournalFilter, aby psaní do
// hledání nezničilo pole, ve kterém je kurzor.
function renderJournalScreen() {
  const host = qs('#screen-journal');
  if (!host) return;
  const H = renderJournalScreen.h;
  const m = state.ui.month;

  // Strop řádků platí pro jeden měsíc; po přepnutí se vrací na základ.
  const stamp = state.activeYear + '-' + m;
  if (host.dataset.limitFor !== stamp) {
    host.dataset.limitFor = stamp;
    host.dataset.limit = String(H.cap);
  }
  const frag = document.createDocumentFragment();

  // --- hlavička: kolik a kolikrát ---
  const head = el('section', { class: 'card' });
  for (const k of [['Utraceno v deníku', 'jrn-total'], ['Zápisů', 'jrn-count']]) {
    const kpi = tpl('tpl-kpi');
    setText(kpi.querySelector('[data-d="label"]'), k[0]);
    kpi.querySelector('[data-d="value"]').id = k[1];
    kpi.querySelector('[data-d="hint"]').id = k[1] + '-hint';
    head.appendChild(kpi);
  }
  frag.appendChild(head);

  // --- filtr: Vše + kategorie se zápisem + Nezařazeno, když jsou sirotci ---
  const bar = H.strip({ id: 'jrn-filters', role: 'group', 'aria-label': 'Filtr kategorií' });
  const buckets = new Map();
  for (const t of H.monthTx(m)) {
    const c = H.cat(t.cat);
    const orphan = H.isOrphan(t) || !c;
    const key = orphan ? '__none' : c.id;
    const cur = buckets.get(key) || { sum: 0, label: orphan ? 'Nezařazeno' : H.label(c) };
    cur.sum += Number.isSafeInteger(t.amt) ? t.amt : 0;
    buckets.set(key, cur);
  }
  bar.appendChild(H.chip('all', 'Vše', 'journal.filter'));
  const keys = Array.from(buckets.keys()).filter(function (k) { return k !== '__none'; });
  keys.sort(function (a, b) {
    return (buckets.get(b).sum - buckets.get(a).sum)
      || cmpCs(buckets.get(a).label, buckets.get(b).label);
  });
  for (const k of keys) bar.appendChild(H.chip(k, buckets.get(k).label, 'journal.filter'));
  // Osiřelé nákupy musí být vidět, jinak by se po smazání kategorie ztratily
  // z filtru a součet košů by přestal sedět na celek měsíce.
  if (buckets.has('__none')) bar.appendChild(H.chip('__none', 'Nezařazeno', 'journal.filter'));
  frag.appendChild(bar);

  // --- hledání v poznámce a v názvu kategorie ---
  const fs = H.field('Hledat', '', { type: 'search', enterkeyhint: 'search',
    autocorrect: 'off', autocapitalize: 'off', spellcheck: 'false',
    placeholder: 'Hledat v poznámce nebo kategorii' });
  fs.querySelector('[data-d="label"]').classList.add('sr-only');
  fs.querySelector('[data-d="hint"]').remove();
  const search = fs.querySelector('input');
  search.id = 'jrn-search';
  search.removeAttribute('data-f');
  search.value = H.ui().raw;
  search.addEventListener('input', function () {
    state.ui.journalSearch = search.value;
    applyJournalFilter();
  });
  frag.appendChild(fs);

  frag.appendChild(el('div', { id: 'jrn-list' }));
  const more = el('button', { class: 'btn', id: 'jrn-more', type: 'button',
    dataset: { act: 'journal.more' } }, 'Načíst starší');
  more.hidden = true;
  frag.appendChild(more);

  host.replaceChildren(frag);
  applyJournalFilter();
}

// Jeden řádek nákupu. Poznámka jde přes textContent, takže „<script>“
// skončí na obrazovce jako text a ne jako značka.
function renderTxItem(tx) {
  const H = renderJournalScreen.h;
  const node = tpl('tpl-tx-item');
  const c = H.cat(tx.cat);
  const orphan = H.isOrphan(tx);
  const name = c ? c.name : 'Nezařazeno';
  node.dataset.id = tx.id;
  node.setAttribute('type', 'button');
  setText(node.querySelector('[data-d="icon"]'), (c && c.icon) ? c.icon : '🧾');
  const nameNode = node.querySelector('[data-d="name"]');
  setText(nameNode, name);
  if (orphan) nameNode.classList.add('is-muted');
  // Nákup mimo řádky měsíce se nesmí tvářit, že se někam počítá.
  setText(node.querySelector('[data-d="note"]'),
    (tx.note || '') + (orphan ? ((tx.note ? ' · ' : '') + 'není v rozpočtu měsíce') : ''));
  setText(node.querySelector('[data-d="amt"]'), formatCzk(tx.amt));
  node.setAttribute('aria-label',
    name + ', ' + formatCzk(tx.amt) + ', ' + fmtDateShort(tx.d) + ', upravit');
  return node;
}

// Seskupení po dnech: nejnovější den nahoře, každý den má mezisoučet.
function txDayGroups(list) {
  const map = new Map();
  for (const t of (list || [])) {
    if (!t || typeof t.d !== 'string') continue;
    let g = map.get(t.d);
    if (!g) { g = { d: t.d, label: '', sum: 0, items: [] }; map.set(t.d, g); }
    g.items.push(t);
    g.sum += Number.isSafeInteger(t.amt) ? t.amt : 0;
  }
  const out = Array.from(map.values());
  // YYYY-MM-DD se porovná jako řetězec. Žádný Date, žádné UTC.
  out.sort(function (a, b) { return a.d < b.d ? 1 : (a.d > b.d ? -1 : 0); });
  const dnes = todayISO();
  for (const g of out) {
    g.items.sort(function (x, y) {
      const ax = String(x.updatedAt || ''), ay = String(y.updatedAt || '');
      return ax !== ay ? (ax < ay ? 1 : -1) : String(y.id).localeCompare(String(x.id));
    });
    const dd = daysBetween(g.d, dnes);
    if (dd === 0) g.label = 'Dnes';
    else if (dd === 1) g.label = 'Včera';
    else {
      // fmtDateLong dá „8. září 2026“; v deníku jednoho roku se rok neopakuje.
      const p = parseYmd(g.d), s = fmtDateLong(g.d), tail = p ? ' ' + p.y : '';
      g.label = (tail && s.slice(-tail.length) === tail) ? s.slice(0, s.length - tail.length) : s;
    }
  }
  return out;
}

// n naposledy použitých kategorií, nejčerstvější první.
function recentCats(n) {
  const H = renderJournalScreen.h;
  const yr = H.year();
  const src = (yr && Array.isArray(yr.tx)) ? yr.tx : [];
  const rows = [];
  for (let i = 0; i < src.length; i++) {
    const t = src[i];
    if (t && !t.del && t.cat) rows.push({ i: i, at: String(t.updatedAt || ''), cat: t.cat });
  }
  rows.sort(function (a, b) { return a.at !== b.at ? (a.at < b.at ? 1 : -1) : b.i - a.i; });
  const want = Number.isFinite(n) && n > 0 ? Math.round(n) : 5;
  const out = [];
  for (const r of rows) {
    if (out.indexOf(r.cat) >= 0) continue;
    const c = H.cat(r.cat);
    if (!c || c.archived) continue;      // smazanou ani archivovanou nenabízíme
    out.push(r.cat);
    if (out.length >= want) break;
  }
  return out;
}

// Přefiltruje a znovu naplní JEN seznam. Skořápka i pole hledání zůstávají
// stát, takže kurzor ani rozepsaný text nikam nezmizí.
function applyJournalFilter() {
  const host = qs('#screen-journal');
  const listHost = host ? qs('#jrn-list', host) : null;
  if (!listHost) return;
  const H = renderJournalScreen.h;
  const u = H.ui();
  const hit = H.monthTx(state.ui.month).filter(function (t) { return H.match(t, u.filter, u.q); });

  const limit = Math.max(H.cap, Number(host.dataset.limit) || H.cap);
  const frag = document.createDocumentFragment();
  let shown = 0;
  for (const g of txDayGroups(hit)) {
    if (shown >= limit) break;           // strop se počítá po celých dnech
    const day = tpl('tpl-tx-day');
    setText(day.querySelector('[data-d="label"]'), g.label);
    setText(day.querySelector('[data-d="sum"]'), formatCzk(g.sum));
    const dl = day.querySelector('[data-d="list"]');
    for (const t of g.items) { dl.appendChild(renderTxItem(t)); shown += 1; }
    frag.appendChild(day);
  }

  if (!hit.length) {
    const e = tpl('tpl-empty');
    setText(e.querySelector('[data-d="text"]'),
      u.on ? 'Nic takového tu není. Zkus jiné slovo nebo dej Vše.' : TXT.emptyJournal);
    listHost.replaceChildren(e);
    listHost.classList.remove('card');
  } else {
    listHost.replaceChildren(frag);
    listHost.classList.add('card');
  }
  host.dataset.shown = String(shown);
  host.dataset.hits = String(hit.length);

  const more = qs('#jrn-more', host);
  if (more) {
    const rest = hit.length - shown;
    more.hidden = rest <= 0;
    setText(more, rest > 0 ? 'Načíst starší (zbývá ' + rest + ')' : 'Načíst starší');
  }
  patchJournal();
}

// Dopočtová vrstva: jen textContent, classList a aria-*. Nesahá na žádný
// input, takže nemůže vyhodit kurzor z pole hledání.
function patchJournal() {
  const host = qs('#screen-journal.is-active');
  if (!host) return;
  const H = renderJournalScreen.h;
  const u = H.ui();
  let total = 0, n = 0, ftotal = 0, fn = 0;
  for (const t of H.monthTx(state.ui.month)) {
    const a = Number.isSafeInteger(t.amt) ? t.amt : 0;
    total += a; n += 1;
    if (H.match(t, u.filter, u.q)) { ftotal += a; fn += 1; }
  }
  setText(qs('#jrn-total', host), formatCzk(u.on ? ftotal : total));
  setText(qs('#jrn-total-hint', host), u.on ? 'z ' + formatCzk(total) + ' za měsíc' : '');
  setText(qs('#jrn-count', host), String(u.on ? fn : n));

  // Když se seznam ořízl, musí to být vidět — mlčky se nekrátí.
  const shown = Number(host.dataset.shown || 0), hits = Number(host.dataset.hits || 0);
  setText(qs('#jrn-count-hint', host), hits > shown ? 'zobrazeno ' + shown + ' z ' + hits : '');

  for (const c of qsa('#jrn-filters .chip', host)) {
    const on = (c.dataset.val || 'all') === u.filter;
    c.classList.toggle('is-active', on);
    setAttrIf(c, 'aria-pressed', on ? 'true' : 'false');
  }
}

/* ======================= rychlý zápis ================================= */

// Uloží jeden nákup z formuláře. Vrací nový záznam, nebo null, když se nic
// neuložilo. Do entry.act NEZAPISUJE — skutečnost se z deníku dopočítává.
function quickAddSubmit(form) {
  if (!form) return null;
  const H = renderJournalScreen.h;
  const amtIn = qs('[data-f="amt"]', form);
  const dateIn = qs('[data-f="date"]', form);
  const catIn = qs('[data-f="cat"]', form);
  const noteIn = qs('[data-f="note"]', form);
  if (!amtIn) return null;

  // Jediný povolený parser. Prázdné pole vrací null, nikdy nulu.
  const r = parseCzkInput(amtIn.value);
  if (!r.ok) return H.mark(amtIn, 'Tohle číslo neumím přečíst. Zkus 250 nebo 1 234,50.');
  if (r.minor === null) return H.mark(amtIn, 'Napiš částku, jinak nemám co zapsat.');
  if (r.minor === 0) return H.mark(amtIn, 'Nula se do deníku nezapisuje.');
  H.mark(amtIn, '');

  const d = (dateIn && parseYmd(dateIn.value)) ? dateIn.value : todayISO();
  // Rozpočtový měsíc řezem řetězce YYYY-MM-DD. Přes Date/toISOString by
  // 1. února v pražském čase spadl do ledna a nákup by zmizel o měsíc zpět.
  const mm = Number(d.slice(5, 7)) - 1;
  if (Number(d.slice(0, 4)) !== state.activeYear) {
    return H.mark(dateIn, 'Datum musí být v roce ' + state.activeYear + '. Rok se přepíná nahoře.');
  }
  H.mark(dateIn, '');
  const cat = (catIn && catIn.value) ? catIn.value : null;
  if (!cat) return H.mark(catIn, 'Vyber kategorii.');

  const amt = Math.abs(r.minor);   // model: částky se ukládají kladně, směr dá sekce
  const tx = addTx({ d: d, m: mm, cat: cat, amt: amt, note: noteIn ? String(noteIn.value).trim() : '' });
  if (!tx || !tx.id) return H.mark(amtIn, 'Zápis se nepodařilo uložit. Zkus jinou částku.');
  const newId = tx.id;

  toast('Zapsáno ' + formatCzk(amt) + ' — ' + H.label(H.cat(cat)), {
    action: TXT.undo,
    onAction: function () {
      if (newId) { try { removeTx(newId); } catch (e) {} }
      scheduleSave(); renderApp();
    },
  });

  // Panel zůstává otevřený: druhý nákup v řadě je jen částka a Uložit.
  amtIn.value = '';
  if (noteIn) noteIn.value = '';
  scheduleSave();
  renderApp();
  try { amtIn.focus({ preventScroll: true }); } catch (e) {}
  return tx;
}

/* ---------- panely ---------- */

// Rychlý zápis: dvě klepnutí a číslo.
renderJournalScreen.h.quick = function () {
  const H = this;
  const cats = H.catalogList();
  if (!cats.length) {
    toast('Nejdřív si na obrazovce Měsíc přidej kategorii, do které se má nákup zapsat.');
    return;
  }
  const recent = recentCats(5);
  const preselect = recent.length ? recent[0] : cats[0].id;

  openSheet({
    title: TXT.quickAdd,
    build: function (body) {
      const form = el('form', { id: 'qa-form', novalidate: true, autocomplete: 'off',
        style: 'display:flex;flex-direction:column;gap:var(--sp-4)' });

      // --- částka: první pole, samo se zaostří, decimální klávesnice ---
      const fa = H.field('Kolik to stálo', 'amt', { type: 'text', inputmode: 'decimal',
        enterkeyhint: 'done', autocorrect: 'off', autocapitalize: 'off',
        spellcheck: 'false', placeholder: '0',
        style: 'font-size:var(--fs-2xl);font-weight:var(--fw-bold)' });
      const amt = fa.querySelector('input');
      amt.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();                        // Enter ukládá, panel nezavírá
        quickAddSubmit(form);
      });
      form.appendChild(fa);

      // --- kategorie: pět naposledy použitých na klepnutí, pod tím všechny ---
      const wrap = el('div', { style: 'display:flex;flex-direction:column;gap:var(--sp-2)' });
      wrap.appendChild(el('span', { class: 'field-label' }, 'Kategorie'));
      const chips = H.strip({ role: 'group', 'aria-label': 'Naposledy použité kategorie' });
      const sel = H.catSelect(cats, false);
      sel.value = preselect;
      function syncChips() {
        for (const ch of qsa('.chip', chips)) {
          const on = ch.dataset.val === sel.value;
          ch.classList.toggle('is-active', on);
          setAttrIf(ch, 'aria-pressed', on ? 'true' : 'false');
        }
      }
      for (const id of recent) {
        const c = H.cat(id);
        if (!c) continue;
        const ch = H.chip(id, H.label(c), null);
        ch.addEventListener('click', function () { sel.value = id; syncChips(); });
        chips.appendChild(ch);
      }
      if (chips.childNodes.length) wrap.appendChild(chips);
      const selLabel = el('label', { class: 'field' });
      selLabel.appendChild(el('span', { class: 'field-label sr-only' }, 'Vybrat ze všech kategorií'));
      selLabel.appendChild(sel);
      selLabel.appendChild(el('span', { class: 'field-hint' }));
      wrap.appendChild(selLabel);
      sel.addEventListener('change', syncChips);
      syncChips();
      form.appendChild(wrap);

      // --- datum: dnešek přes todayISO(), nikdy přes toISOString ---
      const fd = H.field('Datum', 'date', { type: 'date' });
      fd.querySelector('input').value = todayISO();
      form.appendChild(fd);
      form.appendChild(H.field('Poznámka (nepovinná)', 'note',
        { enterkeyhint: 'done', placeholder: 'třeba kde' }));

      form.appendChild(el('button', { class: 'btn btn-primary', type: 'submit' }, 'Uložit a psát dál'));
      form.addEventListener('submit', function (e) { e.preventDefault(); quickAddSubmit(form); });
      body.appendChild(form);
    },
    foot: [{ label: TXT.close, kind: 'ghost', value: null }],
    onClose: function () { renderApp(); },
  });
};

// Úprava jednoho zápisu. Mazání je měkké a vrací se hláškou, ne oknem.
renderJournalScreen.h.edit = function (id) {
  const H = this;
  const yr = H.year();
  let tx = null;
  for (const t of ((yr && Array.isArray(yr.tx)) ? yr.tx : [])) if (t && t.id === id) { tx = t; break; }
  if (!tx || tx.del) return;
  const cats = H.catalogList();
  const m0 = String(clamp(num(tx.m), 0, 11));

  openSheet({
    title: 'Upravit zápis',
    build: function (body) {
      const form = el('form', { id: 'tx-form', novalidate: true, autocomplete: 'off',
        style: 'display:flex;flex-direction:column;gap:var(--sp-4)' });

      const fa = H.field('Částka', 'amt', { inputmode: 'decimal', enterkeyhint: 'done',
        autocorrect: 'off', spellcheck: 'false' });
      fa.querySelector('input').value = fmtEdit(tx.amt);
      form.appendChild(fa);

      const fd = H.field('Datum', 'date', { type: 'date' });
      const date = fd.querySelector('input');
      date.value = parseYmd(tx.d) ? tx.d : todayISO();
      form.appendChild(fd);

      const fm = el('label', { class: 'field' });
      fm.appendChild(el('span', { class: 'field-label' }, 'Rozpočtový měsíc'));
      const mon = el('select', { class: 'field-input' });
      mon.dataset.f = 'month';
      for (let i = 0; i < 12; i++) mon.appendChild(el('option', { value: String(i) }, MONTHS_NOM[i]));
      mon.value = m0;
      fm.appendChild(mon);
      fm.appendChild(el('span', { class: 'field-hint' },
        'Nákup z 1. února může patřit ještě do lednového rozpočtu.'));
      form.appendChild(fm);
      // Posun data táhne měsíc s sebou, dokud si ho uživatelka nepřepsala sama.
      date.addEventListener('change', function () {
        const p = parseYmd(date.value);
        if (p && mon.value === m0) mon.value = String(p.m);
      });

      const fc = el('label', { class: 'field' });
      fc.appendChild(el('span', { class: 'field-label' }, 'Kategorie'));
      const sel = H.catSelect(cats, true);
      // Archivovaná kategorie v nabídce není, ale zápis o ni nesmí přijít.
      if (tx.cat && !cats.some(function (c) { return c.id === tx.cat; })) {
        const keep = H.cat(tx.cat);
        if (keep) sel.appendChild(el('option', { value: keep.id }, H.label(keep)));
      }
      sel.value = tx.cat || '';
      fc.appendChild(sel);
      fc.appendChild(el('span', { class: 'field-hint' }));
      form.appendChild(fc);

      const fn = H.field('Poznámka', 'note', {});
      fn.querySelector('input').value = tx.note || '';
      form.appendChild(fn);

      form.addEventListener('submit', function (e) { e.preventDefault(); });
      body.appendChild(form);
    },
    foot: [
      {
        label: TXT.del, kind: 'danger',
        onClick: function () {
          try { removeTx(tx.id); } catch (e) {}
          scheduleSave();
          toast('Zápis smazán.', {
            action: TXT.undo,
            onAction: function () {
              // removeTx() si vrácení připravil sám, undoLast() ho jen spustí.
              const r = undoLast();
              if (!r || !r.ok) toast('Vrátit zpět se bohužel nepovedlo.');
              scheduleSave(); renderApp();
            },
          });
          return true;
        },
      },
      {
        label: TXT.save, kind: 'primary',
        onClick: function (bodyEl) {
          const form = qs('#tx-form', bodyEl) || bodyEl;
          const amtIn = qs('[data-f="amt"]', form), dateIn = qs('[data-f="date"]', form);
          const r = parseCzkInput(amtIn.value);
          if (!r.ok || r.minor === null || r.minor === 0) {
            H.mark(amtIn, 'Napiš platnou částku.');
            return false;
          }
          H.mark(amtIn, '');
          const d = (dateIn && parseYmd(dateIn.value)) ? dateIn.value : tx.d;
          if (Number(d.slice(0, 4)) !== state.activeYear) {
            H.mark(dateIn, 'Datum musí být v roce ' + state.activeYear + '.');
            return false;
          }
          try {
            updateTx(tx.id, {
              d: d,
              m: clamp(Math.round(Number(qs('[data-f="month"]', form).value)), 0, 11),
              cat: qs('[data-f="cat"]', form).value || null,
              amt: Math.abs(r.minor),
              note: String(qs('[data-f="note"]', form).value).trim(),
            });
          } catch (e) { toast('Zápis se nepodařilo uložit.'); return false; }
          scheduleSave();
          return true;
        },
      },
    ],
    onClose: function () { renderApp(); },
  });
};
